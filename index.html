<script type="application/json" id="fsimage">{"fs":{"etc":{"group":"root:x:0:\ndesk:x:20:guest\nguest:x:1000:\n","hostname":"reading\n","motd":"Reading OS\nAtlas OS {version} · {tty}\nThis is the Terminal of Reading OS, a reading site that runs the Atlas OS desktop in your browser. The notes are mounted read-only at /Reading: ls, cat and grep work on their stubs, and open shows a note in Reader.\n\nType help for every command, man reading-os for how this copy works, or open ~/Reading to see the notes in Finder.\n","os-release":"NAME=\"Reading OS\"\nID=reading\nID_LIKE=atlas\nVERSION=\"Atlas 1.0.0 (plate)\"\nPRETTY_NAME=\"Reading OS on Atlas OS 0.2.2\"\n","passwd":"root:x:0:0:root:/root:/bin/sh\nguest:x:1000:1000:Reader:/home/guest:/bin/sh\n","profile":"# /etc/profile: read by every login shell, before ~/.profile\nexport PATH=\"$HOME/bin:/bin:/usr/bin\"\nexport EDITOR=edit PAGER=less\nPS1='\\[\\e[1m\\]\\w\\[\\e[22m\\] \\S '\nalias ll='ls -l'\nalias la='ls -A'\nalias l='ls -1'\nalias ..='cd ..'\nalias vi=edit\nalias vim=edit\nalias h=history\n","shells":"/bin/sh\n"},"home":{"guest":{".profile":"# ~/.profile: your own login settings, read after /etc/profile.\n# Change it with: edit ~/.profile\nexport GREETING=\"Good to see you\"\n",".shrc":"# ~/.shrc: read by every interactive shell. Functions and aliases go here.\nmkcd() { mkdir -p \"$1\" && cd \"$1\"; }\n","Desktop":{"Welcome.md":"# Welcome to Reading OS\n\nReading OS is this reading site with the Atlas OS desktop around it. The notes are the same pages as on the rest of the site; here they open in windows, and the shelf of every note is the desktop behind them.\n\n## The apps\n\n- **Shelf** is the board of all notes, behind every window. Click a note to see it, and Read note to open it.\n- **Reader** shows one note per window. Back and Forward work inside it, and the depth control switches G1 to G4.\n- **Today** lists the latest daily report, rereads that are due and notes you are reading. When nothing is due it says so.\n- **After Hours** is a focus timer with optional lo-fi music. Each finished session leaves a star.\n- **Files** (Finder) shows the notes as a read-only folder, `/Reading`. Each `.note` file is a short stub that links to the note page.\n- **Console** shows what happened since this page loaded, and the build log in `/var/log/build.log`.\n\n## Keys\n\nThe browser keeps ⌘ for itself, so Atlas uses ⌥ where a Mac uses ⌘. ⌘K is the exception: it opens Spotlight.\n\n| Key | What |\n|---|---|\n| ⌘K or ⌥Space | Spotlight: find a note, a field or a daily report |\n| ⌥Tab | switch apps |\n| ⌥W ⌥M ⌥H | close, minimise, hide |\n| ⌥↑ | Mission Control |\n| ⌃⌥Q | lock the screen |\n\n## Your data\n\nEverything stays in this browser. Reading progress, rereads, highlights and margin notes are kept apart from this disk, so Erase and restart in System Settings clears only the desktop's files and windows. Control Center has a Reading data sheet that lists every saved item and copies it as JSON.\n\nReading OS has no assistant, and it sends nothing anywhere.\n"},"Documents":{"atlas-rules.md":"# Atlas, in seven rules\n\n1. **The canvas is a desk, not a page.** Warm dotted paper under everything. The menu bar and the Dock are glass objects at its edges; step back with ⌥↑ to see the whole desk.\n2. **Things are objects.** Every terminal and document is a plate with a white rim, a little air and a warm shadow.\n3. **Interface retreats to the edges and becomes colour.** State is a coloured rim and three discs without words.\n4. **Information on demand.** Hover for a card; it never covers what you are looking at.\n5. **Swiss type.** One sans, one mono. Small capitals with wide tracking for labels, large tight titles.\n6. **Frosted glass and Apple radii.** One glass recipe. Radii of 7, 10, 14, 22 and 34.\n7. **Motion is physics.** Springs, slow breathing and a golden-angle spiral. Reduced motion holds everything still.\n","fruits.csv":"name,colour,price,stock\napple,red,0.50,120\nbanana,yellow,0.25,200\ncherry,red,3.00,40\ndate,brown,2.40,15\nelderberry,purple,4.10,8\nfig,purple,1.20,30\ngrape,green,2.00,90\nkiwi,brown,0.60,75\nlemon,yellow,0.45,110\nmango,orange,1.50,60\n","notes.txt":"paper\npencil\nplate\nlamp\npaper\nclock\npencil\npaper\nruler\nlamp\npaper\n","shell.md":"# Shell, on one page\n\n### Moving around\n```\npwd                 where am I\ncd docs             go in\ncd ..  /  cd -      go up  /  go back\nls -la              everything, in detail\ntree -L 2           the shape of a folder\n```\n\n### Looking at text\n```\ncat file            all of it\nless file           a page at a time (q to leave)\nhead -n 5 file      the start\ntail -f log         the end, as it grows\ngrep -rn word .     find a word, with line numbers\nwc -l file          count lines\n```\n\n### Joining programs\n```\ncmd > file          write output to a file\ncmd >> file         add to it\ncmd 2>&1 | less     errors too, a page at a time\na | b | c           pipe one into the next\n$(cmd)              use a command's output as words\n```\n\n### Jobs\n```\nlong-task &         run in the background\njobs  /  fg  /  bg  list, bring back, resume\nCtrl-Z              stop the running job\nkill %1             end job 1\n```\n"},"Downloads":{},"Library":{"Preferences":{"com.atlas.user.json":"{\n  \"name\": \"Reader\",\n  \"autologin\": true\n}\n"}},"Pictures":{"Desk.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"600\" height=\"760\" viewBox=\"0 0 600 760\">\u003cdefs>\u003cpattern id=\"g\" width=\"24\" height=\"24\" patternUnits=\"userSpaceOnUse\">\u003ccircle cx=\"12\" cy=\"12\" r=\"1.1\" fill=\"#d3d0c7\"/>\u003c/pattern>\u003c/defs>\u003crect width=\"600\" height=\"760\" fill=\"#ecebe6\"/>\u003crect width=\"600\" height=\"760\" fill=\"url(#g)\"/>\u003crect x=\"12\" y=\"12\" width=\"576\" height=\"28\" rx=\"14\" fill=\"#fff\" fill-opacity=\".7\" stroke=\"#fff\"/>\u003cg fill=\"#23221d\">\u003ccircle cx=\"32\" cy=\"26\" r=\"2.6\"/>\u003ccircle cx=\"29\" .6 329h0M249 372.8h0M336.8 232.7h0M366.8 396.1h0M233.7 295.4h0M400.6 279.7h0M287.7 404.5h0M286.6 235.5h0M402.1 359.9h0M232.2 346.1h0M367.3 241.1h0M338.5 410.5h0M244.9 265.5h0M412.6 309.4h0M258.6 390.6h0M317.5 226.1h0M385.5 387.8h0M225.5 314.2h0M393.9 260.2h0M305.8 414.3h0M266.5 240.6h0M413.5 342.5h0M235.5 366.7h0M350.8 228.2h0M359.4 408.9h0M230.6 281h0M412.7 288.2h0M272.9 406.3h0M296.3 224.2h0M402.5 374.8h0M221.8 335.3h0M382.3 242.1h0M326.7 419.9h0M247.3 250.7h0M420.8 322h0M244.1 386.8h0M330.9 219.1h0M380.3 402.1h0M219.8 300.2h0M407.6 266.7h0M291.3 418.8h0M274.3 227.5h0M416.5 357.5h0M223.2 357.7h0\" stroke=\"#80502c\" stroke-width=\"11.2\" stroke-linecap=\"round\" fill=\"none\"/>\u003c/svg>\n"},"README.md":"# Reading OS\n\nThis home folder belongs to the Atlas OS desktop that Reading OS runs in. The notes are not stored here: `~/Reading` is a link to `/Reading`, a read-only folder made from the site's catalog each time the page loads.\n\n### Start here\n\n- `ls ~/Reading` lists the sections; `cat` on a `.note` file prints its stub (title, field, summary and the page it links to).\n- `open ~/Reading` shows the notes in Finder.\n- ⌘K or ⌥Space is Spotlight: type a note title, a field or `today`.\n- `help` lists every command, grouped. `man reading-os` explains this copy, and `man atlas` the desktop it runs on.\n\n### Try\n\n```\nls ~/Reading\ngrep -rl Transformer ~/Reading | head\ncat /var/log/build.log\nls -la | grep md\nsort Documents/notes.txt | uniq -c | sort -rn\ndefaults write dock tilesize -int 64\n```\n\n### Your files\n\nFiles you make here live in a disk image in this browser, up to about 5 MB. `/Reading` cannot be written to. Erase and restart (System Settings) or `factory-reset --yes` starts this disk over and leaves your reading data alone.\n","bin":{"backup":"#!/bin/sh\n# backup: copy a directory into ~/backups with a time stamp. Usage: backup directory\n[ -d \"$1\" ] || { echo \"usage: backup directory\" >&2; exit 2; }\ndest=\"$HOME/backups/$(basename \"$1\")-$(date +%Y%m%d-%H%M%S)\"\nmkdir -p \"$HOME/backups\" && cp -r \"$1\" \"$dest\" && echo \"saved $(find \"$dest\" -type f | wc -l) files to $dest\"\n","countdown":"#!/bin/sh\n# countdown: count down on one line, then ring the bell. Usage: countdown [seconds]\nn=${1:-5}\nwhile [ \"$n\" -gt 0 ]; do\n  printf '\\r%s ' \"$n\"\n  sleep 1\n  n=$((n - 1))\ndone\nprintf '\\rDone.\\a\\n'\nnotify \"Countdown finished\" 2>/dev/null\n","fib":"#!/bin/sh\n# fib: Fibonacci numbers, and how the ratio of neighbours approaches phi. Usage: fib [count]\na=1 b=1 i=1\nprintf '%3s %8s  %s\\n' n fib ratio\nwhile [ \"$i\" -le \"${1:-12}\" ]; do\n  printf '%3d %8d  %s\\n' \"$i\" \"$a\" \"$(calc \"$b / $a\")\"\n  t=$((a + b)); a=$b; b=$t; i=$((i + 1))\ndone\necho \"phi = $(calc phi)\"\n","hello":"#!/bin/sh\n# hello: greet someone. Usage: hello [name]\nname=${1:-$USER}\necho \"Hello, $name. It is $(date +%H:%M) on $(hostname).\"\nif [ -n \"$GREETING\" ]; then echo \"$GREETING.\"; fi\n"}}},"root":{},"usr":{"bin":{},"share":{"man":{"atlas.md":"# Atlas\n\n### Name\natlas — the desktop Reading OS runs on: a desk-shaped operating system written from scratch in JavaScript\n\n### Description\nAtlas works like a Mac: a menu bar, a Dock, windows with traffic lights, Finder, Spotlight, Mission Control. Every app is a view of plain files that a command can also read and write. In Reading OS it runs as it was written, with the reading apps added (`man reading-os`) and Calendar, Reminders, Notes, Calculator and Activity Monitor left out.\n\n- **The kernel** keeps a process table. Every program, and every running app, is a process with a pid, a parent, a session, file descriptors and a working directory. Signals interrupt them; `ps` and `top` show them.\n- **The file system** is a tree of inodes with mounts. `/` is a 5 MB disk image saved in this browser, `/Reading` is the notes (read-only), `/proc` describes the running system, `/dev` holds devices, `/tmp` is forgotten at reboot. See `man hier`.\n- **The terminal** has an ANSI parser, a line editor with history and completion, and an alternate screen for `top`, `less` and `edit`.\n- **The shell** reads a POSIX-style language: pipes, redirection, here-documents, expansions, loops, functions and job control. See `man sh`.\n- **windowd** draws the desktop in the Atlas design language: paper, plates, one frosted glass, three state colours.\n\n### Every click has a command\nRest on a menu item and the command it stands for appears beneath it; hold ⌥ to see every command; choose an item with ⌥ held to run its command in Terminal. Clicks are written to `~/.sh_history` as `command  # via Finder`, so ↑ in Terminal replays them.\n\n| What | Where | Command |\n|---|---|---|\n| Settings | `~/Library/Preferences/*.json` | `defaults` |\n| Notifications | `~/Library/Notifications/log` | `notify`, `tail` |\n| Finder tags | the file itself | `tag` |\n| Finder selection | `/dev/selection` | `sel` |\n\n### Commands that drive the desktop\n`open` (files, folders, `-a` apps, `-R` reveal, `-f` show standard input on paper), `defaults`, `pbcopy` and `pbpaste`, `trash`, `tag`, `sel`, `mdfind`, `notify`, `killall`, `lock`, `pmset`, `ql`. Run `help Desktop` for the full list.\n\n```\nopen ~/Reading\nfind ~/Reading -name '*.note' | head\nsort ~/Documents/notes.txt | open -f\ndefaults write dock tilesize -int 64\n```\n\n### Keys\nThe browser keeps ⌘ for itself, so Atlas uses ⌥ where a Mac uses ⌘, and ⌃⌥ where a Mac uses ⌥⌘. ⌘C, ⌘V, ⌘X, ⌘A, ⌘Z, ⌘S and ⌘F keep their Mac meaning, and in Reading OS ⌘K opens Spotlight.\n\n| Key | Action |\n|---|---|\n| ⌥Space | Spotlight |\n| ⌥Tab | switch apps |\n| ⌥` | next window of the app |\n| ⌥N ⌥W | new window, close window |\n| ⌥M ⌥H ⌥Q | minimise, hide, quit |\n| ⌥T | new Terminal here |\n| ⌥L | the prompt |\n| ⌥, | settings |\n| ⌥↑ ⌥↓ | Mission Control, App Exposé |\n| ⌃⌥← ⌃⌥→ | tile left, right |\n| ⌃⌥F | fill the screen |\n| ⌥A, F4 | Launchpad |\n| F11 | show the desktop |\n| ⌃⌥Q | lock the screen |\n| ⌃⌥⎋ | Force Quit |\n\n### Windows and state\nA window is a plate on the paper. Its rim reports state in colour: yellow while a command runs, brick after a failure until your next command, green for a moment when a long command finishes. The three discs in the menu bar count what needs you, what is running and what is done in this browser.\n\n### See also\nhelp, man reading-os, man sh, man hier, open, defaults, about\n","hier.md":"# hier\n\n### Name\nhier — the layout of the Reading OS file system\n\n| Path | What lives there |\n|---|---|\n| `/bin` | programs: each file is a small stub naming a built-in program |\n| `/etc` | system settings: `profile`, `motd`, `hostname`, `passwd` |\n| `/Applications` | one folder per app (`Finder.app`, `Terminal.app`…), so `ls`, Finder and `open -a` agree |\n| `/Reading` | the notes, read-only, made from the site's catalog when the page loads: one folder per section and one `.note` stub per note |\n| `/home/guest` | your home: `Desktop` (also where files dropped from your computer land), `Documents`, `Downloads`, `Pictures`, `Library` (`Preferences`, `Notifications/log`), `.Trash`, `bin` (your scripts, on PATH), and `Reading`, a link to `/Reading` |\n| `/proc` | the running system, generated as you read it: one directory per process, plus `uptime`, `meminfo`, `cpuinfo`, `loadavg` and `mounts` |\n| `/dev` | devices: `null`, `zero`, `random`, `tty`, one `ttyN` per terminal, and `selection` (what is selected in Finder) |\n| `/tmp` | scratch space in memory, forgotten at reboot |\n| `/usr/share/man` | these manual pages, in Markdown |\n| `/var/log` | `lastlog`, and `build.log`, the facts of the site build (read-only) |\n\nEverything except `/Reading`, `/proc`, `/dev`, `/tmp` and `/var/log/build.log` is saved in this browser as one disk image of up to about 5 MB. `df -h` shows how full it is.\n","reading-os.md":"# Reading OS\n\n### Name\nreading-os — the reading site, running as an Atlas OS desktop\n\n### Description\nReading OS is a static web page. It runs the Atlas OS 0.2.2 desktop (kernel, file system, windows, Finder, Terminal, Spotlight, Control Center, System Settings) and installs the reading site as apps. Nothing runs on a server: the page, the notes and the catalog were built ahead of time, and the build time and source commit are in `/var/log/build.log`.\n\n### The apps\n\n| App | What it shows |\n|---|---|\n| Shelf | the board of every note, as the desktop layer |\n| Reader | one note page per window |\n| Today | the latest daily report, rereads that are due, notes in progress |\n| After Hours | a focus timer; each finished session is a star |\n| Files | `/Reading`, the notes as a read-only folder |\n| Console | what happened since the page loaded, and the build log |\n\n### Files\n- **/Reading** is mounted read-only from the site's catalog each time the page loads. It mirrors the folders of the site; each note is a `\u003cname>.note` stub that names the note and links to its page. The note text is not stored there. Writing to it fails with \"Read-only file system\".\n- **~/Reading** is a link to `/Reading`.\n- **/var/log/build.log** holds the facts of the build: when it ran, the source commit, how many notes and folders, the latest daily report, and the leak check (a build that finds a leak is not published).\n\n### Your data\nEverything is kept in this browser under keys that start with `rdg-`. This disk image is `rdg-fs` and the open windows are `rdg-os-session`; Erase and restart removes only those two. Reading progress, rereads and highlights live under their own keys and stay. Control Center › Reading data lists every key and copies them as JSON.\n\n### What it does not do\nReading OS has no assistant. `ask` and `explain` exit with status 69. It makes no network requests of its own; fonts and the note pages' math and diagram libraries load from their public CDNs.\n\n### Keys\n⌘K or ⌥Space opens Spotlight, except in Terminal, where ⌘K clears the screen. Every other key is Atlas's: see `man atlas`.\n\n### See also\nman atlas, man hier, man sh\n","sh.md":"# sh\n\n### Name\nsh — the Atlas shell\n\n### Synopsis\n```\nsh [-c command [name args]] [-lixe] [script [args]]\n```\n\n### Grammar\n- **Pipelines**: `a | b | c`; `! a` inverts the status.\n- **Lists**: `a; b`, `a && b`, `a || b`, and `a &` to run in the background.\n- **Grouping**: `{ a; b; }` in this shell, `( a; b )` in a subshell.\n- **Redirection**: `> file`, `>> file`, `\u003c file`, `2> file`, `2>&1`, `&> file`, and here-documents `\u003c\u003cEOF` (`\u003c\u003c'EOF'` keeps `$` literal).\n- **Compound commands**: `if … then … elif … else … fi`, `for x in …; do …; done`, `while` and `until … do … done`, `case word in pattern) … ;; esac`.\n- **Functions**: `name() { … }`, with `local` variables and `return`.\n\n### Expansion\nIn order: braces `{a,b}` and `{1..9}`, tilde `~`, parameters `$x`, `${x:-default}`, `${x#prefix}`, `${x%suffix}`, `${x/old/new}`, `${#x}`, `${x:1:3}`, `${x^^}`, command substitution `$(…)`, arithmetic `$((…))`, word splitting on `IFS`, then globs `*`, `?` and `[a-z]`.\n\nSpecial parameters: `$?` `$$` `$!` `$#` `$@` `$*` `$0` to `$9`, plus `$RANDOM`, `$SECONDS`, `$PWD`, `$OLDPWD` and `$COLUMNS`.\n\n### Interactive use\nTab completes commands, paths and variables. ↑ ↓ and Ctrl-R search history; `!!`, `!$` and `!n` recall it. `jobs`, `fg`, `bg`, `wait` and `kill %n` manage background work, and Ctrl-Z stops the foreground job (a full-screen program such as `top` or `less` takes it as a key: leave it with `q`).\n\nThe prompt is `PS1`. Besides `\\w`, `\\u`, `\\h`, `\\t` and `\\e`, Atlas adds `\\S`: a mark that turns red when the last command failed.\n\n### Startup\nA login shell reads `/etc/profile`, then `~/.profile`. Every interactive shell then reads `~/.shrc`.\n\n### Not supported\nArrays, process substitution `\u003c(…)`, `&&` inside `[[ … ]]`, and `trap`.\n\n### Builtins\ncd, pwd, echo, printf, read, export, unset, set, shift, alias, unalias, history, type, which, command, source, eval, exit, return, break, continue, local, test, let, jobs, fg, bg, wait, kill, clear, exec, time, help.\n"}}},"var":{"log":{}}},"modes":{"/home/guest/bin/backup":"755","/home/guest/bin/countdown":"755","/home/guest/bin/fib":"755","/home/guest/bin/hello":"755"},"links":{"/home/guest/Reading":"/Reading","/home/guest/Desktop/Reading":"/Reading"}}</script>

分級精讀/B_學習理論、推理與表示幾何/26_概念空間幾何與認知拓撲","tier":"core","summary":"在離散的邏輯符號和低階的神經脈衝之間，這個領域建立第三層描述語言，也就是幾何。它研究人類心智與大型神經網路如何把概念編碼成凸區域、雙曲階層、量子投影子空間、平行四邊形概念晶體，以及可操作的拓撲骨架。","topics":["Shepard 普適指數衰減律","非歐層級與非對稱性","線性表示假說（LRH）的群作用公理化與概念晶體多胞形","共享流形以支持泛化，或分裂到正交子空間以避免任務干擾","純幾何夾角能否解釋特徵干涉","跨視覺型態（照片 ↔ 素描 ↔ 醫學影像）的語意投影對齊（SPACE）"]},{"id":"n-b3add3e6","ch":4,"title":"高階範疇論（Higher Category Theory & Derived Geometry）","prefix":"11","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/11_%E9%AB%98%E9%9A%8E%E7%AF%84%E7%96%87%E8%AB%96.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/11_高階範疇論","tier":"core","summary":"兩個物件「以哪一種方式同構」（見證路徑、路徑之間的變形，乃至無窮階相容性），在數學裡到處出現，傳統集合論卻把它抹平。高階範疇論把這些資訊全部保留為一等公民，替現代幾何、拓撲與物理提供一套通用的組裝框架，不丟失高階對稱性與橫截相交資訊。","topics":["計算與形式化驗證的可擴展性挑戰","遷移至 05_形式化與推理 與軟體工程（保留見證而非布林抹除）"]},{"id":"n-5023aa22","ch":4,"title":"HoTT與類型論（Homotopy Type Theory & Univalent Foundations）","prefix":"12","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/12_HoTT%E8%88%87%E9%A1%9E%E5%9E%8B%E8%AB%96.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/12_HoTT與類型論","tier":"core","summary":"同倫類型論（HoTT）把三樣東西合而為一：程式／資料型別、邏輯命題／證明、拓撲空間／連續路徑，影響遍及邏輯、計算機科學與幾何學。數學家日常的直覺是「同構的結構即可視為相等」，它透過單價公理（Univalence）給這個直覺一個嚴格、可由電腦驗算的基礎。","topics":["有向類型論（Directed Type Theory）的統一語法與對偶扭轉","大型形式化生態分裂與 AI 自動驗證合成（Vericoding）"]},{"id":"n-9cd2625e","ch":4,"title":"代數幾何與Hodge（Algebraic Geometry, Hodge Theory & Motives）","prefix":"13","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/13_%E4%BB%A3%E6%95%B8%E5%B9%BE%E4%BD%95%E8%88%87Hodge.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/13_代數幾何與Hodge","tier":"core","summary":"代數幾何與 Hodge 理論研究的是，怎麼在離散的多項式代數、連續的複流形微積分和有限域上的算術數論這三個看似不相干的領域之間，建立像羅塞塔石碑那樣可以互相對照的翻譯。它的中心問題是：一個空間的拓撲洞（上同調類），在什麼條件下確實是由多項式方程定義出來的幾何子空間（代數閉鏈），而不只是分析上算出來的東西？","topics":["代數閉鏈構造極限與自守上同調障礙","非阿貝爾 Hodge 理論中的「墨菲定律（Murphy's Law）」與算術剛性","p-進 Hodge、凝聚分析空間與母題同倫的統一","遷移至 22_moiré物理與複雜系統（穩定性跨牆公式與相圖跳躍）","Murphy's law in non-abelian Hodge theory"]},{"id":"n-5f638e6a","ch":4,"title":"代數拓撲（Algebraic Topology, Spectral Sequences & Chromatic Homotopy）","prefix":"14","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/14_%E4%BB%A3%E6%95%B8%E6%8B%93%E6%92%B2.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/14_代數拓撲","tier":"core","summary":"代數拓撲把可以任意拉扯扭曲的連續幾何形狀，轉換成剛性的離散代數不變量，像是替形狀取指紋。到了現代的穩定與色層同倫論（Chromatic Homotopy Theory），人們還發現高維空間裡糾纏在一起的現象，可以像白光穿過三稜鏡那樣，按素數 p 與形式群高度 n 分解成一張有規律的「拓撲元素週期表」。","topics":["譜序列：從局部碎片逐層逼近全局的計算工具（Spectral Sequences）","正特徵代數幾何與拓撲譜序列的非退化極限","從「全可逆群胚」走向「有向與帶伴隨高階拓撲」","高階色層結構與量子場論高階反常（Higher Anomalies）的精確算表","遷移至 22_moiré物理與複雜系統（配邊不變量分類拓撲物態）"]},{"id":"n-f1762f98","ch":4,"title":"應用範疇論（Applied Category Theory, Compositionality & Markov/Poly Systems）","prefix":"15","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/15_%E6%87%89%E7%94%A8%E7%AF%84%E7%96%87%E8%AB%96.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/15_應用範疇論","tier":"core","summary":"範疇論曾被調侃為「抽象廢話（Abstract Nonsense）」，應用範疇論把它變成一門研究各種系統如何互連、開放系統如何組合的學問（Science of Compositionality）。","topics":["連續時間隨機／非確定性開放系統的行為可表性（Clock Systems）","從「靜態接線圖」走向「自修改動態拓撲（Dynamic Rewiring）」"]},{"id":"n-d7942c12","ch":4,"title":"凝聚數學與合成微分幾何（Condensed Mathematics, Synthetic Differential Geometry & Tangent Categories）","prefix":"30","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/30_%E5%87%9D%E8%81%9A%E6%95%B8%E5%AD%B8%E8%88%87%E5%90%88%E6%88%90%E5%BE%AE%E5%88%86%E5%B9%BE%E4%BD%95.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/30_凝聚數學與合成微分幾何","tier":"core","summary":"這個領域用兩條互補的路線重寫分析學與微積分的基礎。凝聚數學（Condensed Mathematics）用收斂序列這類探針上的層取代傳統的點集拓撲空間，讓無限維泛函分析與巴拿赫空間可以放進同調代數。","topics":["拓撲阿貝爾群不是阿貝爾範疇（代數與分析接不起來）","光滑流形缺乏冪零無窮小與函數空間的笛卡爾閉性（微積分的組合操作很笨重）","凝聚集合（Condensed Set）","合成微分幾何（Kock–Lawvere 公理）","Kock–Lawvere 公理（SDG）","公理化內聚性（Cohesion）"]},{"id":"n-beef8afd","ch":4,"title":"認識邏輯與信念修正（Epistemic Logic, Dynamic Updates & AGM Belief Revision）","prefix":"31","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/31_%E8%AA%8D%E8%AD%98%E9%82%8F%E8%BC%AF%E8%88%87%E4%BF%A1%E5%BF%B5%E4%BF%AE%E6%AD%A3.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/31_認識邏輯與信念修正","tier":"core","summary":"認識邏輯與信念修正是一套形式微積分，刻畫兩件事：誰知道誰知道什麼（高階心智理論 Theory of Mind），以及新證據和舊世界觀衝突時，理性主體怎麼用最小的改動重組知識庫。多智能體社會推理、賽局共識，以及當代大型語言模型的知識編輯（Model Editing），都以它為公理基礎。","topics":["非單調信念衝突（Belief Revision）","認識可能世界圖（Kripke Model）","AGM 信念修正","LLM 的理性信念修正與社交壓力下的諂媚（Sycophancy）","不可知性（Unknowability / Fitch 悖論）與動態無切消證明論"]},{"id":"n-3c0ae2e8","ch":4,"title":"形式概念分析與格論（Formal Concept Analysis, Galois Connections & Lattice Embeddings）","prefix":"38","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/38_%E5%BD%A2%E5%BC%8F%E6%A6%82%E5%BF%B5%E5%88%86%E6%9E%90%E8%88%87%E6%A0%BC%E8%AB%96.html","path":"02_領域分級精讀/C_純數學、範疇論與邏輯基礎/38_形式概念分析與格論","tier":"core","summary":"形式概念分析（FCA）與格論替人和機器的概念（Concept）給出一個零參數的代數定義。只要一張「物件 × 屬性」觀察表，加上一組互為對偶的 Galois 連接，就能把雜亂的經驗資料整理成外延與內涵嚴格對應的完備概念格（Concept Lattice）。","topics":
