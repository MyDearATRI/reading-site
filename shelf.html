L 的數學基礎","反洩漏、揭露審計與免真值的守恆認證，都在談科學誠實度與可驗證的門檻","多尺度能動材料與統一世界模型，連起亞細胞物理、演化搜尋與意識機制"],"m":[]},"n-e7f97b28":{"i":"","t":["神經符號邏輯與物理微分守恆，用到資源極度受限、沒有標註的場域","最優傳輸（OT）在神經加速、逆問題辨識、因果擴展與複雜度下界四個方向同時有進展","高階範疇、類型論、博弈語意與弱算子拓撲，處理了學習、力學與驗證的幾個基礎障礙"],"m":[]},"n-e5d6b1ed":{"i":"","t":[],"m":[]},"n-80181d7c":{"i":"","t":["文字轉像素的上下文權衡、擴散語言模型排程與多模態殘差安全","幾何等變性的拓撲阻礙、可抽取對稱指紋與形式化溯源邊界","高階么半與線性邏輯匯流、概念格記憶檢索與計算難度上限","動態測度傳輸反演、粗糙因果收斂與非理想非局域物理保證","受控抹除與晝夜重播、科研演化博弈與統計嚴謹性檢定"],"m":[]},"n-5effc4ba":{"i":"","t":["專題一","專題二","專題三","專題四","專題五","專題六","專題七"],"m":[]},"n-99127ae1":{"i":"","t":["計算極限、最優傳輸相變與高維統計計算鴻溝路線","組合性、高階範疇、形式化驗證與神經符號推理路線","非平衡統計物理、連續時間神經網路與函數空間算子路線","認知記憶、因果測度、多智能體博弈與科學知識演化路線"],"m":[]},"n-cefa690d":{"i":"","t":[],"m":[]},"n-ed0a87fd":{"i":"S3 候選方向（數學 5、理論計算機 8、物理 4、經濟 4）各有一篇筆記，題目由學習者到時選定。物理線另有 A-level 的 14 篇（OxfordAQA 9630 規格書 3.1 到 3.14），排在 S1 之前。","t":[],"m":[]},"n-e1050175":{"i":"這類模型不再按時間步一格一格傳遞記憶，改用自注意力（Self-Attention）依內容動態尋址，讓序列中任意兩點的通訊距離降到 O(1)。再加上旋轉相對位置幾何、考慮 GPU 記憶體階層的演算法、細粒度稀疏混合專家（MoE）和計算最優擴展律，就是當代基礎模型共用的計算架構。","t":["FlashAttention 線上分塊重縮放（Dao et al., 2022）","QLoRA 資訊論最優量化微調（Dettmers et al., 2023）","矩陣正交化動量與自適應融合（2026 NAMO / FedCoMuon）","訓練期計算最優與推論期記憶體、異構部署成本的錯位","逐座標自適應（AdamW）與矩陣譜結構正交化（Muon）兩條最佳化路線","常駐共享基底加動態稀疏專科路由的架構模式","Attention Is All You Need","L5 深度審核完成","Scaling Laws for Neural Language Models"],"m":[]},"n-f8b21081":{"i":"這個領域的架構不走「先把一切切成離散詞元，再做 O(N^2) 全域兩兩比對」這條路，改用連續時間動力系統（Neural ODE / SSM）、邊樣條函數逼近（KAN）、抽象潛空間預測（JEPA）與物理事件驅動／超維代數計算（SNN / Reservoir / HDC）。","t":["超長連續訊號的二次方成本","逐像素／逐詞元生成把算力花在不可預測的雜訊上","多層感知機（MLP）的黑盒節點僵化","馮紐曼同步時脈的能耗極限","把固定齒輪換成可塑凸輪曲線的精密機械（KAN）","只預測棋局走勢、不背誦棋盤木紋的大師（JEPA）","結構化與選擇性狀態空間模型及線性循環復興（S4, Mamba & RWKV）","連續深度微分方程與時變液態動力系統（Neural ODE, LTC & CfC）","可學習邊樣條函數網路與非生成式潛空間預測（KAN & JEPA）","KAN（Kolmogorov–Arnold Networks）"],"m":[]},"n-f944d2d7":{"i":"工具鏈要做的事，是把只做過靜態預訓練的基座模型，變成可溯源、能做連續生成、守得住安全邊界、還能閉環行動的生產級系統。結構化記憶靠 GraphRAG 與圖最優傳輸對齊外掛，連續幾何生成靠薛丁格橋與直線流匹配（Flow Matching / Rectified Flow），真實世界的執行迴路則靠拉格朗日解耦偏好強化（Constrained G…","t":["知識凍結與黑盒幻覺","連續模態生成的彎曲耗散","後訓練對齊的刷分越界陷阱","自主智能體評測的時空作弊假象","車隊相對競速與獨立緊急煞車（Constrained GRPO）","配備歷史隔離沙盒的機械手臂（Autonomous SWE Agents）","黎曼流形無模擬流匹配（Chen & Lipman, 2024 RFM）","時間一致性零洩漏隔離協議（Sun et al., 2026，🏆 L5）","稠密神經檢索的隱式綜合力，與符號圖譜溯源的透明性和可問責性","交換半環 How-Provenance 多項式 → 自動化科學發現與形式化審計"],"m":[]},"n-08577994":{"i":"如果把模型架構比成引擎，預訓練資料配比就是決定基礎模型能力邊界的數位 DNA，基準評測則是儀表板，少了它就只能在古德哈特定律的迷霧裡盲飛。這個領域做兩件事：用精確去重、教科書級高密度合成與線性域歸因配比提高擴展律的效率，並用動態抗污染基準、裁判元評估與黑盒污染／配比逆向解剖，確保量到的是真實能力。","t":["規模飢渴與冗餘毒化的矛盾","排行榜繁榮與觀測等價性危機（Observational Equivalence）","語意級改寫／合成蒸餾污染，與事後檢測的統計變異限制","高純度合成資料的效率，與認知窄化和英語霸權","Benchmark characterization","Textbooks Are All You Need"],"m":[]},"n-3bb63738":{"i":"這個領域把看懂物理世界（多模態感知）和在世界中行動並承擔後果（序貫強化學習）合成一個閉環智能體。感知這一邊，把影像、壓縮視訊流與自然語言對齊成統一的自迴歸詞元。決策這一邊，用廣義優勢估計（GAE）、自我博弈搜尋與離線保守強化學習壓住高變異梯度與分布偏移。兩邊合起來，目標是能直接操控實體機器人的視覺語言動作模型（VLA）與物理世界模型。","t":["模態異質，以及理解與生成的表徵分裂","非平穩互動的代價與反事實高估（Distributional Shift）","資料驅動垂直微調的標註瓶頸，與世界模型視覺逼真但物理失真的問題","用視訊編解碼器（Codec）的位元成本流引導神經運算資源分配"],"m":[]},"n-2205d16f":{"i":"自然語言計算從一開始就有一個根本問題：控制流與資料流混同（Instruction-Data Confusion）。自然語言既是系統的最高指令，又是外部不可信的輸入。這個領域一方面研究攻擊能做到什麼程度，包括間接提示注入、推理模型自主越獄、跨智能體傳染、微調退化與潛伏欺騙特工（Sleeper Agents）。","t":["外部控制流劫持的矛盾","表層對齊的脆弱與策略性偽裝的矛盾","架構降權法（Jatmo, Piet et al., 2024）","偏好優先級對齊（SecAlign, Chen et al., 2025）","推理能力躍升對安全是助力還是威脅","開放通用智能體生態與零信任權限隔離的工程兩難","從整筆拒答改為局部定位切除（PromptLocate）的容錯設計"],"m":[]},"n-f9419ef9":{"i":"這個領域處理的是怎麼在物理矽晶片的熱力學極限內，搬運和排程千億參數的數學圖。峰值算力每兩年成長 3.0×，DRAM 與跨卡互連頻寬卻只成長 1.6×／1.4×。為了應付這道 AI 記憶體牆（Memory Wall），本領域用的工具有 Roofline 算術強度法則、算子內／算子間雙層自動並行編譯、作業系統虛擬分頁式的 KV 管理（Page…","t":["訓練端的顯存爆炸與通訊塞車矛盾","推論端的頻寬飢餓與動態顯存碎片矛盾","靜態圖封裝加速，與測試時動態稀疏及內部白盒干預之間的架構拉鋸","把古典作業系統五十年的設計模式對應到大模型系統","AI and Memory Wall"],"m":[]},"n-1edc210d":{"i":"這個領域收的是當代 AI 裡兩支都簡稱 LNN 的學派。兩者著力的層面不同，但都不走龐大黑盒模型的路。一支是 MIT 從線蟲突觸得到啟發的液態神經網路（Liquid Neural Networks：LTC / CfC / NCP / Liquid-S4），神經元的記憶時間常數會像流體一樣隨輸入即時伸縮。","t":["連續物理時間側的僵化（Liquid NN 處理的問題）","符號邏輯推理側被壓成黑盒（Logical NN 處理的問題）","邏輯神經網路（IBM Logical NN）是雙向透明的水晶邏輯電路板","液態脈絡 I：非脈衝化學突觸與液態時間常數網路（LSM → LTC & NCP）","四態認識語意與開放世界假設","帶權重實值 Łukasiewicz 合取神經元","全向邊界傳播與受約束梯度學習","Liquid Time-constant Networks","L5 深度審核完成","Logical Neural Networks"],"m":[]},"n-d8f24b84":{"i":"這個領域不把神經網路當成在平坦歐氏空間裡硬擬合曲線的黑盒。它把對稱群、層論黏合（Sheaf）、拓撲不變量、最優傳輸黎曼幾何、無窮維算子與代數幾何奇點直接寫進模型的假設空間與演化動力學。","t":["暴力黑盒學習","數學結構化 ML","高維最優傳輸的計算瓶頸、小批次偏差與無偏生成流","Lawvere 充實範疇視角（度量即邏輯、對偶即伴隨）","用層論的局部到全局一致性（Sheaf Cohomology）偵測矛盾","Topics in Optimal Transportation","L5 深度審核完成"],"m":[]},"n-88ae2043":{"i":"這個領域研究兩件事：一是兩個智能系統的座標軸完全不同，甚至來自不同感官模態或不同學科體系，為什麼仍會收斂出同構的內部關係幾何；二是怎麼不靠人工平行標註，就完成跨空間無監督對齊、模型縫合與高階結構類比。","t":["共享幾何是否等於共享物理與因果機制（柏拉圖假說的嚴格邊界）","跨模態對齊該用連續潛空間的黑盒調變，還是顯式的離散中間思維層","用非平衡 Gromov–Wasserstein（UGW）做科學史與學科演化對齊","演化樹與連續嵌入空間的雙向錨定","Information Distance","CAB: Connectionist Analogy Builder","L5 深度審核完成"],"m":[]},"n-46dee7c3":{"i":"這個領域用神經網路的直覺啟發式搜尋和強化學習自我博弈，去處理指數爆炸的推理搜尋空間，再用形式化證明助手（Lean 4）與可微實值邏輯（LNN / LTN）保證演繹的每一步都嚴格、沒有幻覺。這些都得在 P ≠ NP 劃下的計算極限之內進行。","t":["純強化學習隱式長思維鏈與顯式神經符號／形式化約束的路線之爭","自動形式化（Autoformalization）的語意保真瓶頸","PCP 用局部隨機抽檢換取全局可驗證性的思想","神經符號因果推理與訊號賽局（Signaling Games）","Some Optimal Inapproximability Results","L5 深度審核完成","The Lean mathematical library","Logical Neural Networks"],"m":[]},"n-2a2f903e":{"i":"這個領域一方面追蹤深度神經網路在訓練時間軸上的非線性相變（雙重下降與頓悟 Grokking），另一方面用稀疏自編碼器（SAE）與因果特徵電路，把擠在神經元疊加態裡的數百萬個人類概念逐一拆出來、定位並加以操控。","t":["訓練動力學之謎","內部黑盒多義性之謎","SAE 提取的是模型真實使用的因果原語，還是事後字典擬合的人工偽影","從自回歸單向流到雙向擴散語言模型（DLM）的時間軸可解釋性","自組織臨界性（SOC）與梯度雪崩監測"],"m":[]},"n-a7a688b9":{"i":"這個領域為所有學習系統劃出三條數學邊界：有限樣本下需要多少資訊才能保證結論不是自欺（泛化理論），有限梯度步數下能多快找到好解（最佳化理論），以及最壞情況下哪些問題不可能被高效算出（計算複雜度與高維譜幾何）。","t":["統計誤差（樣本有限 n）","最佳化誤差（迭代步數有限 T）","計算複雜度限制（時間多項式有界）","計算複雜度（Arora–Barak / Håstad）","最佳化理論（Bubeck / Sun）","高維機率與隨機矩陣（Vershynin / Anderson et al.）","現代統計學習（PAC-Bayes / 資訊泛化界）","統計泛化理論的演進：從一致收斂到無維度 PAC-Bayes 與資訊論界","如何消除百億參數大模型的空洞泛化界（Vacuous Bounds）且不依賴重抽樣","譜幾何壓縮與長尾罕見知識保留之間的張力"],"m":[]},"n-b1266622":{"i":"在離散的邏輯符號和低階的神經脈衝之間，這個領域建立第三層描述語言，也就是幾何。它研究人類心智與大型神經網路如何把概念編碼成凸區域、雙曲階層、量子投影子空間、平行四邊形概念晶體，以及可操作的拓撲骨架。","t":["Shepard 普適指數衰減律","非歐層級與非對稱性","線性表示假說（LRH）的群作用公理化與概念晶體多胞形","共享流形以支持泛化，或分裂到正交子空間以避免任務干擾","純幾何夾角能否解釋特徵干涉","跨視覺型態（照片 ↔ 素描 ↔ 醫學影像）的語意投影對齊（SPACE）","從位元通訊走向 Gärdenfors 概念 Voronoi 語意通訊"],"m":[]},"n-b3add3e6":{"i":"兩個物件「以哪一種方式同構」（見證路徑、路徑之間的變形，乃至無窮階相容性），在數學裡到處出現，傳統集合論卻把它抹平。高階範疇論把這些資訊全部保留為一等公民，替現代幾何、拓撲與物理提供一套通用的組裝框架，不丟失高階對稱性與橫截相交資訊。","t":["計算與形式化驗證的可擴展性挑戰","遷移至 形式化與推理 與軟體工程（保留見證而非布林抹除）"],"m":[]},"n-5023aa22":{"i":"同倫類型論（HoTT）把三樣東西合而為一：程式／資料型別、邏輯命題／證明、拓撲空間／連續路徑，影響遍及邏輯、計算機科學與幾何學。數學家日常的直覺是「同構的結構即可視為相等」，它透過單價公理（Univalence）給這個直覺一個嚴格、可由電腦驗算的基礎。","t":["有向類型論（Directed Type Theory）的統一語法與對偶扭轉","大型形式化生態分裂與 AI 自動驗證合成（Vericoding）"],"m":[]},"n-9cd2625e":{"i":"代數幾何與 Hodge 理論研究的是，怎麼在離散的多項式代數、連續的複流形微積分和有限域上的算術數論這三個看似不相干的領域之間，建立像羅塞塔石碑那樣可以互相對照的翻譯。它的中心問題是：一個空間的拓撲洞（上同調類），在什麼條件下確實是由多項式方程定義出來的幾何子空間（代數閉鏈），而不只是分析上算出來的東西？","t":["代數閉鏈構造極限與自守上同調障礙","非阿貝爾 Hodge 理論中的「墨菲定律（Murphy's Law）」與算術剛性","p-進 Hodge、凝聚分析空間與母題同倫的統一","遷移至 moiré物理與複雜系統（穩定性跨牆公式與相圖跳躍）","Murphy's law in non-abelian Hodge theory"],"m":[]},"n-5f638e6a":{"i":"代數拓撲把可以任意拉扯扭曲的連續幾何形狀，轉換成剛性的離散代數不變量，像是替形狀取指紋。到了現代的穩定與色層同倫論（Chromatic Homotopy Theory），人們還發現高維空間裡糾纏在一起的現象，可以像白光穿過三稜鏡那樣，按素數 p 與形式群高度 n 分解成一張有規律的「拓撲元素週期表」。","t":["譜序列：從局部碎片逐層逼近全局的計算工具（Spectral Sequences）","正特徵代數幾何與拓撲譜序列的非退化極限","從「全可逆群胚」走向「有向與帶伴隨高階拓撲」","高階色層結構與量子場論高階反常（Higher Anomalies）的精確算表","遷移至 moiré物理與複雜系統（配邊不變量分類拓撲物態）"],"m":[]},"n-f1762f98":{"i":"範疇論曾被調侃為「抽象廢話（Abstract Nonsense）」，應用範疇論把它變成一門研究各種系統如何互連、開放系統如何組合的學問（Science of Compositionality）。","t":["連續時間隨機／非確定性開放系統的行為可表性（Clock Systems）","從「靜態接線圖」走向「自修改動態拓撲（Dynamic Rewiring）」"],"m":[]},"n-d7942c12":{"i":"這個領域用兩條互補的路線重寫分析學與微積分的基礎。凝聚數學（Condensed Mathematics）用收斂序列這類探針上的層取代傳統的點集拓撲空間，讓無限維泛函分析與巴拿赫空間可以放進同調代數。","t":["拓撲阿貝爾群不是阿貝爾範疇（代數與分析接不起來）","光滑流形缺乏冪零無窮小與函數空間的笛卡爾閉性（微積分的組合操作很笨重）","凝聚集合（Condensed Set）","合成微分幾何（Kock–Lawvere 公理）","Kock–Lawvere 公理（SDG）","公理化內聚性（Cohesion）","切範疇：把取切叢提煉成精簡的泛代數算子（Tangent Categories）","切範疇中的全域李理論與非線性 PDE 基礎","無窮維場論與非線性 PDE 解空間的形式嚴格化","遷移至 形式化與推理（為 AI 驗證而重構公理的思路）"],"m":[]},"n-beef8afd":{"i":"認識邏輯與信念修正是一套形式微積分，刻畫兩件事：誰知道誰知道什麼（高階心智理論 Theory of Mind），以及新證據和舊世界觀衝突時，理性主體怎麼用最小的改動重組知識庫。多智能體社會推理、賽局共識，以及當代大型語言模型的知識編輯（Model Editing），都以它為公理基礎。","t":["非單調信念衝突（Belief Revision）","認識可能世界圖（Kripke Model）","AGM 信念修正","LLM 的理性信念修正與社交壓力下的諂媚（Sycophancy）","不可知性（Unknowability / Fitch 悖論）與動態無切消證明論"],"m":[]},"n-3c0ae2e8":{"i":"形式概念分析（FCA）與格論替人和機器的概念（Concept）給出一個零參數的代數定義。只要一張「物件 × 屬性」觀察表，加上一組互為對偶的 Galois 連接，就能把雜亂的經驗資料整理成外延與內涵嚴格對應的完備概念格（Concept Lattice）。","t":["Galois 連接","多伴隨概念格（Medina et al. 2009）","語言修飾詞壓縮（Belohlavek & Vychodil 2012）","三支概念格（Qi, Wei & Yao 2014）","LLM 統計主題建模與 FCA 符號概念格：覆蓋率與忠實度的取捨","非交換／矩陣域上的保序嵌入剛性定理","Order embeddings of real matrix domains"],"m":[]},"n-f273415f":{"i":"線性邏輯與博弈語意學把數理邏輯改寫成一套講資源、講互動的理論。Jean-Yves Girard 重新分析古典蘊含 A → B，把假設從可以免費無限影印的永恆真理，改成用一次就消耗掉的資源（A multimap B）。","t":["乘法同時擁有 A otimes B（Tensor）","加法內部選擇 A binampersand B（With）","加法外部選擇 A oplus B（Plus）","推論主義哲學與博弈語意的合流，以及線性邏輯的泛代數深層結構","遷移至 硬體與系統 與量子／異質編譯（GoI 無中心流編譯思想）","遷移至 數學結構化ML（程式泰勒展開與符號神經混合求導）","L5 深度審核完成"],"m":[]},"n-2758d705":{"i":"演算法資訊理論用「生成單一物件的最短電腦程式長度」來定義絕對的結構與隨機性。它把哲學上的奧卡姆剃刀寫成索羅門諾夫通用歸納先驗，並說明無損資料壓縮與序列泛化預測（如大語言模型）在數學上等價。","t":["食譜與外賣照片（Kolmogorov 複雜度 K(x)）","索羅門諾夫的萬能賭徒（Solomonoff Induction）","從神諭壓縮到人類算力壓縮（Epiplexity）","前綴 Kolmogorov 複雜度 K(x)、不變性定理與不可計算性","最小描述長度（MDL）與計算受限結構資訊（Epiplexity）","兩階段／精緻 MDL","計算受限分解（Time-Bounded MDL / Epiplexity）","Grokking（延遲頓悟）中特徵學習與編碼壓縮之爭","通用先驗的主觀常數陷阱（The O(1) Trap）","遷移至 評估與資料（預訓練資料價值評估）"],"m":[]},"n-06bb9b73":{"i":"度量幾何不需要光滑座標，也不需要二階微分。它只用兩點間的最短路徑距離，以及機率分佈沿最優傳輸搬運時鄰域的聚散或熵的凸性，就能在奇異流形、社交網路、知識圖譜乃至於非光滑時空上，重新建立嚴格的曲率（Curvature）與極限幾何。","t":["正曲率（地球儀球面／緊密小圈子社群）","零曲率（平坦廣場／方格網）","負曲率（馬鞍面／樹狀分岔與跨部門瓶頸橋樑）","幾何深度學習與圖神經網路（數學結構化ML）","統計物理與廣義相對論時空基礎（非平衡態統計力學與隨機熱力學）","Ollivier–Ricci 粗曲率與 Lin–Lu–Yau 圖曲率","動力學離散 Ricci 流、多尺度社群解構與 GNN 瓶頸處理","有向空間與非對稱因果結構的度量幾何化","精確度量比較（GH）的計算困難與局部曲率指紋的可計算性","遷移至 社會與多智能體（輿論極化與韌性網路設計）"],"m":[]},"n-d458c7b5":{"i":"從稀疏、含噪的觀測反推無窮維的隱藏物理場，是病態的不適定問題。貝氏逆問題把它改寫成函數空間上對先驗測度的平滑加權更新，測度傳輸則用確定性最優傳輸映射與交互作用粒子流，取代在高維失效的隨機漫步抽樣。","t":["隔著毛玻璃猜雕像（函數空間貝氏適定性）","盲人摸象隨機跳與捏黏土定向變形（MCMC 與測度傳輸）","登山隊繩索互助（集合卡爾曼反演 EKI 與粒子流）","擴散模型與條件生成（工具鏈、最優傳輸與跨域平移）","大腦預測編碼與主動推論（情感腦認知、發展式學習）","無窮維函數空間貝氏公式、後驗適定性與收斂率（Stuart 範式）","確定性測度傳輸與 Knothe–Rosenblatt 三角重排映射","集合卡爾曼濾波／反演（EnKF / EKI）與無導數交互粒子動力學","擴散先驗逆問題中加噪似然不可解性與後驗失真之間的張力（Duong 2026）","小集合亞空間塌縮（Subspace Collapse）與高維多峰穿隧"],"m":[]},"n-77312670":{"i":"經典 Wasserstein 距離的耦合可以偷看未來，也不管因果箭頭的方向。因果與反事實最優傳輸在耦合多胞形中加入時間濾波的非預知約束與有向無環圖（DAG）結構，讓隨機控制估值、多維反事實世界的建構與公平性決策，都建立在遵守因果律的最小變形幾何上。","t":["順著骨牌順序推演平行宇宙（DAG 圖因果傳輸與反事實映射）","介入（Interventional）與回溯（Backtracking）反事實","序列決策、量化金融與強化學習（RL與多模態）","圖因果最優傳輸（Graph Causal OT）與有向無環圖度量理論","反事實最優傳輸：介入推前、回溯反事實與重心公平性","回溯反事實傳輸","反事實公平迴歸（Generali Lince et al. 2026）","觀測資料混雜消除與多重處置因果效應估計","適配與圖因果 Wasserstein 距離的高維統計與計算瓶頸","遷移至 RL與多模態、世界模型與離線強化學習"],"m":[]},"n-b3bdf481":{"i":"最優傳輸不是一整塊多項式時間可解的問題，它正好落在 P 與 NP-Hard 的分界上。從雙邊線性傳輸往外踏出半步（二次互動、三邊際耦合或高維自由重心），問題就變得連近似都很難。反過來，驅動 Sinkhorn 的矩陣／算子縮放與自旋玻璃相變，也成了研究代數版 VPneqVNP 與平均情況演算法極限的主要工具。","t":["雙人舞配對，對比三人組隊與座位互動","全息防偽抽查（Håstad PCP）","結冰的彈珠迷宮（OGP 重疊間隙）","代數幾何與表示論（代數幾何與Hodge）","1. 變體 NP-Hardness 相變","2. 多胞形擴展複雜度","3. 算子縮放與 GCT","4. 細粒度複雜度與流極限","5. PCP 緊不可近似性","6. 自旋玻璃與 OGP"],"m":[]},"n-a2deec48":{"i":"最優傳輸把比較兩個機率分佈、甚至對齊兩個沒有共同座標的異構概念空間，都轉成同一個問題：找出總變形與搬運代價最小的幾何耦合路徑。機率空間因此成為可微分、可插值、可以走梯度流的無窮維黎曼流形。","t":["Monge–Kantorovich 搬土問題","Kantorovich 對偶（物流公司報價）","Gromov–Wasserstein 跨星系拼圖","生成式 AI 與流匹配（工具鏈）","Monge–Kantorovich 對偶、Brenier 單調映射與影子價格","熵正則化、Sinkhorn 演算法與 Schrödinger 橋","Otto 微積分、JKO 變分格式與 Wasserstein 重心","Benamou–Brenier 動態公式","JKO 時間離散步","Agueh–Carlier Wasserstein 重心"],"m":[]},"n-4131289c":{"i":"當微觀個體原本自由的獨立運動自由度（動能）被幾何干涉或競爭約束壓到趨近於零時，個體之間的交互作用、拓撲幾何與集體阻挫就會主導整個系統，湧現出單一個體沒有的宏觀奇異相態（非常規超導、零場分數陳絕緣體、自旋玻璃相變與自組織臨界雪崩）。","t":["計算複雜度與 LLM 指令遵循極限","深度學習動力學與邊緣臨界性","代數拓撲與拓撲量子計算","超越「谷對稱典範」的量子幾何與非常規超導配對機制之爭","大型語言模型與深度網路中的「組合約束相變」","🏆 L5 已完成","L5 已完成","The Nature of Computation","Statistical Mechanics of Deep Learning"],"m":[]},"n-7a3319d6":{"i":"把深度學習從有限維固定像素網格上的向量擬合（R^n → R^m），推廣為無窮維函數空間之間的連續算子映射（G^dagger: A → U）。再把物理守恆律與辛幾何結構內嵌進神經網路，目標是做出能跨解析度、跨方程、以毫秒級速度推演真實物理世界演化的科學基礎模型。","t":["無窮維貝氏逆問題的加速","序列架構與連續時間模型的統一","幾何與拓撲不變性","無窮維算子學習的兩條路線：DeepONet 與傅立葉神經算子（FNO）","DeepONet（基底展開視角）","FNO（格林函數摺積視角）","DeepONet","FNO 單層積分核更新","算子本身容易逼近，但算子的導數（Fréchet 微分）在強拓撲下逼近失效","單步預測排名與長時自迴歸推演崩潰之間的落差"],"m":[]},"n-bbc7022e":{"i":"十九世紀的古典熱力學第二定律是一條不等式（Δ S_{tot} ≥ 0），只適用於巨觀、緩慢、平衡態的系統。這個領域把它推廣到單一分子馬達、奈米晶片、活體細胞乃至生成式擴散模型，在任意劇烈的非平衡驅動下，給出單軌跡上的精確等式、資訊與能量的兌換率，以及最優傳輸幾何下的速度極限。","t":["擴散與流匹配生成模型的誤差分析","最優傳輸與資訊幾何在物理上的統一","生命自組織與超低功耗硬體極限","Crooks 漲落定理（1999）","Jarzynski 等式（1997）","生成式擴散模型的非平衡熵產生誤差瓶頸","古典與量子統一的梯度流，以及遠離平衡自組織系統的生成式建模","🏆 L5 已完成","L5 已完成","Thermodynamics of Information"],"m":[]},"n-94d49455":{"i":"空間維度 d 與矩陣尺寸 N 大到數千乃至數十億時，我們在二、三維世界養成的幾何直覺不再成立，取而代之的是兩種確定性的規律。一是測度集中：一切都縮聚到薄殼上，取值近乎常數。二是隨機矩陣譜的普適律：大量隨機耦合的特徵值會自動排成精確可解的確定性連續分佈。","t":["高維柳丁只有皮沒有肉（測度集中）","雜訊海平面與訊號孤島（隨機矩陣譜與 BBP 相變）","超大規模神經網路擴展與 μP 超參數遷移","LLM 模型壓縮、幻覺偵測與雙重下降","RAG 向量檢索穩定性與高維採樣下界","Tensor Programs 無限寬漸近獨立性（Yang 2020）","高維採樣中強對數凹與高斯的複雜度差距","🏆 L5 已完成","Tensor Programs III: Neural Matrix Laws","L5 已完成"],"m":[]},"n-c32fcae7":{"i":"牛頓與萊布尼茲的微積分和布朗運動有兩個簡化假設：只看無窮小的鄰居（空間局域性），以及下一秒就忘記過去（馬可夫無記憶性）。這個領域放掉這兩個假設，改用奇異積分算子與冪律記憶核，精確刻畫自然界與複雜演算法中隨處可見的兩種現象：長程大跳躍（Lévy 飛行超擴散），以及在碎形陷阱中的長時間等待（長記憶次擴散）。","t":["醉漢散步與搭飛機跳島旅行（空間非局域性 (-Δ)^s）","深度學習 SGD 重尾逃逸與平坦極小值偏好","克服圖神經網路過度平滑與長程訊息傳遞","非局域科學機器學習與共形幾何","次擴散（Subdiffusion，γ \u003c 1）","有界域外部邊界條件、非局域神經網路（nPINNs）與重尾學習動力學","非均質各向異性介質中，哪一個才是物理上正確的分數階擴散算子","微觀的純局域決定論／布朗運動，如何嚴格湧現出宏觀的分數階反常擴散","🏆 L5 已完成","L5 已完成"],"m":[]},"n-87df9844":{"i":"發展式學習研究的是：一個能力受限的具身智能體，處在沒有固定題庫、沒有外部獎勵、世界又持續變動的開放環境裡，怎麼靠預測誤差最小化和內在好奇心驅動自己成長，並且在不忘掉舊本領的前提下持續長出新能力。","t":["基礎模型時代的「假性持續學習」與微調遺忘悖論","自由能原理的解釋邊界（「馬可夫毯把戲」之爭）","從自動課程走向開放式演化（Open-Endedness）","把逆向持續學習用到 AI安全攻防 的後門清除與機器遺忘","把預期自由能分解用到 科學學與知識空間演化 與自動化實驗設計","L5 已審核"],"m":[]},"n-478c6f86":{"i":"情感腦認知（Affective & Cognitive Neuroscience / NeuroAI）研究人類大腦怎麼在樣本極少、風險又高的社交情境中做到系統性泛化與價值權衡。它靠的是海馬迴快速記下個例、新皮質慢慢萃取結構的雙記憶系統，加上因果心智模型，以及認知評價（Appraisal）的情緒機制。","t":["LLM 只是純隱式的皮質統計機，還是已經湧現心智模型","L5 已審核","Megha Manoj, Sue Ann Campbell (2026)"],"m":[]},"n-2ab70637":{"i":"社會與多智能體研究的是：成百上千個各有局部資訊、私人偏好與策略適應能力的智能體同時互動時，怎麼克服環境非平穩性與維度災難，進而理解、預測甚至設計合作協調、市場均衡、輿論相變與公平的集體決策制度。","t":["集中式訓練與分散式執行（CTDE）及單調價值分解","平均場賽局（M   board.addEventListener("pointercancel", function () { strokeS = null; erasing = false; textDown = null; liveP.setAttribute("d", ""); });

  function renderBox(it) {
    var el = boxesEl.querySelector('[data-bid="' + it.id + '"]');

      el = document.createElement("div"); el.className = "tbox"; el.dataset.bid = it.id;

    if (!el.classList.contains("editing")) { var v = el.querySelector(".tb-view"); if ((it.md || "").trim()) setRich(v, it.md, false); else v.innerHTML = '<span class="tb-ph">' + (it.gen ? "Claude is thinking…" : "Double-click to write") + "</span>"; }
    return el;
  }
  function editBox(id) {
    var el = boxesEl.querySelector('[data-bid="' + id + '"]'), it = items[id]; if (!el || !it || el.classList.contains("editing")) return;

    el.appendChild(ta); var grow = function () { ta.style.height = "auto"; ta.style.height = Math.max(70, ta.scrollHeight + 2) + "px"; }; grow(); ta.focus();

    ta.addEventListener("keydown", function (e) { if (e.key === "Escape" || (e.key === "Enter" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); e.stopPropagation(); ta.blur(); } });

      it.md = ta.value; ta.remove(); el.classList.remove("editing");

      renderBox(it); saveItem(it);

  }
  boxesEl.addEventListener("dblclick", function (ev) { var el = ev.target.closest(".tbox"); if (el && tool === "select") editBox(el.dataset.bid); });
  boxesEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-tb]"); if (!b) return; var id = b.closest(".tbox").dataset.bid;
    if (b.dataset.tb === "del") removeItem(id); else askBox(id);
  });
  boxesEl.addEventListener("pointerdown", function (ev) {
    if (tool !== "select" || ev.button) return;

    var it = items[el.dataset.bid]; if (!it) return; var w = toWorld(ev);
    boxDrag = { it: it, el: el, pid: ev.pointerId, ox: it.x - w.x, oy: it.y - w.y, sx: ev.clientX, sy: ev.clientY, moved: false };

  boxesEl.addEventListener("pointermove", function (ev) {
    if (!boxDrag || ev.pointerId !== boxDrag.pid) return;

    boxDrag.moved = true; var w = toWorld(ev); boxDrag.it.x = r1(w.x + boxDrag.ox); boxDrag.it.y = r1(w.y + boxDrag.oy);
    boxDrag.el.style.left = boxDrag.it.x + "px"; boxDrag.el.style.top = boxDrag.it.y + "px";
  });
  boxesEl.addEventListener("pointerup", function (ev) { if (!boxDrag || ev.pointerId !== boxDrag.pid) return; var d = boxDrag; boxDrag = null; if (d.moved) saveItem(d.it); });
  function boardContext() { return agentPre(true) + boardContext0(); }
  function boardContext0() {
    var learned = nodes.filter(function (o) { var s = st(o.id); return s === "done" || s === "reading"; }).slice(0, 30).map(function (o) { return nm(o.id) + ", " + shortT(o) + " (" + LABEL[st(o.id)] + ")"; });
    return "You are a mathematics research assistant working on the user's reading board. Answer in English. Use Markdown, and write all mathematics in LaTeX: $...$ inline, $$...$$ display. Be precise and concise; say so when you are unsure.\n" + (learned.length ? "[Books the user has finished or is reading] " + learned.join("; ") + "\n" : "");
  }
  function askBox(id) {
    var src = items[id]; if (!src) return;
    if (!sampleFn) { toast("Claude is not available in this view"); return; }
    if (!(src.md || "").trim()) { toast("Write something in the box first"); editBox(id); return; }
    remember("box", null, src.md.replace(/\s+/g, " ").slice(0, 160));
    var sc = src.s || 1, right = src.x + src.w * sc;
    var out = { id: uid(), type: "text", x: r1(right + 110 * sc), y: src.y, w: 360, s: sc, md: "", c: COLORS[0], gen: true };
    items[out.id] = out; var el = renderBox(out);
    var arr = { id: uid(), type: "arrow", c: src.c || COLORS[0], w: r1(2.4 * sc), k: "line", p: [[r1(right + 10 * sc), r1(src.y + 26 * sc)], [r1(right + 55 * sc), r1(src.y + 26 * sc)], [r1(out.x - 12 * sc), r1(out.y + 26 * sc)]] };
    drawInk(arr); saveItem(arr);
    var raf = 0, done = false, view = el.querySelector(".tb-view");
    sampleFn(boardContext() + "\n[Request]\n" + src.md, { cache: false, onText: function (o) {
      out.md = o.text; if (!raf && !done) raf = requestAnimationFrame(function () { raf = 0; if (!done) setRich(view, out.md, true); });
    } }).then(function (r) { out.md = r.text; })
      .catch(function (err) { out.md = ((err && err.text) || out.md || "") + (err && err.code === "not_granted" ? "\n\n_This page was not allowed to use Claude._" : "\n\n_The answer did not finish. Press ✦ on the first box to try again._"); })
      .then(function () { done = true; delete out.gen; renderBox(out); saveItem(out); });
  }

  /* ---------- boot ---------- */
  setDock(lsGet("rdg-dock", false));
  if (GRAV !== 1) applyGravity(GRAV, false);
  applyPapers(); applyWires(); renderCounts(); renderRec(); renderSpot();
  if (window.innerWidth <= 760) $("#q").placeholder = "Search";
  fitTo(visibleNodes(), 0);
  if (!G.papers.length) $("#tPapers").hidden = true;
  if ($("#spotPdf")) $("#spotPdf").hidden = true;
  ["ledger", "msc", "agent"].forEach(function (t) { var b = document.querySelector('#about .tabs [data-tab="' + t + '"]'); if (b && (t === "agent" || !(G[t] && G[t].length))) b.hidden = true; });
  /* deep links: #n=<id> opens a note, #k focuses search (note pages send Cmd-K here), #today opens Today */
  function onHash(first) {
    var h = location.hash, m = /^#n=([\w-]+)$/.exec(h);
    if (m && byId[m[1]]) setTimeout(function () { openDetail(m[1], true); }, first ? 450 : 0);
    else if (h === "#k") setTimeout(focusSearch, first ? 120 : 0);
    else if (h === "#today") openToday();
  }
  onHash(true);
  window.addEventListener("hashchange", function () { onHash(false); });
  window.addEventListener("resize", function () { clearTimeout(qT); qT = setTimeout(function () { if (!spot.length && !query && !trayFilter) fitTo(visibleNodes(), 0); }, 200); });
  /* Reading OS: the rules say where Today and Read note go there */
  if (OS && Array.isArray(G.rules)) G.rules = G.rules.map(function (r) {
    if (/^\*\*Today\*\*/.test(r)) return "**Today** is its own app in the Dock: the latest daily report, rereads that are due, and notes you are reading. Press **Cmd-K** (Ctrl-K on Windows and Linux) for Spotlight, then type **today** or 今天 and press Enter to open it.";
    return r.replace("**Read note** opens the full page.", "**Read note** opens it in a Reader window.");
  });

  /* ---------- frame API: Reading OS's Shelf app drives the board through window.RDGBoard ---------- */
  var flashT = 0;
  window.RDGBoard = {
    openDetail: function (id) { if (!byId[id]) return false; $("#about").hidden = true; openDetail(id, true); return true; },
    focusNote: function (id) { var n = byId[id]; if (!n) return false; if (n.kind === "paper" && !showPapers) { showPapers = true; applyPapers(); } fitTo([n], 700); try { n.el.focus({ preventScroll: true }); } catch (e) {} return true; },
    filterTray: function (s) {
      trayFilter = LABEL[s] ? s : null; syncTrays();
      if (trayFilter) { query = ""; $("#q").value = ""; }
      applyFocus(true);
      if (trayFilter && !nodes.some(function (n) { return st(n.id) === trayFilter; })) toast(LABEL[trayFilter] + " is empty. Drag a note onto it");
      if (!trayFilter) fitTo(spot.length ? [] : visibleNodes(), 700);
      return trayFilter;
    },
    focusField: function (ch) {
      var list = (groups[ch] || []).filter(function (n) { return showPapers || n.kind !== "paper"; }); if (!list.length) return false;
      fitTo(list, 700); setDisc(String(ch)); clearTimeout(flashT);
      flashT = setTimeout(function () { if (!mouse) setDisc(null); }, 1600);
      return true;
    },
    fit: function () { fitTo(visibleNodes(), 700); },
    setStill: function (on) { extStill = !!on; applyStill(); return extStill; },
    toggle: function (what, on) {
      if (what === "links") { wiresOn = on === undefined ? !wiresOn : !!on; lsSet("rdg-wires", wiresOn); applyWires(); return wiresOn; }
      if (what === "papers") { showPapers = on === undefined ? !showPapers : !!on; lsSet("rdg-papers", showPapers); applyPapers(); applyFocus(false); return showPapers; }
      return null;
    },
    state: function () { return { links: wiresOn, papers: showPapers, hasPapers: G.papers.length > 0, tray: trayFilter, detail: detailId }; },
    insets: function (top, bottom) { setInsets(top, bottom); if (!spot.length && !query && !trayFilter && !detailId) fitTo(visibleNodes(), 0); }
  };

  function useLocal() {
    store = { kind: "local", put: function (id, v) { var all = lsGet("rdg-progress", {}); if (v) all[id] = v; else delete all[id]; lsSet("rdg-progress", all); return Promise.resolve(); },
      putMine: function (id, v) { var all = lsGet("rdg-mine", {}); all[id] = v; lsSet("rdg-mine", all); return Promise.resolve(); },
      putChat: function (id, v) { var all = lsGet("rdg-chats", {}); all[id] = v; lsSet("rdg-chats", all); return Promise.resolve(); },
      putItem: function (id, v) { var all = lsGet("rdg-board", {}); all[id] = v; lsSet("rdg-board", all); return Promise.resolve(); },
      delItem: function (id) { var all = lsGet("rdg-board", {}); delete all[id]; lsSet("rdg-board", all); return Promise.resolve(); },
      putExt: function (id, v) { var all = lsGet("rdg-ext", {}); all[id] = v; lsSet("rdg-ext", all); return Promise.resolve(); },
      delExt: function (id) { var all = lsGet("rdg-ext", {}); delete all[id]; lsSet("rdg-ext", all); return Promise.resolve(); },
      putCfg: function (v) { lsSet("rdg-agent", v); return Promise.resolve(); } };
    cfg = lsGet("rdg-agent", cfg) || cfg;
    var ex = lsGet("rdg-ext", {}); Object.keys(ex).forEach(function (k) { if (ex[k] && ex[k].id) mountExt(ex[k]); });
    var bd = lsGet("rdg-board", {}); Object.keys(bd).forEach(function (k) { if (bd[k] && bd[k].type) { items[k] = bd[k]; drawItem(bd[k]); } });
    progress = lsGet("rdg-progress", {}); mine = lsGet("rdg-mine", {}); Object.keys(mine).forEach(function (k) { mineOf(k); }); chats = lsGet("rdg-chats", {}); canWrite = true;
    Object.keys(progress).forEach(function (id) { if (byId[id]) paint(id, false); });
    renderCounts(); renderRec(); progressLoaded();
  }
  (async function () {
    if (!window.claude || !window.claude.use) { useLocal(); return; }
    try {
      var res = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample")]);
      var db = res[0], user = res[1]; sampleFn = res[2] || null;
      if (!db) { useLocal(); return; }
      canWrite = user ? !!(await user.isOwner()) : false;
      var col = db.collection("progress"), ic = db.collection("intros_en"), mc = db.collection("mine"), cc = db.collection("chats"), bc = db.collection("board"), xc = db.collection("ext"), sc = db.collection("settings");
      store = { kind: "db",
        put: function (id, v) { return v ? col.doc(id).set({ s: v.s, at: v.at }) : col.doc(id).delete(); },
        putIntro: function (id, text) { return ic.doc(id).set({ text: text, at: new Date().toISOString() }); },
        putMine: function (id, v) { return mc.doc(id).set(v); },
        putChat: function (id, v) { return cc.doc(id).set(v); },
        putItem: function (id, v) { return bc.doc(id).set(v); },
        delItem: function (id) { return bc.doc(id).delete(); },
        putExt: function (id, v) { return xc.doc(id).set(v); },
        delExt: function (id) { return xc.doc(id).delete(); },
        putCfg: function (v) { return sc.doc("agent").set(v); } };
      sc.onSnapshot(function (snap) { snap.docs.forEach(function (d) { if (d.id !== "agent" || d.metadata.hasPendingWrites || cfgEditing) return; var v = d.data() || {}; cfg = { agent: String(v.agent || ""), instr: String(v.instr || "") }; if (aboutCur === "agent" && !$("#about").hidden) aboutTab("agent"); }); }, function () {});
      xc.onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) {
          var id = ch.doc.id;
          if (ch.type === "removed") { unmountExt(id); return; }
          var v = ch.doc.data(); if (!v || byId[id]) return; v.id = id; mountExt(v);
        });
        renderRec();
      }, function () {});
      bc.onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) {
          var d = ch.doc, id = d.id;
          if (ch.type === "removed") { if (items[id]) { undrawItem(id); delete items[id]; } return; }
          if (d.metadata.hasPendingWrites) return;
          var v = d.data(); if (!v || !/^(text|stroke|arrow)$/.test(v.type)) return;
          var el = document.querySelector('.tbox[data-bid="' + id + '"]'); if (el && el.classList.contains("editing")) return;
          if (boxDrag && boxDrag.it.id === id) return;
          v.id = id; items[id] = v; drawItem(v);
        });
      }, function () {});
      mc.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (!v || !byId[d.id]) return; if (d.metadata.hasPendingWrites) return; if (d.id === detailId && noteEditing) return; mine[d.id] = { tags: Array.isArray(v.tags) ? v.tags.map(String) : [], notes: Array.isArray(v.notes) ? v.notes.filter(function (x) { return x && typeof x.md === "string"; }) : (v.md ? [{ id: "n0", md: String(v.md), at: v.at }] : []), at: v.at }; });
        if (detailId && !noteEditing) renderMine();
      }, function () {});
      cc.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (!v || !byId[d.id] || d.metadata.hasPendingWrites) return; if (d.id === detailId && chatBusy) return; chats[d.id] = { turns: Array.isArray(v.turns) ? v.turns.filter(function (t) { return t && typeof t.q === "string"; }) : [] }; });
        if (detailId && !chatBusy) renderChat();
      }, function () {});
      col.onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v && LABEL[v.s] && byId[d.id]) next[d.id] = v; });
        Object.keys(pending).forEach(function (id) { if (pending[id]) { if (progress[id]) next[id] = progress[id]; else delete next[id]; } });
        var changed = {}; Object.keys(next).concat(Object.keys(progress)).forEach(function (id) { if ((next[id] && next[id].s) !== (progress[id] && progress[id].s)) changed[id] = 1; });
        progress = next;
        Object.keys(changed).forEach(function (id) { paint(id, false); });
        renderCounts(); renderRec(); if (detailId) refreshDetail(); if (trayFilter) applyFocus(false);
        progressLoaded();
      }, function () { canWrite = false; });
      ic.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (v && v.text) intros[d.id] = { text: String(v.text) }; });
        if (detailId && intros[detailId]) { var e = document.getElementById("introTxt"); if (e && e.classList.contains("wait")) { e.textContent = intros[detailId].text; e.classList.remove("wait"); } }
      }, function () {});
      if (detailId) renderDetail();
    } catch (e) { useLocal(); }
  })();
})();
