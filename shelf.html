<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ecebe6"></head><body><title>Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one light board, deliberately single-theme. Books float on white plates in twelve chapter clusters; quiet UI floats at the edges. Atlas shell type and neutrals. */
:root {
  color-scheme: light;
  --board: #ecebe6; --dot: #d3d0c7; --board-lit: #d9d6ce;
  --plate: #ffffff; --surface: #faf9f6; --well: #f1efe9;
  --ink: #23221d; --muted: #67635a; --line: #dedad1; --line-strong: #8a8474;
  --wire: #9c988e; --wire-hot: #2f2d27;
  --olive: #626c55; --wine: #875e60; --focus: #2b5d86;
  --todo: #d1493a; --todo-ink: #ffffff; --todo-chip: #c03f30;
  --reading: #e9b10c; --reading-ink: #2a2100;
  --done: #3a9660; --done-ink: #ffffff; --done-chip: #2d7d4e;
  --serif: var(--sans);
  --sans: "Helvetica Neue", "Neue Haas Grotesk Text Pro", Helvetica, "Inter Tight", Arial, "PingFang TC", "Noto Sans TC", sans-serif;
  --swiss: #e3000f;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --r-xs: 7px; --r-s: 10px; --r-m: 14px; --r-l: 22px; --r-xl: 34px;
  --glass: rgba(255,255,255,.56); --glass-line: rgba(255,255,255,.7);
  --shadow: 0 1px 0 rgba(34,33,28,.05), 0 8px 22px rgba(34,33,28,.10);
  --shadow-lift: 0 1px 0 rgba(34,33,28,.06), 0 16px 36px rgba(34,33,28,.18);
}
html { height: 100%; box-sizing: border-box }
*, *::before, *::after { box-sizing: inherit }
body { height: 100%; margin: 0; background: var(--board); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0 }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.lbl { font: 600 11px/14px var(--sans); letter-spacing: .08em; color: var(--muted) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }

#app { position: relative; height: 100%; overflow: hidden }
#board { position: absolute; inset: 0; background-color: var(--board); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; transition: background-color .6s var(--ease); touch-action: none; cursor: grab }
#board:active { cursor: grabbing }
#board.lit { background-color: var(--board-lit) }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
#halos, #labels, #nodes { position: absolute; left: 0; top: 0 }
#wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none }

/* field discs: show only under the cursor */
.cdisc { position: absolute; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--ch) 10%, rgba(255,255,255,.55)) 0, color-mix(in srgb, var(--ch) 6%, rgba(255,255,255,.25)) 60%, rgba(255,255,255,0) 72%); opacity: 0; transform: scale(.94); transition: opacity .5s var(--ease), transform .7s var(--ease); pointer-events: none }
.cdisc.on { opacity: 1; transform: scale(1) }
#glow { position: absolute; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,253,244,.85) 0, rgba(255,251,238,.35) 35%, rgba(255,250,235,0) 68%); pointer-events: none; opacity: 0; transition: opacity .5s var(--ease); will-change: transform }
#glow.on { opacity: 1 }
#tip { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; display: grid; gap: 2px; padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1px solid rgba(255,255,255,.75); box-shadow: 0 8px 26px rgba(34,33,28,.14); opacity: 0; transition: opacity .2s var(--ease); max-width: 300px }
#tip.show { opacity: 1 }
#tip .tf { font: 600 13px/17px var(--sans); display: flex; align-items: center; gap: 7px }
#tip .tf::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ch) }
#tip .tb { font: 700 14px/18px var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fx { width: 100%; height: 100%; will-change: transform }
.node.magnet { z-index: 60 }
.node.magnet .plate { box-shadow: 0 20px 48px rgba(34,33,28,.26) }
.node.magnet .bob { animation-play-state: paused }
#hcard { position: fixed; left: 0; top: 0; z-index: 45; width: 360px; max-width: calc(100vw - 24px); max-height: calc(100vh - 90px); overflow: hidden; pointer-events: none; padding: 16px 18px 14px; border-radius: 20px; background: rgba(255,255,255,.66); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,.8); box-shadow: 0 18px 50px rgba(34,33,28,.18), inset 0 1px 0 rgba(255,255,255,.8); opacity: 0; transition: opacity .22s var(--ease); display: grid; gap: 10px }
#hcard.show { opacity: 1 }
.hc-top { display: flex; align-items: center; gap: 10px; justify-content: space-between }
.hc-a { font: 600 13px/17px var(--sans) }
.hc-f { font: 500 11.5px/15px var(--sans); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.hc-f::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ch) }
.hc-t { font: 700 21px/1.12 var(--sans); text-wrap: balance }
.hc-i { margin: 0; font-size: 13px; line-height: 19px; color: var(--ink) }
.hc-sec { display: grid; gap: 6px }
.hc-chips { display: flex; flex-wrap: wrap; gap: 4px }
.hc-tag { font: 500 11.5px/16px var(--sans); padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.28); color: var(--ink) }
.hc-chips.thm .hc-tag { font-size: 11px; background: rgba(35,34,29,.05); border-color: transparent; color: #3b3932 }
.hc-tag.on { background: color-mix(in srgb, var(--done) 16%, white); border-color: color-mix(in srgb, var(--done) 45%, white) }
.hc-more { font: 500 11px/18px var(--mono); color: var(--muted); padding: 0 4px }
.hc-rel { display: grid; gap: 3px; padding: 4px 0 }
.hc-who { font: 600 12.5px/16px var(--sans); display: flex; align-items: center; gap: 6px }
.hc-who .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.hc-who .dot.s-done { background: var(--done) } .hc-who .dot.s-reading { background: var(--reading) }
.hc-why { font-size: 12px; line-height: 16px; color: var(--muted) }
.hc-tags { display: flex; flex-wrap: wrap; gap: 3px }
.hc-none { margin: 0; font-size: 12px; color: var(--muted) }
#detail .hc-chips .hc-tag { pointer-events: auto }

/* wires */
.wire line { stroke: var(--wire); stroke-width: 1.3; transition: stroke .2s, stroke-width .2s, opacity .3s }
.wire circle { fill: var(--wire); transition: fill .2s }
.wire.k1 line { stroke-dasharray: 5 5 }
.wire { opacity: .7; transition: opacity .3s var(--ease) }
#app.wires-quiet .wire { opacity: 0 }
.wire.hot { opacity: 1 !important }
.wire.hot line { stroke: var(--wire-hot); stroke-width: 2 }
.wire.hot circle { fill: var(--wire-hot) }
#world.focus .wire:not(.hot) { opacity: .06 }

/* halos */
.halo { position: absolute; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; background: radial-gradient(circle, rgba(255,251,236,.98) 0, rgba(255,250,232,.7) 32%, rgba(255,250,232,0) 68%); pointer-events: none; animation: halo-in .7s var(--ease) both }
@keyframes halo-in { from { opacity: 0; transform: scale(.6) } }

/* nodes */
.node { position: absolute; left: 0; top: 0; touch-action: none; cursor: grab; transition: opacity .35s var(--ease), filter .35s var(--ease) }
.node.dragging { cursor: grabbing; z-index: 50 }
.node .pop { width: 100%; height: 100% }
.node.enter .pop { animation: pop .7s cubic-bezier(.2,.9,.3,1.25) both; animation-delay: var(--d, 0ms) }
@keyframes pop { from { opacity: 0; transform: scale(.4) translateY(30px) } }
.bob { width: 100%; height: 100%; animation: bob var(--bt, 7s) ease-in-out infinite; animation-delay: var(--bd, 0s) }
@keyframes bob { 0%, 100% { transform: translateY(-3px) rotate(-.5deg) } 50% { transform: translateY(3px) rotate(.5deg) } }
.node.dragging .bob, .node:hover .bob { animation-play-state: paused }
.plate { position: relative; width: 100%; height: 100%; background: var(--plate); border: 3px solid var(--plate); border-radius: var(--r-m); padding: 5px; box-shadow: var(--shadow); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .35s var(--ease) }
.node:hover .plate { transform: translateY(-3px) scale(1.035); box-shadow: var(--shadow-lift) }
.node.dragging .plate { transform: scale(1.08) rotate(-2deg); box-shadow: 0 24px 48px rgba(34,33,28,.28) }
.node.s-todo .plate { border-color: var(--todo) }
.node.s-reading .plate { border-color: var(--reading) }
.node.s-done .plate { border-color: var(--done) }
#world.focus .node:not(.hot) { opacity: .14; filter: grayscale(.7) }
#world.focus .cdisc { opacity: 0 }
.node.hidden { display: none }

.cover { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 8px; background-color: var(--cc); background-image: linear-gradient(115deg, rgba(255,255,255,.16), rgba(255,255,255,0) 38%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.18)); box-shadow: inset 5px 0 0 rgba(0,0,0,.16), inset 6px 0 0 rgba(255,255,255,.10); color: #fffdf6; display: flex; flex-direction: column; padding: 10px 8px 8px 12px; gap: 5px }
.cover::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none }
.cover.p0::before { background: repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 1px, transparent 1px 9px) }
.cover.p1::before { background: radial-gradient(circle at 85% 88%, transparent 0 18px, rgba(255,255,255,.12) 18px 19px, transparent 19px 30px, rgba(255,255,255,.1) 30px 31px, transparent 31px 44px, rgba(255,255,255,.08) 44px 45px, transparent 45px) }
.cover.p2::before { background: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0/12px 12px, linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px) 0 0/12px 12px }
.cover.p3::before { background: repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 7px); mask: linear-gradient(transparent 55%, #000 56%); -webkit-mask: linear-gradient(transparent 55%, #000 56%) }
.cover.p4::before { background: radial-gradient(circle at 78% 72%, rgba(255,255,255,.16) 0 26px, transparent 27px), radial-gradient(circle at 78% 72%, transparent 0 34px, rgba(255,255,255,.1) 35px 36px, transparent 37px) }
.cover.p5::before { background: conic-gradient(from 210deg at 70% 100%, rgba(255,255,255,.13) 0 28deg, transparent 28deg 56deg, rgba(255,255,255,.08) 56deg 84deg, transparent 84deg) }
.cover.img { padding: 0; background-image: none; background-color: var(--cc); box-shadow: none }
.cover.img::before { display: none }
.cover.img img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; user-select: none; -webkit-user-drag: none }
.cover.img::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(0,0,0,.18) 0, rgba(0,0,0,0) 5px, rgba(255,255,255,.12) 6px, rgba(255,255,255,0) 9px), linear-gradient(115deg, rgba(255,255,255,.14), rgba(255,255,255,0) 35%); pointer-events: none }
.cover.img .cm { z-index: 1; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35) }
.plate::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 1px; height: 2.5px; border-radius: 3px; background: var(--ch, transparent); opacity: .85 }
.cover .rule { height: 1px; width: 22px; background: rgba(255,253,246,.55) }
.cover > * { position: relative }
.cover .cn { font: 500 8px/10px var(--mono); letter-spacing: .08em; opacity: .75 }
.cover .ct { font: 700 13.5px/1.06 var(--sans); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance }
.cover .ca { margin-top: auto; font: 600 7.5px/9px var(--sans); letter-spacing: .05em; text-transform: uppercase; opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.cover .cm { position: absolute; right: 7px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #fffdf6; opacity: .9 }
.node.fill .cover { padding: 8px 6px 6px 10px }
.node.fill .cover .ct { font-size: 10.5px; -webkit-line-clamp: 4 }
.node.fill .cover .ca { font-size: 6.5px; line-height: 8px }
.slip { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 2px; padding: 3px 4px; background: repeating-linear-gradient(transparent 0 11px, #eceae3 11px 12px) }
.slip .sk { font: 500 7px/9px var(--mono); letter-spacing: .1em; color: var(--wine) }
.slip .sw { font: 600 9px/11px var(--sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.slip .sy { font: 700 10px/11px var(--sans); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }

.tags { position: absolute; left: 50%; top: calc(100% + 7px); transform: translateX(-50%); display: flex; gap: 4px; white-space: nowrap; pointer-events: none }
.tag { font: 600 10px/14px var(--sans); letter-spacing: .04em; padding: 1px 7px; border-radius: 999px }
.tag.t-todo { background: var(--todo-chip); color: var(--todo-ink) }
.tag.t-reading { background: var(--reading); color: var(--reading-ink) }
.tag.t-done { background: var(--done-chip); color: var(--done-ink) }
.tag.fresh { animation: tag-pop .5s cubic-bezier(.2,.9,.3,1.4) both }
@keyframes tag-pop { from { transform: scale(.2); opacity: 0 } }

/* floating UI */
.ui { position: absolute; z-index: 20 }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-line); border-radius: var(--r-l); box-shadow: 0 10px 34px rgba(34,33,28,.14), inset 0 1px 0 rgba(255,255,255,.75) }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(255,255,255,.94) } }
#top { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; justify-content: flex-end; pointer-events: none }
#top > * { pointer-events: auto }
.tools { display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 16px; flex-wrap: wrap; justify-content: flex-end }
.tools input { width: 220px; max-width: 46vw; font: 13px/18px var(--sans); color: var(--ink); background: var(--well); border: 1px solid rgba(138,132,116,.45); border-radius: var(--r-s); padding: 7px 12px; background: rgba(255,255,255,.6) }
.tools input::placeholder { color: var(--muted) }
.tbtn { font: 500 13px/18px var(--sans); padding: 7px 11px; border-radius: var(--r-s); border: 1px solid transparent; white-space: nowrap }
.tbtn:hover { background: rgba(255,255,255,.7) }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--plate) }
.tbtn .c { font: 500 11px/1 var(--mono); opacity: .7; margin-left: 4px }

#dock { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: 330px; max-width: calc(100% - 24px); max-height: calc(100% - 96px); display: flex; flex-direction: column; overflow: hidden; transition: border-radius .3s var(--ease) }
#dock.collapsed { width: auto; border-radius: 999px }
#dockPill { display: none; align-items: center; justify-content: center; gap: 6px; min-width: 48px; height: 48px; padding: 0 14px; border-radius: 999px; color: var(--ink); transition: transform .25s cubic-bezier(.2,.9,.3,1.4) }
#dockPill:hover { transform: scale(1.08) }
.ibtns { display: flex; gap: 2px }
.ibtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); transition: background .15s, color .15s, transform .3s var(--ease) }
.ibtn:hover { background: rgba(255,255,255,.75); color: var(--ink) }
#recMore:active svg { transform: rotate(-200deg); transition: transform .4s var(--ease) }
.star { display: grid; place-items: center; width: 26px; height: 26px; color: var(--ink) }
#dockPill .dot-unused { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--plate); font-size: 11px }
#dockPill .n { font: 500 11px/1 var(--mono); color: var(--muted) }
#dock.collapsed #dockPill { display: inline-flex }
#dock.collapsed .dock-body { display: none }
.dock-body { display: flex; flex-direction: column; min-height: 0 }
body.dragging #dock.collapsed { border-radius: var(--r-l); width: 330px }
body.dragging #dock.collapsed .dock-body { display: flex }
body.dragging #dock.collapsed #dockPill, body.dragging #dock.collapsed .rec-part { display: none }
.dock-in { overflow: auto; padding: 0 0 8px; flex: 1 1 auto; min-height: 0 }
.dock-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; gap: 8px }
.dock-h .lbl { color: var(--ink) }
.qbtn { font: 500 12px/16px var(--sans); color: var(--muted); padding: 4px 8px; border-radius: 8px }
.qbtn:hover { color: var(--ink); background: rgba(255,255,255,.7) }
.rec { list-style: none; margin: 0; padding: 0 8px }
.rec li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px; border-radius: 12px; cursor: pointer; animation: rise .5s var(--ease) both }
.rec li:nth-child(2) { animation-delay: 60ms } .rec li:nth-child(3) { animation-delay: 120ms }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } }
.rec li:hover { background: rgba(255,255,255,.7) }
.mini { width: 30px; height: 42px; border-radius: 5px; background: var(--cc) center/cover no-repeat; box-shadow: 0 0 0 2px var(--plate), 0 0 0 3px var(--line); position: relative; flex: none }
.mini.core::after { content: ""; position: absolute; right: 4px; top: 4px; width: 4px; height: 4px; border-radius: 50%; background: #fffdf6 }
.mini.paper { background: var(--plate); box-shadow: 0 0 0 1px var(--line-strong); height: 22px; margin-block: 10px }
.rec .t { font: 700 15px/1.15 var(--sans); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rec .why { font-size: 12px; line-height: 16px; color: var(--muted); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s var(--ease), opacity .25s var(--ease), margin .35s var(--ease) }
.rec li:hover .why, .rec li:focus-visible .why { max-height: 34px; opacity: 1; margin-top: 3px }
.rec .rt { min-width: 0; display: grid }
.rec .mini { width: 36px; height: 51px }
.rec .f { font: 500 11px/14px var(--sans); color: var(--muted); margin-left: 7px; display: inline-flex; align-items: center; gap: 4px }
.rec .f::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ch) }
.rec .a { font-weight: 600; font-size: 12px }

#spotWell { margin: 2px 14px 10px; min-height: 96px; border: 1.5px dashed var(--line-strong); border-radius: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px; background: rgba(255,255,255,.45); transition: background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease); position: relative; overflow: hidden }
#spotWell::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle, rgba(255,250,228,.95), transparent 55%); opacity: 0; transition: opacity .3s var(--ease); pointer-events: none }
#spotWell.has::before, #spotWell.over::before { opacity: 1 }
#spotWell.over { border-color: var(--ink); transform: scale(1.02) }
#spotWell .ph { position: relative; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 17px; max-width: 220px }
#spotWell .ph b { display: block; font: 700 17px/1.2 var(--sans); color: var(--ink); margin-bottom: 2px; font-weight: 400 }
.schip { position: relative; display: grid; justify-items: center; gap: 4px; animation: tag-pop .45s cubic-bezier(.2,.9,.3,1.3) both }
.schip .mini { width: 40px; height: 56px }
.schip .mini.paper { height: 30px; margin: 13px 0 }
.schip .x { position: absolute; right: -8px; top: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--plate); font: 600 11px/18px var(--sans) }
.schip .n { font: 600 10.5px/12px var(--sans); max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#spotOut { padding: 6px 14px 10px; font-size: 13px; line-height: 19px }
#spotOut:empty { display: none }
.so-sec { margin-top: 8px }
.so-sec:first-child { margin-top: 0 }
.so-sec > .lbl { display: block; margin-bottom: 4px }
.rel { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; padding: 3px 0; cursor: pointer }
.rel:hover .b { text-decoration: underline }
.rel .ic { color: var(--muted); font-family: var(--mono); font-size: 12px }
.rel .b { font: 700 14px/1.2 var(--sans) }
.rel .tp { color: var(--muted); font-size: 12px }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.path .b { font: 700 14px/1.2 var(--sans); cursor: pointer }
.path .ar { font-size: 11.5px; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 4px }

#trayzone { position: absolute; left: 0; top: 0 }
.tray { position: absolute; border-radius: 50%; border: 0; padding: 0; cursor: pointer; --fill: 0; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) calc(30% + var(--fill) * 25%), transparent) 0, color-mix(in srgb, var(--c) calc(18% + var(--fill) * 20%), transparent) 55%, color-mix(in srgb, var(--c) 0%, transparent) 72%); transition: transform .45s cubic-bezier(.2,.9,.3,1.25), filter .3s var(--ease) }

.tray.over, .tray[aria-pressed="true"] { transform: scale(1.12); filter: saturate(1.6) brightness(1.02) }

#world.focus .tray:not([aria-pressed="true"]) { opacity: .45 }
.tray[data-s="todo"] { --c: var(--todo) }

mjx-assistive-mml { display: none !important }
.sec-h { display: flex; align-items: center; gap: 8px }

.note-st { font: 500 11px/14px var(--mono); color: var(--muted) }

#noteTa { width: 100%; min-height: 180px; resize: vertical; font: 12.5px/1.6 var(--mono); color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.45); border-radius: 12px; padding: 10px 12px }
.tag-in { width: 100%; font: 13px/18px var(--sans); color: var(--ink); background: rgba(255,255,255,.6); border: 1px solid rgba(138,132,116,.45); border-radius: 10px; padding: 7px 11px }
.hc-tag.mine { background: color-mix(in srgb, var(--olive) 14%, white); border-color: color-mix(in srgb, var(--olive) 45%, white); display: inline-flex; align-items: center; gap: 4px }

.chat { display: grid; gap: 8px }

.rich { font-size: 13.5px; line-height: 1.62; overflow-wrap: anywhere; min-width: 0 }
.rich > :first-child { margin-top: 0 } .rich > :last-child { margin-bottom: 0 }
.rich p { margin: .5em 0 } .rich ul, .rich ol { margin: .4em 0; padding-left: 1.3em }
.rich h1, .rich h2, .rich h3 { font: 700 18px/1.2 var(--sans); margin: .8em 0 .3em }

.rich pre { background: rgba(35,34,29,.06); padding: 9px 11px; border-radius: 10px; overflow: auto }
.rich pre code { background: none; padding: 0 }
.rich table { border-collapse: collapse; display: block; overflow: auto } .rich th, .rich td { border: 1px solid rgba(35,34,29,.15); padding: 3px 7px }
.rich blockquote { margin: .5em 0; padding: 1px 10px; border-left: 3px solid rgba(98,108,85,.5); color: var(--muted) }
.rich mjx-container[display="true"] { display: block; margin: .6em 0; overflow-x: auto; overflow-y: hidden }
.rich .raw { font: 12px var(--mono); color: var(--muted) }
.ask { position: relative; display: flex; align-items: flex-end; gap: 6px; background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.45); border-radius: 18px; padding: 5px 5px 5px 13px }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid rgba(138,132,116,.5); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.45) }

.d-sec { display: grid; gap: 6px }

.intro { font-size: 14.5px; line-height: 23px; white-space: pre-wrap }

.intro-note { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; align-items: center }
.owns { font-size: 14px; line-height: 21px }
.skipt { font-size: 13px; line-height: 19px; color: var(--muted) }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px }
.d-tags .tag { font-size: 11px; line-height: 16px; padding: 1px 8px }
.tag.t-ch { background: rgba(255,255,255,.6); color: var(--ink); border: 1px solid var(--line) }
.tag.t-tier { background: var(--ink); color: var(--plate) }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap }
.pbtn { font: 500 13px/18px var(--sans); padding: 8px 14px; border: 1px solid rgba(138,132,116,.5); border-radius: 12px; background: rgba(255,255,255,.5) }
.pbtn:hover { background: rgba(255,255,255,.85) }

/* about */
#about { inset: 0; display: grid; place-items: center; background: rgba(35,34,29,.28); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }

#about .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line) }

#toast { left: 50%; bottom: 76px; transform: translate(-50%, 12px); background: rgba(35,34,29,.78); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--plate); font: 500 13px/18px var(--sans); padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis }

  #zoomctl { bottom: auto; top: 70px }
  #detail { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: 8px; width: auto; max-width: none; height: 76% }
  #detail.closed { transform: translateY(calc(100% + 40px)) }

}
@media (prefers-reduced-motion: reduce) {
  .bob, .node.enter .pop, .tag.fresh, .halo, .rec li, .schip, .tray .mini, .tray.bump { animation: none !important }
  * { transition-duration: 0s !important }
}
/* Reading OS: its own Reduce motion (Control Center, System Settings) holds here too */
html.os-reduce :is(.bob, .node.enter .pop, .tag.fresh, .halo, .rec li, .schip, .tray .mini, .tray.bump) { animation: none !important }
html.os-reduce * { transition-duration: 0s !important }

#aBody .m-lead { color: var(--muted); margin: 0 0 14px }
.m-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px }
.m-stats div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.6); border: 1px solid var(--line) }
.m-stats b { font: 700 26px/1 var(--sans); letter-spacing: -.02em }
.m-stats span { font-size: 11.5px; color: var(--muted); line-height: 15px }
.m-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
.m-sw { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; min-width: 0 }
.m-sw input { accent-color: var(--ink); width: 16px; height: 16px; flex: none }
.m-btns { display: flex; gap: 6px; flex-wrap: wrap }
.m-sec { display: grid; gap: 8px; margin-bottom: 18px; min-width: 0; align-content: start }
.m-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 22px }
.m-chips { display: flex; flex-wrap: wrap; gap: 6px }
.m-chips .tag { cursor: pointer; text-transform: none; letter-spacing: 0; font: 500 12.5px/16px var(--sans); padding: 4px 10px }
.m-sub { font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px }
.m-top { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 4px !important }
.m-top button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 10px; text-align: left }
.m-top button:hover { background: rgba(35,34,29,.06) }
.m-top .mini { width: 24px; height: 34px }
.m-nm { display: grid; gap: 1px; min-width: 0 }
.m-a { font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase }
.m-ti { font: 600 13px/16px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.m-bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 3px }
.m-bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink) }
.m-c { font: 500 12px/1 var(--mono); color: var(--muted) }
.m-hist { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 0 !important }
.m-hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px }
.m-t { color: var(--muted); font: 500 11.5px/18px var(--mono); white-space: nowrap }
.m-v { font-weight: 700 }
.m-book { font: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; text-align: left; padding: 0 }
.m-empty { color: var(--muted); font-size: 13px }
.ag { display: grid; gap: 4px; margin-bottom: 16px }
.ag-h { font-size: 12.5px; color: var(--muted); line-height: 17px }
.ag textarea { width: 100%; resize: vertical; font: 13px/19px var(--mono); color: var(--ink); background: rgba(255,255,255,.75); border: 1px solid var(--line-strong); border-radius: 14px; padding: 10px 12px; outline: 0; margin-top: 4px }
.ag textarea:focus { border-color: var(--ink) }
.ag-f { display: flex; align-items: center; justify-content: flex-end; gap: 12px }

/* plan plates: a chapter that is only on the route. The white tray and field bar stay; the cover is an opaque empty slot (K4, K5) */
.cover.slot { background-color: var(--well); background-image: none; box-shadow: none; color: var(--muted) }
.cover.slot::before { inset: 4px; opacity: 1; background: none; border: 1.5px dashed var(--line-strong); border-radius: var(--r-xs) }
.cover.slot .ct { font-weight: 700 }
.cover.slot .ca { opacity: 1 }
.cover.slot .cm { background: var(--line-strong) }
.mini.slot { background: var(--well); outline: 1.5px dashed var(--line-strong); outline-offset: -5px }
.hc-plan, .d-plan { color: var(--muted); font-size: 12px; line-height: 16px }
.hc-plan { margin-top: -6px }
.d-plan { margin: -4px 0 0; font-size: 13px; line-height: 18px }
.tag.t-tier.t-plan { background: var(--well); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong) }
.rel-g { display: grid; gap: 0; margin-top: 6px }
.rel-g:first-of-type { margin-top: 0 }
.rel-g > .rg { font: 700 10px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px }
.rel .tp { overflow-wrap: anywhere }

/* Today: the latest daily report, rereads that are due, notes in progress (PRD 5.2, 6.5, 7.3). No counts, no lateness (K1) */
.today li { grid-template-columns: 30px minmax(0, 1fr) auto; padding: 5px 6px }
.today .mini { width: 30px; height: 42px }
.today .t { font-size: 14px; -webkit-line-clamp: 1 }
.today li.seen .a, .today li.seen .t { color: var(--muted) }
.today li.seen .mini { filter: grayscale(.6) }
.today .ok { width: 26px; height: 26px; display: grid; place-items: center; color: var(--done) }
.today .rr { font: 600 11.5px/16px var(--sans); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.6); color: var(--ink); white-space: nowrap; transition: background .15s var(--ease), color .15s var(--ease), transform .2s var(--ease) }
.today .rr:hover, .today .rr:focus-visible { background: var(--ink); color: var(--plate); border-color: var(--ink) }
.today .rr:active { transform: scale(.96) }
.today li.none { display: block; cursor: default; padding: 2px 6px 6px; color: var(--muted); font-size: 12.5px; line-height: 17px; animation: none }
.today li.none:hover { background: none }
.rec-h { border-top: 1px solid var(--line); margin: 6px 14px 0; padding: 8px 0 4px }

/* Reading OS: shelf.html?os is the desktop layer of index.html. The OS menu bar (40 px) and Dock float over the board,
   so the floating UI moves in by --os-top and --os-bottom (the OS sets them); Today is its own app there */
html.os { --os-top: 40px; --os-bottom: 80px }
html.os #top, html.os #tools { top: calc(var(--os-top) + 8px) }

html.os #detail { top: calc(var(--os-top) + 64px); bottom: calc(var(--os-bottom) + 8px) }
/* the OS moved its windows aside (Show Desktop): their 40 px edges stay on screen, so the right-hand parts step in */
html.os.os-aside #detail { right: 52px; max-width: calc(100% - 64px) }
html.os.os-aside #top, html.os.os-aside #zoomctl { right: 52px }
html.os.os-aside #tools, html.os.os-aside #dock { left: 52px }
@media (min-width: 761px) {
  html.os.os-aside #app.detail-open #zoomctl { right: 456px }
  html.os.os-aside #app.detail-open.detail-wide #zoomctl { right: 784px }
}
html.os #hcard { max-height: calc(100vh - var(--os-top) - var(--os-bottom) - 40px) }
html.os #about { padding-top: calc(var(--os-top) + 12px); padding-bottom: calc(var(--os-bottom) + 12px) }

@media (max-width: 760px) {
  html.os #zoomctl { bottom: auto; top: calc(var(--os-top) + 58px) }
  html.os #tools { top: auto; bottom: calc(var(--os-bottom) + 60px) }
  html.os #detail { top: auto; bottom: calc(var(--os-bottom) + 8px); height: min(76%, calc(100% - var(--os-top) - var(--os-bottom) - 16px)) }
}

8%E5%BF%83.html"},{"id":"n-f8b21081","ch":2,"tier":"core","author":"02","title":"非 Transformer 架構（狀態空間 Mamba、連續微分方程、KAN、JEPA、脈衝與超維計算）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"這個領域的架構不走「先把一切切成離散詞元，再做 O(N^2) 全域兩兩比對」這條路，改用連續時間動力系統（Neural ODE / SSM）、邊樣條函數逼近（KAN）、抽象潛空間預測（JEPA）與物理事件驅動／超維代數計算（SNN / Reservoir / HDC）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/02_%E9%9D%9ETransformer%E6%9E%B6%E6%A7%8B.html"},{"id":"n-f944d2d7","ch":2,"tier":"core","author":"10","title":"現代 AI 工具鏈（RAG／GraphRAG、擴散與流匹配生成、偏好對齊強化與自主工程智能體）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"工具鏈要做的事，是把只做過靜態預訓練的基座模型，變成可溯源、能做連續生成、守得住安全邊界、還能閉環行動的生產級系統。結構化記憶靠 GraphRAG 與圖最優傳輸對齊外掛，連續幾何生成靠薛丁格橋與直線流匹配（Flow Matching / Rectified Flow），真實世界的執行迴路則靠拉格朗日解耦偏好強化（Constrained G…","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/10_%E5%B7%A5%E5%85%B7%E9%8F%88.html"},{"id":"n-08577994","ch":2,"tier":"core","author":"17","title":"評估與資料（資料去重與配比最佳化、合成教科書、污染解剖與動態基準評測）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"如果把模型架構比成引擎，預訓練資料配比就是決定基礎模型能力邊界的數位 DNA，基準評測則是儀表板，少了它就只能在古德哈特定律的迷霧裡盲飛。這個領域做兩件事：用精確去重、教科書級高密度合成與線性域歸因配比提高擴展律的效率，並用動態抗污染基準、裁判元評估與黑盒污染／配比逆向解剖，確保量到的是真實能力。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/17_%E8%A9%95%E4%BC%B0%E8%88%87%E8%B3%87%E6%96%99.html"},{"id":"n-3bb63738","ch":2,"tier":"core","author":"18","title":"RL與多模態（策略梯度與離線強化學習、統一視覺語言模型、世界模型與具身 VLA）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"這個領域把看懂物理世界（多模態感知）和在世界中行動並承擔後果（序貫強化學習）合成一個閉環智能體。感知這一邊，把影像、壓縮視訊流與自然語言對齊成統一的自迴歸詞元。決策這一邊，用廣義優勢估計（GAE）、自我博弈搜尋與離線保守強化學習壓住高變異梯度與分布偏移。兩邊合起來，目標是能直接操控實體機器人的視覺語言動作模型（VLA）與物理世界模型。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/18_RL%E8%88%87%E5%A4%9A%E6%A8%A1%E6%85%8B.html"},{"id":"n-2205d16f","ch":2,"tier":"core","author":"19","title":"AI安全攻防（間接提示注入、自動化紅隊越獄、潛伏後門投毒與偏好對齊護欄）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"自然語言計算從一開始就有一個根本問題：控制流與資料流混同（Instruction-Data Confusion）。自然語言既是系統的最高指令，又是外部不可信的輸入。這個領域一方面研究攻擊能做到什麼程度，包括間接提示注入、推理模型自主越獄、跨智能體傳染、微調退化與潛伏欺騙特工（Sleeper Agents）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/19_AI%E5%AE%89%E5%85%A8%E6%94%BB%E9%98%B2.html"},{"id":"n-f9419ef9","ch":2,"tier":"core","author":"20","title":"硬體與系統（Roofline 與記憶體牆、3D 自動並行訓練、PagedAttention 與推論引擎）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"這個領域處理的是怎麼在物理矽晶片的熱力學極限內，搬運和排程千億參數的數學圖。峰值算力每兩年成長 3.0\\times，DRAM 與跨卡互連頻寬卻只成長 1.6\\times／1.4\\times。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/20_%E7%A1%AC%E9%AB%94%E8%88%87%E7%B3%BB%E7%B5%B1.html"},{"id":"n-1edc210d","ch":2,"tier":"core","author":"42","title":"LNN 液態與邏輯神經網路（MIT 連續時間液態動力學 LTC/CfC/NCP × IBM 實值區間全向邏輯推理）","work":"領域分級精讀 / A_基礎架構與系統工程","owns":"這個領域收的是當代 AI 裡兩支都簡稱 LNN 的學派。兩者著力的層面不同，但都不走龐大黑盒模型的路。一支是 MIT 從線蟲突觸得到啟發的液態神經網路（Liquid Neural Networks：LTC / CfC / NCP / Liquid-S4），神經元的記憶時間常數會像流體一樣隨輸入即時伸縮。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/42_LNN%E6%B6%B2%E6%85%8B%E8%88%87%E9%82%8F%E8%BC%AF%E7%A5%9E%E7%B6%93%E7%B6%B2%E8%B7%AF.html"},{"id":"n-d8f24b84","ch":3,"tier":"core","author":"03","title":"數學結構化機器學習（幾何、層論、最優傳輸流與奇異學習理論）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"這個領域不把神經網路當成在平坦歐氏空間裡硬擬合曲線的黑盒。它把對稱群、層論黏合（Sheaf）、拓撲不變量、最優傳輸黎曼幾何、無窮維算子與代數幾何奇點直接寫進模型的假設空間與演化動力學。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/03_%E6%95%B8%E5%AD%B8%E7%B5%90%E6%A7%8B%E5%8C%96ML.html"},{"id":"n-88ae2043","ch":3,"tier":"core","author":"04","title":"表示對齊與類比推理（柏拉圖表示假說、跨空間最優配對與關係映射）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"這個領域研究兩件事：一是兩個智能系統的座標軸完全不同，甚至來自不同感官模態或不同學科體系，為什麼仍會收斂出同構的內部關係幾何；二是怎麼不靠人工平行標註，就完成跨空間無監督對齊、模型縫合與高階結構類比。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/04_%E8%A1%A8%E7%A4%BA%E5%B0%8D%E9%BD%8A%E8%88%87%E9%A1%9E%E6%AF%94.html"},{"id":"n-46dee7c3","ch":3,"tier":"core","author":"05","title":"形式化與推理（Lean 4 定理證明、強化學習長思維鏈、神經符號邏輯與複雜度邊界）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"這個領域用神經網路的直覺啟發式搜尋和強化學習自我博弈，去處理指數爆炸的推理搜尋空間，再用形式化證明助手（Lean 4）與可微實值邏輯（LNN / LTN）保證演繹的每一步都嚴格、沒有幻覺。這些都得在 \\mathrm{P} \\neq \\mathrm{NP} 劃下的計算極限之內進行。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/05_%E5%BD%A2%E5%BC%8F%E5%8C%96%E8%88%87%E6%8E%A8%E7%90%86.html"},{"id":"n-2a2f903e","ch":3,"tier":"core","author":"06","title":"學習動力學與可解釋性（雙重下降、頓悟相變、疊加態與稀疏自編碼器解剖學）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"這個領域一方面追蹤深度神經網路在訓練時間軸上的非線性相變（雙重下降與頓悟 Grokking），另一方面用稀疏自編碼器（SAE）與因果特徵電路，把擠在神經元疊加態裡的數百萬個人類概念逐一拆出來、定位並加以操控。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/06_%E5%AD%B8%E7%BF%92%E5%8B%95%E5%8A%9B%E5%AD%B8%E8%88%87%E5%8F%AF%E8%A7%A3%E9%87%8B%E6%80%A7.html"},{"id":"n-a7a688b9","ch":3,"tier":"core","author":"16","title":"機器學習數學地基（統計泛化界、PAC-Bayes、凸與非凸最佳化、高維機率與計算複雜度）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"這個領域為所有學習系統劃出三條數學邊界：有限樣本下需要多少資訊才能保證結論不是自欺（泛化理論），有限梯度步數下能多快找到好解（最佳化理論），以及最壞情況下哪些問題不可能被高效算出（計算複雜度與高維譜幾何）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/16_ML%E6%95%B8%E5%AD%B8%E5%9C%B0%E5%9F%BA.html"},{"id":"n-b1266622","ch":3,"tier":"core","author":"26","title":"概念空間幾何與認知拓撲（Gärdenfors 凸性、表徵幾何、線性表示假說與語意多胞形）","work":"領域分級精讀 / B_學習理論、推理與表示幾何","owns":"在離散的邏輯符號和低階的神經脈衝之間，這個領域建立第三層描述語言，也就是幾何。它研究人類心智與大型神經網路如何把概念編碼成凸區域、雙曲階層、量子投影子空間、平行四邊形概念晶體，以及可操作的拓撲骨架。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/26_%E6%A6%82%E5%BF%B5%E7%A9%BA%E9%96%93%E5%B9%BE%E4%BD%95%E8%88%87%E8%AA%8D%E7%9F%A5%E6%8B%93%E6%92%B2.html"},{"id":"n-b3add3e6","ch":4,"tier":"core","author":"11","title":"高階範疇論（Higher Category Theory & Derived Geometry）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"兩個物件「以哪一種方式同構」（見證路徑、路徑之間的變形，乃至無窮階相容性），在數學裡到處出現，傳統集合論卻把它抹平。高階範疇論把這些資訊全部保留為一等公民，替現代幾何、拓撲與物理提供一套通用的組裝框架，不丟失高階對稱性與橫截相交資訊。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/11_%E9%AB%98%E9%9A%8E%E7%AF%84%E7%96%87%E8%AB%96.html"},{"id":"n-5023aa22","ch":4,"tier":"core","author":"12","title":"HoTT與類型論（Homotopy Type Theory & Univalent Foundations）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"同倫類型論（HoTT）把三樣東西合而為一：程式／資料型別、邏輯命題／證明、拓撲空間／連續路徑，影響遍及邏輯、計算機科學與幾何學。數學家日常的直覺是「同構的結構即可視為相等」，它透過單價公理（Univalence）給這個直覺一個嚴格、可由電腦驗算的基礎。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/12_HoTT%E8%88%87%E9%A1%9E%E5%9E%8B%E8%AB%96.html"},{"id":"n-9cd2625e","ch":4,"tier":"core","author":"13","title":"代數幾何與Hodge（Algebraic Geometry, Hodge Theory & Motives）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"代數幾何與 Hodge 理論研究的是，怎麼在離散的多項式代數、連續的複流形微積分和有限域上的算術數論這三個看似不相干的領域之間，建立像羅塞塔石碑那樣可以互相對照的翻譯。它的中心問題是：一個空間的拓撲洞（上同調類），在什麼條件下確實是由多項式方程定義出來的幾何子空間（代數閉鏈），而不只是分析上算出來的東西？","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/13_%E4%BB%A3%E6%95%B8%E5%B9%BE%E4%BD%95%E8%88%87Hodge.html"},{"id":"n-5f638e6a","ch":4,"tier":"core","author":"14","title":"代數拓撲（Algebraic Topology, Spectral Sequences & Chromatic Homotopy）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"代數拓撲把可以任意拉扯扭曲的連續幾何形狀，轉換成剛性的離散代數不變量，像是替形狀取指紋。到了現代的穩定與色層同倫論（Chromatic Homotopy Theory），人們還發現高維空間裡糾纏在一起的現象，可以像白光穿過三稜鏡那樣，按素數 p 與形式群高度 n 分解成一張有規律的「拓撲元素週期表」。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/14_%E4%BB%A3%E6%95%B8%E6%8B%93%E6%92%B2.html"},{"id":"n-f1762f98","ch":4,"tier":"core","author":"15","title":"應用範疇論（Applied Category Theory, Compositionality & Markov/Poly Systems）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"範疇論曾被調侃為「抽象廢話（Abstract Nonsense）」，應用範疇論把它變成一門研究各種系統如何互連、開放系統如何組合的學問（Science of Compositionality）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/15_%E6%87%89%E7%94%A8%E7%AF%84%E7%96%87%E8%AB%96.html"},{"id":"n-d7942c12","ch":4,"tier":"core","author":"30","title":"凝聚數學與合成微分幾何（Condensed Mathematics, Synthetic Differential Geometry & Tangent Categories）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"這個領域用兩條互補的路線重寫分析學與微積分的基礎。凝聚數學（Condensed Mathematics）用收斂序列這類探針上的層取代傳統的點集拓撲空間，讓無限維泛函分析與巴拿赫空間可以放進同調代數。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/30_%E5%87%9D%E8%81%9A%E6%95%B8%E5%AD%B8%E8%88%87%E5%90%88%E6%88%90%E5%BE%AE%E5%88%86%E5%B9%BE%E4%BD%95.html"},{"id":"n-beef8afd","ch":4,"tier":"core","author":"31","title":"認識邏輯與信念修正（Epistemic Logic, Dynamic Updates & AGM Belief Revision）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"認識邏輯與信念修正是一套形式微積分，刻畫兩件事：誰知道誰知道什麼（高階心智理論 Theory of Mind），以及新證據和舊世界觀衝突時，理性主體怎麼用最小的改動重組知識庫。多智能體社會推理、賽局共識，以及當代大型語言模型的知識編輯（Model Editing），都以它為公理基礎。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/31_%E8%AA%8D%E8%AD%98%E9%82%8F%E8%BC%AF%E8%88%87%E4%BF%A1%E5%BF%B5%E4%BF%AE%E6%AD%A3.html"},{"id":"n-3c0ae2e8","ch":4,"tier":"core","author":"38","title":"形式概念分析與格論（Formal Concept Analysis, Galois Connections & Lattice Embeddings）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"形式概念分析（FCA）與格論替人和機器的概念（Concept）給出一個零參數的代數定義。只要一張「物件 × 屬性」觀察表，加上一組互為對偶的 Galois 連接，就能把雜亂的經驗資料整理成外延與內涵嚴格對應的完備概念格（Concept Lattice）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/38_%E5%BD%A2%E5%BC%8F%E6%A6%82%E5%BF%B5%E5%88%86%E6%9E%90%E8%88%87%E6%A0%BC%E8%AB%96.html"},{"id":"n-f273415f","ch":4,"tier":"core","author":"39","title":"線性邏輯與博弈語意學（Linear Logic, Game Semantics, Geometry of Interaction & Differential Categories）","work":"領域分級精讀 / C_純數學、範疇論與邏輯基礎","owns":"線性邏輯與博弈語意學把數理邏輯改寫成一套講資源、講互動的理論。Jean-Yves Girard 重新分析古典蘊含 A \\to B，把假設從可以免費無限影印的永恆真理，改成用一次就消耗掉的資源（A \\multimap B）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/39_%E7%B7%9A%E6%80%A7%E9%82%8F%E8%BC%AF%E8%88%87%E5%8D%9A%E5%BC%88%E8%AA%9E%E6%84%8F%E5%AD%B8.html"},{"id":"n-2758d705","ch":5,"tier":"core","author":"29","title":"演算法資訊理論與索羅門諾夫歸納（Algorithmic Information Theory & Solomonoff Induction）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"演算法資訊理論用「生成單一物件的最短電腦程式長度」來定義絕對的結構與隨機性。它把哲學上的奧卡姆剃刀寫成索羅門諾夫通用歸納先驗，並說明無損資料壓縮與序列泛化預測（如大語言模型）在數學上等價。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/29_%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A%E7%90%86%E8%AB%96%E8%88%87%E7%B4%A2%E7%BE%85%E9%96%80%E8%AB%BE%E5%A4%AB%E6%AD%B8%E7%B4%8D.html"},{"id":"n-06bb9b73","ch":5,"tier":"core","author":"33","title":"度量幾何與離散曲率（Metric Geometry & Discrete Curvature）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"度量幾何不需要光滑座標，也不需要二階微分。它只用兩點間的最短路徑距離，以及機率分佈沿最優傳輸搬運時鄰域的聚散或熵的凸性，就能在奇異流形、社交網路、知識圖譜乃至於非光滑時空上，重新建立嚴格的曲率（Curvature）與極限幾何。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/33_%E5%BA%A6%E9%87%8F%E5%B9%BE%E4%BD%95%E8%88%87%E9%9B%A2%E6%95%A3%E6%9B%B2%E7%8E%87.html"},{"id":"n-d458c7b5","ch":5,"tier":"core","author":"36","title":"貝氏逆問題與測度傳輸（Bayesian Inverse Problems & Measure Transport）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"從稀疏、含噪的觀測反推無窮維的隱藏物理場，是病態的不適定問題。貝氏逆問題把它改寫成函數空間上對先驗測度的平滑加權更新，測度傳輸則用確定性最優傳輸映射與交互作用粒子流，取代在高維失效的隨機漫步抽樣。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/36_%E8%B2%9D%E6%B0%8F%E9%80%86%E5%95%8F%E9%A1%8C%E8%88%87%E6%B8%AC%E5%BA%A6%E5%82%B3%E8%BC%B8.html"},{"id":"n-77312670","ch":5,"tier":"core","author":"37","title":"因果推論與反事實最優傳輸（Causal Inference & Counterfactual Optimal Transport）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"經典 Wasserstein 距離的耦合可以偷看未來，也不管因果箭頭的方向。因果與反事實最優傳輸在耦合多胞形中加入時間濾波的非預知約束與有向無環圖（DAG）結構，讓隨機控制估值、多維反事實世界的建構與公平性決策，都建立在遵守因果律的最小變形幾何上。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/37_%E5%9B%A0%E6%9E%9C%E6%8E%A8%E8%AB%96%E8%88%87%E5%8F%8D%E4%BA%8B%E5%AF%A6%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8.html"},{"id":"n-b3bdf481","ch":5,"tier":"core","author":"41","title":"最優傳輸與 P ≠ NP 計算複雜度（Optimal Transport & P ≠ NP Computational Complexity）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"最優傳輸不是一整塊多項式時間可解的問題，它正好落在 \\mathrm{P} 與 \\mathrm{NP}-Hard 的分界上。從雙邊線性傳輸往外踏出半步（二次互動、三邊際耦合或高維自由重心），問題就變得連近似都很難。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/41_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E8%88%87P_neq_NP%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6.html"},{"id":"n-a2deec48","ch":5,"tier":"core","author":"OT","title":"最優傳輸與跨域平移（Optimal Transport & Cross-Domain Translation）","work":"領域分級精讀 / D_最優傳輸、計算複雜度與演算法資訊","owns":"最優傳輸把比較兩個機率分佈、甚至對齊兩個沒有共同座標的異構概念空間，都轉成同一個問題：找出總變形與搬運代價最小的幾何耦合路徑。機率空間因此成為可微分、可插值、可以走梯度流的無窮維黎曼流形。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/OT_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E8%88%87%E8%B7%A8%E5%9F%9F%E5%B9%B3%E7%A7%BB.html"},{"id":"n-4131289c","ch":6,"tier":"core","author":"22","title":"Moiré 物理與複雜系統（Moiré Physics & Complex Systems）","work":"領域分級精讀 / E_統計物理、複雜系統與PDE算子","owns":"當微觀個體原本自由的獨立運動自由度（動能）被幾何干涉或競爭約束壓到趨近於零時，個體之間的交互作用、拓撲幾何與集體阻挫就會主導整個系統，湧現出單一個體沒有的宏觀奇異相態（非常規超導、零場分數陳絕緣體、自旋玻璃相變與自組織臨界雪崩）。","skip":"","note":"","hre B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/34_%E9%AB%98%E7%B6%AD%E6%A9%9F%E7%8E%87%E8%88%87%E9%9A%A8%E6%A9%9F%E7%9F%A9%E9%99%A3.html"},{"id":"n-c32fcae7","ch":6,"tier":"core","author":"35","title":"分數階微積分與非局域擴散（Fractional Calculus & Nonlocal Diffusion）","work":"領域分級精讀 / E_統計物理、複雜系統與PDE算子","owns":"牛頓與萊布尼茲的微積分和布朗運動有兩個簡化假設：只看無窮小的鄰居（空間局域性），以及下一秒就忘記過去（馬可夫無記憶性）。這個領域放掉這兩個假設，改用奇異積分算子與冪律記憶核，精確刻畫自然界與複雜演算法中隨處可見的兩種現象：長程大跳躍（Lévy 飛行超擴散），以及在碎形陷阱中的長時間等待（長記憶次擴散）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/35_%E5%88%86%E6%95%B8%E9%9A%8E%E5%BE%AE%E7%A9%8D%E5%88%86%E8%88%87%E9%9D%9E%E5%B1%80%E5%9F%9F%E6%93%B4%E6%95%A3.html"},{"id":"n-87df9844","ch":7,"tier":"core","author":"07","title":"發展式學習：持續學習、主動推論、內在動機與開放式演化","work":"領域分級精讀 / F_腦認知、生命形態、哲學與社會演化","owns":"發展式學習研究的是：一個能力受限的具身智能體，處在沒有固定題庫、沒有外部獎勵、世界又持續變動的開放環境裡，怎麼靠預測誤差最小化和內在好奇心驅動自己成長，並且在不忘掉舊本領的前提下持續長出新能力。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/F_%E8%85%A6%E8%AA%8D%E7%9F%A5%E3%80%81%E7%94%9F%E5%91%BD%E5%BD%A2%E6%85%8B%E3%80%81%E5%93%B2%E5%AD%B8%E8%88%87%E7%A4%BE%E6%9C%83%E6%BC%94%E5%8C%96/07_%E7%99%BC%E5%B1%95%E5%BC%8F%E5%AD%B8%E7%BF%92.html"},{"id":"n-478c6f86","ch":7,"tier":"core","author":"08","title":"情感腦認知：互補學習系統、評價理論、貝氏認知與 NeuroAI","work":"領域分級精讀 / F_腦認知、生命形態、哲學與社會演化","owns":"情感腦認知（Affective & Cognitive Neuroscience / NeuroAI）研究人類大腦怎麼在樣本極少、風險又高的社交情境中做到系統性泛化與價值權衡。它靠的是海馬迴快速記下個例、新皮質慢慢萃取結構的雙記憶系統，加上因果心智模型，以及認知評價（Appraisal）的情緒機制。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/F_%E8%85%A6%E8%AA%8D%E7%9F%A5%E3%80%81%E7%94%9F%E5%91%BD%E5%BD%A2%E6%85%8B%E3%80%81%E5%93%B2%E5%AD%B8%E8%88%87%E7%A4%BE%E6%9C%83%E6%BC%94%E5%8C%96/08_%E6%83%85%E6%84%9F%E8%85%A6%E8%AA%8D%E7%9F%A5.html"},{"id":"n-2ab70637","ch":7,"tier":"core","author":"09","title":"社會與多智能體：MARL、生成式社會模擬、平均場賽局與計算社會選擇","work":"領域分級精讀 / F_腦認知、生命形態、哲學與社 雜度（Optimal Transport & P ≠ NP Computational Complexity）":"n-b3bdf481"},"rel":"assoc"},{"a":"n-ba4ca30e","b":"n-96573f4b","k":1,"t":["演化博弈論與文化演化：複製子動力學、合作湧現、訊號賽局與累積文化演化"],"h":{"演化博弈論與文化演化：複製子動力學、合作湧現、訊號賽局與累積文化演化":"n-96573f4b"},"rel":"assoc"},{"a":"n-ba4ca30e","b":"n-2ab70637","k":1,"t":["社會與多智能體：MARL、生成式社會模擬、平均場賽局與計算社會選擇"],"h":{"社會與多智能體：MARL、生成式社會模擬、平均場賽局與計算社會選擇":"n-2ab70637"},"rel":"assoc"}],"tags":{"n-79322793":{"i":"","t":[],"m":[]},"n-47ff7f81":{"i":"","t":[],"m":[]},"n-6f8f9575":{"i":"","t":["低位元硬體算術協同與連續時間液態記憶，分別用在高效推論和不規則感測","免重訓的反事實推論、雙潛空間解耦、全局視角與物理場聯合反演，都在加強長程一致性","不對稱拓撲不變量、熱力學速度極限與分佈魯棒排序，連起純數學與 ML 的數學基礎","反洩漏、揭露審計與免真值的守恆認證，都在談科學誠實度與可驗證的門檻","多尺度能動材料與統一世界模型，連起亞細胞物理、演化搜尋與意識機制"],"m":[]},"n-e7f97b28":{"i":"","t":["神經符號邏輯與物理微分守恆，用到資源極度受限、沒有標註的場域","最優傳輸（OT）在神經加速、逆問題辨識、因果擴展與複雜度下界四個方向同時有進展","高階範疇、類型論、博弈語意與弱算子拓撲，處理了學習、力學與驗證的幾個基礎障礙"],"m":[]},"n-e5d6b1ed":{"i":"","t":[],"m":[]},"n-80181d7c":{"i":"","t":["文字轉像素的上下文權衡、擴散語言模型排程與多模態殘差安全","幾何等變性的拓撲阻礙、可抽取對稱指紋與形式化溯源邊界","高階么半與線性邏輯匯流、概念格記憶檢索與計算難度上限","動態測度傳輸反演、粗糙因果收斂與非理想非局域物理保證","受控抹除與晝夜重播、科研演化博弈與統計嚴謹性檢定"],"m":[]},"n-5effc4ba":{"i":"","t":["專題一","專題二","專題三","專題四","專題五","專題六","專題七"],"m":[]},"n-99127ae1":{"i":"","t":["計算極限、最優傳輸相變與高維統計計算鴻溝路線","組合性、高階範疇、形式化驗證與神經符號推理路線","非平衡統計物理、連續時間神經網路與函數空間算子路線","認知記憶、因果測度、多智能體博弈與科學知識演化路線"],"m":[]},"n-ed0a87fd":{"i":"S3 候選方向（數學 5、理論計算機 8、物理 4、經濟 4）各有一篇筆記，題目由學習者到時選定。物理線另有 A-level 的 14 篇（OxfordAQA 9630 規格書 3.1 到 3.14），排在 S1 之前。","t":[],"m":[]},"n-e1050175":{"i":"這類模型不再按時間步一格一格傳遞記憶，改用自注意力（Self-Attention）依內容動態尋址，讓序列中任意兩點的通訊距離降到 O(1)。再加上旋轉相對位置幾何、考慮 GPU 記憶體階層的演算法、細粒度稀疏混合專家（MoE）和計算最優擴展律，就是當代基礎模型共用的計算架構。","t":["FlashAttention 線上分塊重縮放（Dao et al., 2022）","QLoRA 資訊論最優量化微調（Dettmers et al., 2023）","矩陣正交化動量與自適應融合（2026 NAMO / FedCoMuon）","訓練期計算最優與推論期記憶體、異構部署成本的錯位","逐座標自適應（AdamW）與矩陣譜結構正交化（Muon）兩條最佳化路線","常駐共享基底加動態稀疏專科路由的架構模式","Attention Is All You Need","L5 深度審核完成","Scaling Laws for Neural Language Models"],"m":[]},"n-f8b21081":{"i":"這個領域的架構不走「先把一切切成離散詞元，再做 O(N^2) 全域兩兩比對」這條路，改用連續時間動力系統（Neural ODE / SSM）、邊樣條函數逼近（KAN）、抽象潛空間預測（JEPA）與物理事件驅動／超維代數計算（SNN / Reservoir / HDC）。","t":["超長連續訊號的二次方成本","逐像素／逐詞元生成把算力花在不可預測的雜訊上","多層感知機（MLP）的黑盒節點僵化","馮紐曼同步時脈的能耗極限","把固定齒輪換成可塑凸輪曲線的精密機械（KAN）","只預測棋局走勢、不背誦棋盤木紋的大師（JEPA）","結構化與選擇性狀態空間模型及線性循環復興（S4, Mamba & RWKV）","連續深度微分方程與時變液態動力系統（Neural ODE, LTC & CfC）","可學習邊樣條函數網路與非生成式潛空間預測（KAN & JEPA）","KAN（Kolmogorov–Arnold Networks）"],"m":[]},"n-f944d2d7":{"i":"工具鏈要做的事，是把只做過靜態預訓練的基座模型，變成可溯源、能做連續生成、守得住安全邊界、還能閉環行動的生產級系統。結構化記憶靠 GraphRAG 與圖最優傳輸對齊外掛，連續幾何生成靠薛丁格橋與直線流匹配（Flow Matching / Rectified Flow），真實世界的執行迴路則靠拉格朗日解耦偏好強化（Constrained G…","t":["知識凍結與黑盒幻覺","連續模態生成的彎曲耗散","後訓練對齊的刷分越界陷阱","自主智能體評測的時空作弊假象","車隊相對競速與獨立緊急煞車（Constrained GRPO）","配備歷史隔離沙盒的機械手臂（Autonomous SWE Agents）","黎曼流形無模擬流匹配（Chen & Lipman, 2024 RFM）","時間一致性零洩漏隔離協議（Sun et al., 2026，🏆 L5）","稠密神經檢索的隱式綜合力，與符號圖譜溯源的透明性和可問責性","交換半環 How-Provenance 多項式 → 自動化科學發現與形式化審計"],"m":[]},"n-08577994":{"i":"如果把模型架構比成引擎，預訓練資料配比就是決定基礎模型能力邊界的數位 DNA，基準評測則是儀表板，少了它就只能在古德哈特定律的迷霧裡盲飛。這個領域做兩件事：用精確去重、教科書級高密度合成與線性域歸因配比提高擴展律的效率，並用動態抗污染基準、裁判元評估與黑盒污染／配比逆向解剖，確保量到的是真實能力。","t":["規模飢渴與冗餘毒化的矛盾","排行榜繁榮與觀測等價性危機（Observational Equivalence）","語意級改寫／合成蒸餾污染，與事後檢測的統計變異限制","高純度合成資料的效率，與認知窄化和英語霸權","Benchmark characterization","Textbooks Are All You Need"],"m":[]},"n-3bb63738":{"i":"這個領域把看懂物理世界（多模態感知）和在世界中行動並承擔後果（序貫強化學習）合成一個閉環智能體。感知這一邊，把影像、壓縮視訊流與自然語言對齊成統一的自迴歸詞元。決策這一邊，用廣義優勢估計（GAE）、自我博弈搜尋與離線保守強化學習壓住高變異梯度與分布偏移。兩邊合起來，目標是能直接操控實體機器人的視覺語言動作模型（VLA）與物理世界模型。","t":["模態異質，以及理解與生成的表徵分裂","非平穩互動的代價與反事實高估（Distributional Shift）","資料驅動垂直微調的標註瓶頸，與世界模型視覺逼真但物理失真的問題","用視訊編解碼器（Codec）的位元成本流引導神經運算資源分配"],"m":[]},"n-2205d16f":{"i":"自然語言計算從一開始就有一個根本問題：控制流與資料流混同（Instruction-Data Confusion）。自然語言既是系統的最高指令，又是外部不可信的輸入。這個領域一方面研究攻擊能做到什麼程度，包括間接提示注入、推理模型自主越獄、跨智能體傳染、微調退化與潛伏欺騙特工（Sleeper Agents）。","t":["外部控制流劫持的矛盾","表層對齊的脆弱與策略性偽裝的矛盾","架構降權法（Jatmo, Piet et al., 2024）","偏好優先級對齊（SecAlign, Chen et al., 2025）","推理能力躍升對安全是助力還是威脅","開放通用智能體生態與零信任權限隔離的工程兩難","從整筆拒答改為局部定位切除（PromptLocate）的容錯設計"],"m":[]},"n-f9419ef9":{"i":"這個領域處理的是怎麼在物理矽晶片的熱力學極限內，搬運和排程千億參數的數學圖。峰值算力每兩年成長 3.0\\times，DRAM 與跨卡互連頻寬卻只成長 1.6\\times／1.4\\times。","t":["訓練端的顯存爆炸與通訊塞車矛盾","推論端的頻寬飢餓與動態顯存碎片矛盾","靜態圖封裝加速，與測試時動態稀疏及內部白盒干預之間的架構拉鋸","把古典作業系統五十年的設計模式對應到大模型系統","AI and Memory Wall"],"m":[]},"n-1edc210d":{"i":"這個領域收的是當代 AI 裡兩支都簡稱 LNN 的學派。兩者著力的層面不同，但都不走龐大黑盒模型的路。一支是 MIT 從線蟲突觸得到啟發的液態神經網路（Liquid Neural Networks：LTC / CfC / NCP / Liquid-S4），神經元的記憶時間常數會像流體一樣隨輸入即時伸縮。","t":["連續物理時間側的僵化（Liquid NN 處理的問題）","符號邏輯推理側被壓成黑盒（Logical NN 處理的問題）","邏輯神經網路（IBM Logical NN）是雙向透明的水晶邏輯電路板","液態脈絡 I：非脈衝化學突觸與液態時間常數網路（LSM → LTC & NCP）","四態認識語意與開放世界假設","帶權重實值 Łukasiewicz 合取神經元","全向邊界傳播與受約束梯度學習","Liquid Time-constant Networks","L5 深度審核完成","Logical Neural Networks"],"m":[]},"n-d8f24b84":{"i":"這個領域不把神經網路當成在平坦歐氏空間裡硬擬合曲線的黑盒。它把對稱群、層論黏合（Sheaf）、拓撲不變量、最優傳輸黎曼幾何、無窮維算子與代數幾何奇點直接寫進模型的假設空間與演化動力學。","t":["暴力黑盒學習","數學結構化 ML","高維最優傳輸的計算瓶頸、小批次偏差與無偏生成流","Lawvere 充實範疇視角（度量即邏輯、對偶即伴隨）","用層論的局部到全局一致性（Sheaf Cohomology）偵測矛盾","Topics in Optimal Transportation","L5 深度審核完成"],"m":[]},"n-88ae2043":{"i":"這個領域研究兩件事：一是兩個智能系統的座標軸完全不同，甚至來自不同感官模態或不同學科體系，為什麼仍會收斂出同構的內部關係幾何；二是怎麼不靠人工平行標註，就完成跨空間無監督對齊、模型縫合與高階結構類比。","t":["共享幾何是否等於共享物理與因果機制（柏拉圖假說的嚴格邊界）","跨模態對齊該用連續潛空間的黑盒調變，還是顯式的離散中間思維層","用非平衡 Gromov–Wasserstein（UGW）做科學史與學科演化對齊","演化樹與連續嵌入空間的雙向錨定","Information Distance","CAB: Connectionist Analogy Builder","L5 深度審核完成"],"m":[]},"n-46dee7c3":{"i":"這個領域用神經網路的直覺啟發式搜尋和強化學習自我博弈，去處理指數爆炸的推理搜尋空間，再用形式化證明助手（Lean 4）與可微實值邏輯（LNN / LTN）保證演繹的每一步都嚴格、沒有幻覺。這些都得在 \\mathrm{P} \\neq \\mathrm{NP} 劃下的計算極限之內進行。","t":["純強化學習隱式長思維鏈與顯式神經符號／形式化約束的路線之爭","自動形式化（Autoformalization）的語意保真瓶頸","PCP 用局部隨機抽檢換取全局可驗證性的思想","神經符號因果推理與訊號賽局（Signaling Games）","Some Optimal Inapproximability Results","L5 深度審核完成","The Lean mathematical library","Logical Neural Networks"],"m":[]},"n-2a2f903e":{"i":"這個領域一方面追蹤深度神經網路在訓練時間軸上的非線性相變（雙重下降與頓悟 Grokking），另一方面用稀疏自編碼器（SAE）與因果特徵電路，把擠在神經元疊加態裡的數百萬個人類概念逐一拆出來、定位並加以操控。","t":["訓練動力學之謎","內部黑盒多義性之謎","SAE 提取的是模型真實使用的因果原語，還是事後字典擬合的人工偽影","從自回歸單向流到雙向擴散語言模型（DLM）的時間軸可解釋性","自組織臨界性（SOC）與梯度雪崩監測"],"m":[]},"n-a7a688b9":{"i":"這個領域為所有學習系統劃出三條數學邊界：有限樣本下需要多少資訊才能保證結論不是自欺（泛化理論），有限梯度步數下能多快找到好解（最佳化理論），以及最壞情況下哪些問題不可能被高效算出（計算複雜度與高維譜幾何）。","t":["統計誤差（樣本有限 n）","最佳化誤差（迭代步數有限 T）","計算複雜度限制（時間多項式有界）","計算複雜度（Arora–Barak / Håstad）","最佳化理論（Bubeck / Sun）","高維機率與隨機矩陣（Vershynin / Anderson et al.）","現代統計學習（PAC-Bayes / 資訊泛化界）","統計泛化理論的演進：從一致收斂到無維度 PAC-Bayes 與資訊論界","如何消除百億參數大模型的空洞泛化界（Vacuous Bounds）且不依賴重抽樣","譜幾何壓縮與長尾罕見知識保留之間的張力"],"m":[]},"n-b1266622":{"i":"在離散的邏輯符號和低階的神經脈衝之間，這個領域建立第三層描述語言，也就是幾何。它研究人類心智與大型神經網路如何把概念編碼成凸區域、雙曲階層、量子投影子空間、平行四邊形概念晶體，以及可操作的拓撲骨架。","t":["Shepard 普適指數衰減律","非歐層級與非對稱性","線性表示假說（LRH）的群作用公理化與概念晶體多胞形","共享流形以支持泛化，或分裂到正交子空間以避免任務干擾","純幾何夾角能否解釋特徵干涉","跨視覺型態（照片 ↔ 素描 ↔ 醫學影像）的語意投影對齊（SPACE）","從位元通訊走向 Gärdenfors 概念 Voronoi 語意通訊"],"m":[]},"n-b3add3e6":{"i":"兩個物件「以哪一種方式同構」（見證路徑、路徑之間的變形，乃至無窮階相容性），在數學裡到處出現，傳統集合論卻把它抹平。高階範疇論把這些資訊全部保留為一等公民，替現代幾何、拓撲與物理提供一套通用的組裝框架，不丟失高階對稱性與橫截相交資訊。","t":["計算與形式化驗證的可擴展性挑戰","遷移至 05_形式化與推理 與軟體工程（保留見證而非布林抹除）"],"m":[]},"n-5023aa22":{"i":"同倫類型論（HoTT）把三樣東西合而為一：程式／資料型別、邏輯命題／證明、拓撲空間／連續路徑，影響遍及邏輯、計算機科學與幾何學。數學家日常的直覺是「同構的結構即可視為相等」，它透過單價公理（Univalence）給這個直覺一個嚴格、可由電腦驗算的基礎。","t":["有向類型論（Directed Type Theory）的統一語法與對偶扭轉","大型形式化生態分裂與 AI 自動驗證合成（Vericoding）"],"m":[]},"n-9cd2625e":{"i":"代數幾何與 Hodge 理論研究的是，怎麼在離散的多項式代數、連續的複流形微積分和有限域上的算術數論這三個看似不相干的領域之間，建立像羅塞塔石碑那樣可以互相對照的翻譯。它的中心問題是：一個空間的拓撲洞（上同調類），在什麼條件下確實是由多項式方程定義出來的幾何子空間（代數閉鏈），而不只是分析上算出來的東西？","t":["代數閉鏈構造極限與自守上同調障礙","非阿貝爾 Hodge 理論中的「墨菲定律（Murphy's Law）」與算術剛性","p-進 Hodge、凝聚分析空間與母題同倫的統一","遷移至 22_moiré物理與複雜系統（穩定性跨牆公式與相圖跳躍）","Murphy's law in non-abelian Hodge theory"],"m":[]},"n-5f638e6a":{"i":"代數拓撲把可以任意拉扯扭曲的連續幾何形狀，轉換成剛性的離散代數不變量，像是替形狀取指紋。到了現代的穩定與色層同倫論（Chromatic Homotopy Theory），人們還發現高維空間裡糾纏在一起的現象，可以像白光穿過三稜鏡那樣，按素數 p 與形式群高度 n 分解成一張有規律的「拓撲元素週期表」。","t":["譜序列：從局部碎片逐層逼近全局的計算工具（Spectral Sequences）","正特徵代數幾何與拓撲譜序列的非退化極限","從「全可逆群胚」走向「有向與帶伴隨高階拓撲」","高階色層結構與量子場論高階反常（Higher Anomalies）的精確算表","遷移至 22_moiré物理與複雜系統（配邊不變量分類拓撲物態）"],"m":[]},"n-f1762f98":{"i":"範疇論曾被調侃為「抽象廢話（Abstract Nonsense）」，應用範疇論把它變成一門研究各種系統如何互連、開放系統如何組合的學問（Science of Compositionality）。","t":["連續時間隨機／非確定性開放系統的行為可表性（Clock Systems）","從「靜態接線圖」走向「自修改動態拓撲（Dynamic Rewiring）」"],"m":[]},"n-d7942c12":{"i":"這個領域用兩條互補的路線重寫分析學與微積分的基礎。凝聚數學（Condensed Mathematics）用收斂序列這類探針上的層取代傳統的點集拓撲空間，讓無限維泛函分析與巴拿赫空間可以放進同調代數。","t":["拓撲阿貝爾群不是阿貝爾範疇（代數與分析接不起來）","光滑流形缺乏冪零無窮小與函數空間的笛卡爾閉性（微積分的組合操作很笨重）","凝聚集合（Condensed Set）","合成微分幾何（Kock–Lawvere 公理）","Kock–Lawvere 公理（SDG）","公理化內聚性（Cohesion）","切範疇：把取切叢提煉成精簡的泛代數算子（Tangent Categories）","切範疇中的全域李理論與非線性 PDE 基礎","無窮維場論與非線性 PDE 解空間的形式嚴格化","遷移至 05_形式化與推理（為 AI 驗證而重構公理的思路）"],"m":[]},"n-beef8afd":{"i":"認識邏輯與信念修正是一套形式微積分，刻畫兩件事：誰知道誰知道什麼（高階心智理論 Theory of Mind），以及新證據和舊世界觀衝突時，理性主體怎麼用最小的改動重組知識庫。多智能體社會推理、賽局共識，以及當代大型語言模型的知識編輯（Model Editing），都以它為公理基礎。","t":["非單調信念衝突（Belief Revision）","認識可能世界圖（Kripke Model）","AGM 信念修正","LLM 的理性信念修正與社交壓力下的諂媚（Sycophancy）","不可知性（Unknowability / Fitch 悖論）與動態無切消證明論"],"m":[]},"n-3c0ae2e8":{"i":"形式概念分析（FCA）與格論替人和機器的概念（Concept）給出一個零參數的代數定義。只要一張「物件 × 屬性」觀察表，加上一組互為對偶的 Galois 連接，就能把雜亂的經驗資料整理成外延與內涵嚴格對應的完備概念格（Concept Lattice）。","t":["Galois 連接","多伴隨概念格（Medina et al. 2009）","語言修飾詞壓縮（Belohlavek & Vychodil 2012）","三支概念格（Qi, Wei & Yao 2014）","LLM 統計主題建模與 FCA 符號概念格：覆蓋率與忠實度的取捨","非交換／矩陣域上的保序嵌入剛性定理","Order embeddings of real matrix domains"],"m":[]},"n-f273415f":{"i":"線性邏輯與博弈語意學把數理邏輯改寫成一套講資源、講互動的理論。Jean-Yves Girard 重新分析古典蘊含 A \\to B，把假設從可以免費無限影印的永恆真理，改成用一次就消耗掉的資源（A \\multimap B）。","t":["乘法同時擁有 A \\otimes B（Tensor）","加法內部選擇 A \\binampersand B（With）","加法外部選擇 A \\oplus B（Plus）","推論主義哲學與博弈語意的合流，以及線性邏輯的泛代數深層結構","遷移至 20_硬體與系統 與量子／異質編譯（GoI 無中心流編譯思想）","遷移至 03_數學結構化ML（程式泰勒展開與符號神經混合求導）","L5 深度審核完成"],"m":[]},"n-2758d705":{"i":"演算法資訊理論用「生成單一物件的最短電腦程式長度」來定義絕對的結構與隨機性。它把哲學上的奧卡姆剃刀寫成索羅門諾夫通用歸納先驗，並說明無損資料壓縮與序列泛化預測（如大語言模型）在數學上等價。","t":["食譜與外賣照片（Kolmogorov 複雜度 K(x)）","索羅門諾夫的萬能賭徒（Solomonoff Induction）","從神諭壓縮到人類算力壓縮（Epiplexity）","前綴 Kolmogorov 複雜度 K(x)、不變性定理與不可計算性","最小描述長度（MDL）與計算受限結構資訊（Epiplexity）","兩階段／精緻 MDL","計算受限分解（Time-Bounded MDL / Epiplexity）","Grokking（延遲頓悟）中特徵學習與編碼壓縮之爭","通用先驗的主觀常數陷阱（The O(1) Trap）","遷移至 17_評估與資料（預訓練資料價值評估）"],"m":[]},"n-06bb9b73":{"i":"度量幾何不需要光滑座標，也不需要二階微分。它只用兩點間的最短路徑距離，以及機率分佈沿最優傳輸搬運時鄰域的聚散或熵的凸性，就能在奇異流形、社交網路、知識圖譜乃至於非光滑時空上，重新建立嚴格的曲率（Curvature）與極限幾何。","t":["正曲率（地球儀球面／緊密小圈子社群）","零曲率（平坦廣場／方格網）","負曲率（馬鞍面／樹狀分岔與跨部門瓶頸橋樑）","幾何深度學習與圖神經網路（03_數學結構化ML）","統計物理與廣義相對論時空基礎（28_非平衡態統計力學與隨機熱力學）","Ollivier–Ricci 粗曲率與 Lin–Lu–Yau 圖曲率","動力學離散 Ricci 流、多尺度社群解構與 GNN 瓶頸處理","有向空間與非對稱因果結構的度量幾何化","精確度量比較（GH）的計算困難與局部曲率指紋的可計算性","遷移至 09_社會與多智能體（輿論極化與韌性網路設計）"],"m":[]},"n-d458c7b5":{"i":"從稀疏、含噪的觀測反推無窮維的隱藏物理場，是病態的不適定問題。貝氏逆問題把它改寫成函數空間上對先驗測度的平滑加權更新，測度傳輸則用確定性最優傳輸映射與交互作用粒子流，取代在高維失效的隨機漫步抽樣。","t":["隔著毛玻璃猜雕像（函數空間貝氏適定性）","盲人摸象隨機跳與捏黏土定向變形（MCMC 與測度傳輸）","登山隊繩索互助（集合卡爾曼反演 EKI 與粒子流）","擴散模型與條件生成（10_工具鏈、OT_最優傳輸與跨域平移）","大腦預測編碼與主動推論（08_情感腦認知、07_發展式學習）","無窮維函數空間貝氏公式、後驗適定性與收斂率（Stuart 範式）","確定性測度傳輸與 Knothe–Rosenblatt 三角重排映射","集合卡爾曼濾波／反演（EnKF / EKI）與無導數交互粒子動力學","擴散先驗逆問題中加噪似然不可解性與後驗失真之間的張力（Duong 2026）","小集合亞空間塌縮（Subspace Collapse）與高維多峰穿隧"],"m":[]},"n-77312670":{"i":"經典 Wasserstein 距離的耦合可以偷看未來，也不管因果箭頭的方向。因果與反事實最優傳輸在耦合多胞形中加入時間濾波的非預知約束與有向無環圖（DAG）結構，讓隨機控制估值、多維反事實世界的建構與公平性決策，都建立在遵守因果律的最小變形幾何上。","t":["順著骨牌順序推演平行宇宙（DAG 圖因果傳輸與反事實映射）","介入（Interventional）與回溯（Backtracking）反事實","序列決策、量化金融與強化學習（18_RL與多模態）","圖因果最優傳輸（Graph Causal OT）與有向無環圖度量理論","反事實最優傳輸：介入推前、回溯反事實與重心公平性","回溯反事實傳輸","反事實公平迴歸（Generali Lince et al. 2026）","觀測資料混雜消除與多重處置因果效應估計","適配與圖因果 Wasserstein 距離的高維統計與計算瓶頸","遷移至 18_RL與多模態、世界模型與離線強化學習"],"m":[]},"n-b3bdf481":{"i":"最優傳輸不是一整塊多項式時間可解的問題，它正好落在 \\mathrm{P} 與 \\mathrm{NP}-Hard 的分界上。從雙邊線性傳輸往外踏出半步（二次互動、三邊際耦合或高維自由重心），問題就變得連近似都很難。","t":["雙人舞配對，對比三人組隊與座位互動","全息防偽抽查（Håstad PCP）","結冰的彈珠迷宮（OGP 重疊間隙）","代數幾何與表示論（13_代數幾何與Hodge）","1. 變體 NP-Hardness 相變","2. 多胞形擴展複雜度","3. 算子縮放與 GCT","4. 細粒度複雜度與流極限","5. PCP 緊不可近似性","6. 自旋玻璃與 OGP"],"m":[]},"n-a2deec48":{"i":"最優傳輸把比較兩個機率分佈、甚至對齊兩個沒有共同座標的異構概念空間，都轉成同一個問題：找出總變形與搬運代價最小的幾何耦合路徑。機率空間因此成為可微分、可插值、可以走梯度流的無窮維黎曼流形。","t":["Monge–Kantorovich 搬土問題","Kantorovich 對偶（物流公司報價）","Gromov–Wasserstein 跨星系拼圖","生成式 AI 與流匹配（10_工具鏈）","Monge–Kantorovich 對偶、Brenier 單調映射與影子價格","熵正則化、Sinkhorn 演算法與 Schrödinger 橋","Otto 微積分、JKO 變分格式與 Wasserstein 重心","Benamou–Brenier 動態公式","JKO 時間離散步","Agueh–Carlier Wasserstein 重心"],"m":[]},"n-4131289c":{"i":"當微觀個體原本自由的獨立運動自由度（動能）被幾何干涉或競爭約束壓到趨近於零時，個體之間的交互作用、拓       out.md = o.text; if (!raf && !done) raf = requestAnimationFrame(function () { raf = 0; if (!done) setRich(view, out.md, true); });
    } }).then(function (r) { out.md = r.text; })
      .catch(function (err) { out.md = ((err && err.text) || out.md || "") + (err && err.code === "not_granted" ? "\n\n_This page was not allowed to use Claude._" : "\n\n_The answer did not finish. Press ✦ on the first box to try again._"); })
      .then(function () { done = true; delete out.gen; renderBox(out); saveItem(out); });
  }

  /* ---------- boot ---------- */
  setDock(lsGet("rdg-dock", false));
  if (GRAV !== 1) applyGravity(GRAV, false);
  applyPapers(); applyWires(); renderCounts(); renderRec(); renderSpot();
  if (window.innerWidth <= 760) $("#q").placeholder = "Search";
  fitTo(visibleNodes(), 0);
  if (!G.papers.length) $("#tPapers").hidden = true;
  if ($("#spotPdf")) $("#spotPdf").hidden = true;
  ["ledger", "msc", "agent"].forEach(function (t) { var b = document.querySelector('#about .tabs [data-tab="' + t + '"]'); if (b && (t === "agent" || !(G[t] && G[t].length))) b.hidden = true; });
  /* deep links: #n=<id> opens a note, #k focuses search (note pages send Cmd-K here), #today opens Today */
  function onHash(first) {
    var h = location.hash, m = /^#n=([\w-]+)$/.exec(h);
    if (m && byId[m[1]]) setTimeout(function () { openDetail(m[1], true); }, first ? 450 : 0);
    else if (h === "#k") setTimeout(focusSearch, first ? 120 : 0);
    else if (h === "#today") openToday();
  }
  onHash(true);
  window.addEventListener("hashchange", function () { onHash(false); });
  window.addEventListener("resize", function () { clearTimeout(qT); qT = setTimeout(function () { if (!spot.length && !query && !trayFilter) fitTo(visibleNodes(), 0); }, 200); });
  /* Reading OS: the rules say where Today and Read note go there */
  if (OS && Array.isArray(G.rules)) G.rules = G.rules.map(function (r) {
    if (/^\*\*Today\*\*/.test(r)) return "**Today** is its own app in the Dock: the latest daily report, rereads that are due, and notes you are reading. Press **Cmd-K** (Ctrl-K on Windows and Linux) for Spotlight, then type **today** or 今天 and press Enter to open it.";
    return r.replace("**Read note** opens the full page.", "**Read note** opens it in a Reader window.");
  });

  /* ---------- frame API: Reading OS's Shelf app drives the board through window.RDGBoard ---------- */
  var flashT = 0;
  window.RDGBoard = {
    openDetail: function (id) { if (!byId[id]) return false; $("#about").hidden = true; openDetail(id, true); return true; },
    focusNote: function (id) { var n = byId[id]; if (!n) return false; if (n.kind === "paper" && !showPapers) { showPapers = true; applyPapers(); } fitTo([n], 700); try { n.el.focus({ preventScroll: true }); } catch (e) {} return true; },
    filterTray: function (s) {
      trayFilter = LABEL[s] ? s : null; syncTrays();
      if (trayFilter) { query = ""; $("#q").value = ""; }
      applyFocus(true);
      if (trayFilter && !nodes.some(function (n) { return st(n.id) === trayFilter; })) toast(LABEL[trayFilter] + " is empty. Drag a note onto it");
      if (!trayFilter) fitTo(spot.length ? [] : visibleNodes(), 700);
      return trayFilter;
    },
    focusField: function (ch) {
      var list = (groups[ch] || []).filter(function (n) { return showPapers || n.kind !== "paper"; }); if (!list.length) return false;
      fitTo(list, 700); setDisc(String(ch)); clearTimeout(flashT);
      flashT = setTimeout(function () { if (!mouse) setDisc(null); }, 1600);
      return true;
    },
    fit: function () { fitTo(visibleNodes(), 700); },
    toggle: function (what, on) {
      if (what === "links") { wiresOn = on === undefined ? !wiresOn : !!on; lsSet("rdg-wires", wiresOn); applyWires(); return wiresOn; }
      if (what === "papers") { showPapers = on === undefined ? !showPapers : !!on; lsSet("rdg-papers", showPapers); applyPapers(); applyFocus(false); return showPapers; }
      return null;
    },
    state: function () { return { links: wiresOn, papers: showPapers, hasPapers: G.papers.length > 0, tray: trayFilter, detail: detailId }; },
    insets: function (top, bottom) { setInsets(top, bottom); if (!spot.length && !query && !trayFilter && !detailId) fitTo(visibleNodes(), 0); }
  };

  function useLocal() {
    store = { kind: "local", put: function (id, v) { var all = lsGet("rdg-progress", {}); if (v) all[id] = v; else delete all[id]; lsSet("rdg-progress", all); return Promise.resolve(); },
      putMine: function (id, v) { var all = lsGet("rdg-mine", {}); all[id] = v; lsSet("rdg-mine", all); return Promise.resolve(); },
      putChat: function (id, v) { var all = lsGet("rdg-chats", {}); all[id] = v; lsSet("rdg-chats", all); return Promise.resolve(); },
      putItem: function (id, v) { var all = lsGet("rdg-board", {}); all[id] = v; lsSet("rdg-board", all); return Promise.resolve(); },
      delItem: function (id) { var all = lsGet("rdg-board", {}); delete all[id]; lsSet("rdg-board", all); return Promise.resolve(); },
      putExt: function (id, v) { var all = lsGet("rdg-ext", {}); all[id] = v; lsSet("rdg-ext", all); return Promise.resolve(); },
      delExt: function (id) { var all = lsGet("rdg-ext", {}); delete all[id]; lsSet("rdg-ext", all); return Promise.resolve(); },
      putCfg: function (v) { lsSet("rdg-agent", v); return Promise.resolve(); } };
    cfg = lsGet("rdg-agent", cfg) || cfg;
    var ex = lsGet("rdg-ext", {}); Object.keys(ex).forEach(function (k) { if (ex[k] && ex[k].id) mountExt(ex[k]); });
    var bd = lsGet("rdg-board", {}); Object.keys(bd).forEach(function (k) { if (bd[k] && bd[k].type) { items[k] = bd[k]; drawItem(bd[k]); } });
    progress = lsGet("rdg-progress", {}); mine = lsGet("rdg-mine", {}); Object.keys(mine).forEach(function (k) { mineOf(k); }); chats = lsGet("rdg-chats", {}); canWrite = true;
    Object.keys(progress).forEach(function (id) { if (byId[id]) paint(id, false); });
    renderCounts(); renderRec(); progressLoaded();
  }
  (async function () {
    if (!window.claude || !window.claude.use) { useLocal(); return; }
    try {
      var res = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample")]);
      var db = res[0], user = res[1]; sampleFn = res[2] || null;
      if (!db) { useLocal(); return; }
      canWrite = user ? !!(await user.isOwner()) : false;
      var col = db.collection("progress"), ic = db.collection("intros_en"), mc = db.collection("mine"), cc = db.collection("chats"), bc = db.collection("board"), xc = db.collection("ext"), sc = db.collection("settings");
      store = { kind: "db",
        put: function (id, v) { return v ? col.doc(id).set({ s: v.s, at: v.at }) : col.doc(id).delete(); },
        putIntro: function (id, text) { return ic.doc(id).set({ text: text, at: new Date().toISOString() }); },
        putMine: function (id, v) { return mc.doc(id).set(v); },
        putChat: function (id, v) { return cc.doc(id).set(v); },
        putItem: function (id, v) { return bc.doc(id).set(v); },
        delItem: function (id) { return bc.doc(id).delete(); },
        putExt: function (id, v) { return xc.doc(id).set(v); },
        delExt: function (id) { return xc.doc(id).delete(); },
        putCfg: function (v) { return sc.doc("agent").set(v); } };
      sc.onSnapshot(function (snap) { snap.docs.forEach(function (d) { if (d.id !== "agent" || d.metadata.hasPendingWrites || cfgEditing) return; var v = d.data() || {}; cfg = { agent: String(v.agent || ""), instr: String(v.instr || "") }; if (aboutCur === "agent" && !$("#about").hidden) aboutTab("agent"); }); }, function () {});
      xc.onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) {
          var id = ch.doc.id;
          if (ch.type === "removed") { unmountExt(id); return; }
          var v = ch.doc.data(); if (!v || byId[id]) return; v.id = id; mountExt(v);
        });
        renderRec();
      }, function () {});
      bc.onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) {
          var d = ch.doc, id = d.id;
          if (ch.type === "removed") { if (items[id]) { undrawItem(id); delete items[id]; } return; }
          if (d.metadata.hasPendingWrites) return;
          var v = d.data(); if (!v || !/^(text|stroke|arrow)$/.test(v.type)) return;
          var el = document.querySelector('.tbox[data-bid="' + id + '"]'); if (el && el.classList.contains("editing")) return;
          if (boxDrag && boxDrag.it.id === id) return;
          v.id = id; items[id] = v; drawItem(v);
        });
      }, function () {});
      mc.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (!v || !byId[d.id]) return; if (d.metadata.hasPendingWrites) return; if (d.id === detailId && noteEditing) return; mine[d.id] = { tags: Array.isArray(v.tags) ? v.tags.map(String) : [], notes: Array.isArray(v.notes) ? v.notes.filter(function (x) { return x && typeof x.md === "string"; }) : (v.md ? [{ id: "n0", md: String(v.md), at: v.at }] : []), at: v.at }; });
        if (detailId && !noteEditing) renderMine();
      }, function () {});
      cc.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (!v || !byId[d.id] || d.metadata.hasPendingWrites) return; if (d.id === detailId && chatBusy) return; chats[d.id] = { turns: Array.isArray(v.turns) ? v.turns.filter(function (t) { return t && typeof t.q === "string"; }) : [] }; });
        if (detailId && !chatBusy) renderChat();
      }, function () {});
      col.onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v && LABEL[v.s] && byId[d.id]) next[d.id] = v; });
        Object.keys(pending).forEach(function (id) { if (pending[id]) { if (progress[id]) next[id] = progress[id]; else delete next[id]; } });
        var changed = {}; Object.keys(next).concat(Object.keys(progress)).forEach(function (id) { if ((next[id] && next[id].s) !== (progress[id] && progress[id].s)) changed[id] = 1; });
        progress = next;
        Object.keys(changed).forEach(function (id) { paint(id, false); });
        renderCounts(); renderRec(); if (detailId) refreshDetail(); if (trayFilter) applyFocus(false);
        progressLoaded();
      }, function () { canWrite = false; });
      ic.onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { var v = d.data(); if (v && v.text) intros[d.id] = { text: String(v.text) }; });
        if (detailId && intros[detailId]) { var e = document.getElementById("introTxt"); if (e && e.classList.contains("wait")) { e.textContent = intros[detailId].text; e.classList.remove("wait"); } }
      }, function () {});
      if (detailId) renderDetail();
    } catch (e) { useLocal(); }
  })();
})();
</script>
