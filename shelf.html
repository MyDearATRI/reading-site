<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ecebe6"></head><body><title>Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
/* Layout: one light board, deliberately single-theme. Books float on white plates in twelve chapter clusters; quiet UI floats at the edges. Atlas shell type and neutrals. */
:root {
  color-scheme: light;
  --board: #ecebe6; --dot: #d3d0c7; --board-lit: #d9d6ce;
  --plate: #ffffff; --surface: #faf9f6; --well: #f1efe9;
  --ink: #23221d; --muted: #67635a; --line: #dedad1; --line-strong: #8a8474;
  --wire: #9c988e; --wire-hot: #2f2d27;
  --olive: #626c55; --wine: #875e60; --focus: #2b5d86;
  --todo: #d1493a; --todo-ink: #ffffff; --todo-chip: #c03f30;
  --reading: #e9b10c; --reading-ink: #2a2100;
  --done: #3a9660; --done-ink: #ffffff; --done-chip: #2d7d4e;
  --serif: var(--sans);
  --sans: "Helvetica Neue", "Neue Haas Grotesk Text Pro", Helvetica, "Inter Tight", Arial, "PingFang TC", "Noto Sans TC", sans-serif;
  --swiss: #e3000f;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --r-xs: 7px; --r-s: 10px; --r-m: 14px; --r-l: 22px; --r-xl: 34px;
  --glass: rgba(255,255,255,.56); --glass-line: rgba(255,255,255,.7);
  --shadow: 0 1px 0 rgba(34,33,28,.05), 0 8px 22px rgba(34,33,28,.10);
  --shadow-lift: 0 1px 0 rgba(34,33,28,.06), 0 16px 36px rgba(34,33,28,.18);
}
html { height: 100%; box-sizing: border-box }
*, *::before, *::after { box-sizing: inherit }
body { height: 100%; margin: 0; background: var(--board); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0 }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.lbl { font: 600 11px/14px var(--sans); letter-spacing: .08em; color: var(--muted) }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }

#app { position: relative; height: 100%; overflow: hidden }
#board { position: absolute; inset: 0; background-color: var(--board); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; transition: background-color .6s var(--ease); touch-action: none; cursor: grab }
#board:active { cursor: grabbing }
#board.lit { background-color: var(--board-lit) }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
#halos, #labels, #nodes { position: absolute; left: 0; top: 0 }
#wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none }

/* field discs: show only under the cursor */
.cdisc { position: absolute; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--ch) 10%, rgba(255,255,255,.55)) 0, color-mix(in srgb, var(--ch) 6%, rgba(255,255,255,.25)) 60%, rgba(255,255,255,0) 72%); opacity: 0; transform: scale(.94); transition: opacity .5s var(--ease), transform .7s var(--ease); pointer-events: none }
.cdisc.on { opacity: 1; transform: scale(1) }
#glow { position: absolute; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,253,244,.85) 0, rgba(255,251,238,.35) 35%, rgba(255,250,235,0) 68%); pointer-events: none; opacity: 0; transition: opacity .5s var(--ease); will-change: transform }
#glow.on { opacity: 1 }
#tip { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; display: grid; gap: 2px; padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1px solid rgba(255,255,255,.75); box-shadow: 0 8px 26px rgba(34,33,28,.14); opacity: 0; transition: opacity .2s var(--ease); max-width: 300px }
#tip.show { opacity: 1 }
#tip .tf { font: 600 13px/17px var(--sans); display: flex; align-items: center; gap: 7px }
#tip .tf::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ch) }
#tip .tb { font: 700 14px/18px var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
/* rdg memory: no permanent will-change on 530 plates (one GPU layer each, a common cause of tab crashes);
   only a plate that is being pulled, dragged or pushed gets its own layer while it moves */
.fx { width: 100%; height: 100%; }
.node.magnet .fx, .node.dragging .fx { will-change: transform }
.node.magnet { z-index: 60 }
.node.magnet .plate { box-shadow: 0 20px 48px rgba(34,33,28,.26) }
.node.magnet .bob { animation-play-state: paused }
#hcard { position: fixed; left: 0; top: 0; z-index: 45; width: 360px; max-width: calc(100vw - 24px); max-height: calc(100vh - 90px); overflow: hidden; pointer-events: none; padding: 16px 18px 14px; border-radius: 20px; background: rgba(255,255,255,.66); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,.8); box-shadow: 0 18px 50px rgba(34,33,28,.18), inset 0 1px 0 rgba(255,255,255,.8); opacity: 0; transition: opacity .22s var(--ease); display: grid; gap: 10px }
#hcard.show { opacity: 1 }
.hc-top { display: flex; align-items: center; gap: 10px; justify-content: space-between }
.hc-a { font: 600 13px/17px var(--sans) }
.hc-f { font: 500 11.5px/15px var(--sans); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.hc-f::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ch) }
.hc-t { font: 700 21px/1.12 var(--sans); text-wrap: balance }
.hc-i { margin: 0; font-size: 13px; line-height: 19px; color: var(--ink) }
.hc-sec { display: grid; gap: 6px }
.hc-chips { display: flex; flex-wrap: wrap; gap: 4px }
.hc-tag { font: 500 11.5px/16px var(--sans); padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.28); color: var(--ink) }
.hc-chips.thm .hc-tag { font-size: 11px; background: rgba(35,34,29,.05); border-color: transparent; color: #3b3932 }
.hc-tag.on { background: color-mix(in srgb, var(--done) 16%, white); border-color: color-mix(in srgb, var(--done) 45%, white) }
.hc-more { font: 500 11px/18px var(--mono); color: var(--muted); padding: 0 4px }
.hc-rel { display: grid; gap: 3px; padding: 4px 0 }
.hc-who { font: 600 12.5px/16px var(--sans); display: flex; align-items: center; gap: 6px }
.hc-who .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.hc-who .dot.s-done { background: var(--done) } .hc-who .dot.s-reading { background: var(--reading) }
.hc-why { font-size: 12px; line-height: 16px; color: var(--muted) }
.hc-tags { display: flex; flex-wrap: wrap; gap: 3px }
.hc-none { margin: 0; font-size: 12px; color: var(--muted) }
#detail .hc-chips .hc-tag { pointer-events: auto }

/* wires */
.wire line { stroke: var(--wire); stroke-width: 1.3; transition: stroke .2s, stroke-width .2s, opacity .3s }
.wire circle { fill: var(--wire); transition: fill .2s }
.wire.k1 line { stroke-dasharray: 5 5 }
.wire { opacity: .7; transition: opacity .3s var(--ease) }
#app.wires-quiet .wire { opacity: 0 }
/* rdg memory: ~1,300 quiet wires leave rendering altogether (opacity 0 still keeps them in it); lit wires show */
#app.wires-quiet .wire:not(.hot) { visibility: hidden }
.wire.hot { opacity: 1 !important }
.wire.hot line { stroke: var(--wire-hot); stroke-width: 2 }
.wire.hot circle { fill: var(--wire-hot) }
#world.focus .wire:not(.hot) { opacity: .06 }

/* halos */
.halo { position: absolute; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; background: radial-gradient(circle, rgba(255,251,236,.98) 0, rgba(255,250,232,.7) 32%, rgba(255,250,232,0) 68%); pointer-events: none; animation: halo-in .7s var(--ease) both }
@keyframes halo-in { from { opacity: 0; transform: scale(.6) } }

/* nodes */
.node { position: absolute; left: 0; top: 0; touch-action: none; cursor: grab; transition: opacity .35s var(--ease), filter .35s var(--ease) }
.node.dragging { cursor: grabbing; z-index: 50 }
.node .pop { width: 100%; height: 100% }
.node.enter .pop { animation: pop .7s cubic-bezier(.2,.9,.3,1.25) both; animation-delay: var(--d, 0ms) }
@keyframes pop { from { opacity: 0; transform: scale(.4) translateY(30px) } }
.bob { width: 100%; height: 100%; animation: bob var(--bt, 7s) ease-in-out infinite; animation-delay: var(--bd, 0s) }
@keyframes bob { 0%, 100% { transform: translateY(-3px) rotate(-.5deg) } 50% { transform: translateY(3px) rotate(.5deg) } }
.node.dragging .bob, .node:hover .bob { animation-play-state: paused }
/* rdg perf: 530 breathing plates under glass cost every frame. They hold still where the motion cannot be seen
   (zoomed out, off screen) or when the OS asks (Breathing off, another app in front), as Atlas's own big icon views do. */
#world.still .bob, .node.offscreen .bob { animation: none }
.plate { position: relative; width: 100%; height: 100%; background: var(--plate); border: 3px solid var(--plate); border-radius: var(--r-m); padding: 5px; box-shadow: var(--shadow); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .35s var(--ease) }
.node:hover .plate { transform: translateY(-3px) scale(1.035); box-shadow: var(--shadow-lift) }
.node.dragging .plate { transform: scale(1.08) rotate(-2deg); box-shadow: 0 24px 48px rgba(34,33,28,.28) }
.node.s-todo .plate { border-color: var(--todo) }
.node.s-reading .plate { border-color: var(--reading) }
.node.s-done .plate { border-color: var(--done) }
#world.focus .node:not(.hot) { opacity: .14; filter: grayscale(.7) }
#world.focus .cdisc { opacity: 0 }
.node.hidden { display: none }

.cover { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 8px; background-color: var(--cc); background-image: linear-gradient(115deg, rgba(255,255,255,.16), rgba(255,255,255,0) 38%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.18)); box-shadow: inset 5px 0 0 rgba(0,0,0,.16), inset 6px 0 0 rgba(255,255,255,.10); color: #fffdf6; display: flex; flex-direction: column; padding: 10px 8px 8px 12px; gap: 5px }
.cover::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none }
.cover.p0::before { background: repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 1px, transparent 1px 9px) }
.cover.p1::before { background: radial-gradient(circle at 85% 88%, transparent 0 18px, rgba(255,255,255,.12) 18px 19px, transparent 19px 30px, rgba(255,255,255,.1) 30px 31px, transparent 31px 44px, rgba(255,255,255,.08) 44px 45px, transparent 45px) }
.cover.p2::before { background: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0/12px 12px, linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px) 0 0/12px 12px }
.cover.p3::before { background: repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 7px); mask: linear-gradient(transparent 55%, #000 56%); -webkit-mask: linear-gradient(transparent 55%, #000 56%) }
.cover.p4::before { background: radial-gradient(circle at 78% 72%, rgba(255,255,255,.16) 0 26px, transparent 27px), radial-gradient(circle at 78% 72%, transparent 0 34px, rgba(255,255,255,.1) 35px 36px, transparent 37px) }
.cover.p5::before { background: conic-gradient(from 210deg at 70% 100%, rgba(255,255,255,.13) 0 28deg, transparent 28deg 56deg, rgba(255,255,255,.08) 56deg 84deg, transparent 84deg) }
.cover.img { padding: 0; background-image: none; background-color: var(--cc); box-shadow: none }
.cover.img::before { display: none }
.cover.img img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; user-select: none; -webkit-user-drag: none }
.cover.img::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(0,0,0,.18) 0, rgba(0,0,0,0) 5px, rgba(255,255,255,.12) 6px, rgba(255,255,255,0) 9px), linear-gradient(115deg, rgba(255,255,255,.14), rgba(255,255,255,0) 35%); pointer-events: none }
.cover.img .cm { z-index: 1; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35) }
.plate::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 1px; height: 2.5px; border-radius: 3px; background: var(--ch, transparent); opacity: .85 }
.cover .rule { height: 1px; width: 22px; background: rgba(255,253,246,.55) }
.cover > * { position: relative }
.cover .cn { font: 500 8px/10px var(--mono); letter-spacing: .08em; opacity: .75 }
.cover .ct { font: 700 13.5px/1.06 var(--sans); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance }
.cover .ca { margin-top: auto; font: 600 7.5px/9px var(--sans); letter-spacing: .05em; text-transform: uppercase; opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.cover .cm { position: absolute; right: 7px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #fffdf6; opacity: .9 }
.node.fill .cover { padding: 8px 6px 6px 10px }
.node.fill .cover .ct { font-size: 10.5px; -webkit-line-clamp: 4 }
.node.fill .cover .ca { font-size: 6.5px; line-height: 8px }
.slip { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 2px; padding: 3px 4px; background: repeating-linear-gradient(transparent 0 11px, #eceae3 11px 12px) }
.slip .sk { font: 500 7px/9px var(--mono); letter-spacing: .1em; color: var(--wine) }
.slip .sw { font: 600 9px/11px var(--sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.slip .sy { font: 700 10px/11px var(--sans); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }

.tags { position: absolute; left: 50%; top: calc(100% + 7px); transform: translateX(-50%); display: flex; gap: 4px; white-space: nowrap; pointer-events: none }
.tag { font: 600 10px/14px var(--sans); letter-spacing: .04em; padding: 1px 7px; border-radius: 999px }
.tag.t-todo { background: var(--todo-chip); color: var(--todo-ink) }
.tag.t-reading { background: var(--reading); color: var(--reading-ink) }
.tag.t-done { background: var(--done-chip); color: var(--done-ink) }
.tag.fresh { animation: tag-pop .5s cubic-bezier(.2,.9,.3,1.4) both }
@keyframes tag-pop { from { transform: scale(.2); opacity: 0 } }

/* floating UI */
.ui { position: absolute; z-index: 20 }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-line); border-radius: var(--r-l); box-shadow: 0 10px 34px rgba(34,33,28,.14), inset 0 1px 0 rgba(255,255,255,.75) }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(255,255,255,.94) } }
#top { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; justify-content: flex-end; pointer-events: none }
#top > * { pointer-events: auto }
.tools { display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 16px; flex-wrap: wrap; justify-content: flex-end }
.tools input { width: 220px; max-width: 46vw; font: 13px/18px var(--sans); color: var(--ink); background: var(--well); border: 1px solid rgba(138,132,116,.45); border-radius: var(--r-s); padding: 7px 12px; background: rgba(255,255,255,.6) }
.tools input::placeholder { color: var(--muted) }
.tbtn { font: 500 13px/18px var(--sans); padding: 7px 11px; border-radius: var(--r-s); border: 1px solid transparent; white-space: nowrap }
.tbtn:hover { background: rgba(255,255,255,.7) }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--plate) }
.tbtn .c { font: 500 11px/1 var(--mono); opacity: .7; margin-left: 4px }

#dock { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: 330px; max-width: calc(100% - 24px); max-height: calc(100% - 96px); display: flex; flex-direction: column; overflow: hidden; transition: border-radius .3s var(--ease) }
#dock.collapsed { width: auto; border-radius: 999px }
#dockPill { display: none; align-items: center; justify-content: center; gap: 6px; min-width: 48px; height: 48px; padding: 0 14px; border-radius: 999px; color: var(--ink); transition: transform .25s cubic-bezier(.2,.9,.3,1.4) }
#dockPill:hover { transform: scale(1.08) }
.ibtns { display: flex; gap: 2px }
.ibtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); transition: background .15s, color .15s, transform .3s var(--ease) }
.ibtn:hover { background: rgba(255,255,255,.75); color: var(--ink) }
#recMore:active svg { transform: rotate(-200deg); transition: transform .4s var(--ease) }
.star { display: grid; place-items: center; width: 26px; height: 26px; color: var(--ink) }
#dockPill .dot-unused { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--plate); font-size: 11px }
#dockPill .n { font: 500 11px/1 var(--mono); color: var(--muted) }
#dock.collapsed #dockPill { display: inline-flex }
#dock.collapsed .dock-body { display: none }
.dock-body { display: flex; flex-direction: column; min-height: 0 }
body.dragging #dock.collapsed { border-radius: var(--r-l); width: 330px }
body.dragging #dock.collapsed .dock-body { display: flex }
body.dragging #dock.collapsed #dockPill, body.dragging #dock.collapsed .rec-part { display: none }
.dock-in { overflow: auto; padding: 0 0 8px; flex: 1 1 auto; min-height: 0 }
.dock-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; gap: 8px }
.dock-h .lbl { color: var(--ink) }
.qbtn { font: 500 12px/16px var(--sans); color: var(--muted); padding: 4px 8px; border-radius: 8px }
.qbtn:hover { color: var(--ink); background: rgba(255,255,255,.7) }
.rec { list-style: none; margin: 0; padding: 0 8px }
.rec li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px; border-radius: 12px; cursor: pointer; animation: rise .5s var(--ease) both }
.rec li:nth-child(2) { animation-delay: 60ms } .rec li:nth-child(3) { animation-delay: 120ms }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } }
.rec li:hover { background: rgba(255,255,255,.7) }
.mini { width: 30px; height: 42px; border-radius: 5px; background: var(--cc) center/cover no-repeat; box-shadow: 0 0 0 2px var(--plate), 0 0 0 3px var(--line); position: relative; flex: none }
.mini.core::after { content: ""; position: absolute; right: 4px; top: 4px; width: 4px; height: 4px; border-radius: 50%; background: #fffdf6 }
.mini.paper { background: var(--plate); box-shadow: 0 0 0 1px var(--line-strong); height: 22px; margin-block: 10px }
.rec .t { font: 700 15px/1.15 var(--sans); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rec .why { font-size: 12px; line-height: 16px; color: var(--muted); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s var(--ease), opacity .25s var(--ease), margin .35s var(--ease) }
.rec li:hover .why, .rec li:focus-visible .why { max-height: 34px; opacity: 1; margin-top: 3px }
.rec .rt { min-width: 0; display: grid }
.rec .mini { width: 36px; height: 51px }
.rec .f { font: 500 11px/14px var(--sans); color: var(--muted); margin-left: 7px; display: inline-flex; align-items: center; gap: 4px }
.rec .f::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ch) }
.rec .a { font-weight: 600; font-size: 12px }

#spotWell { margin: 2px 14px 10px; min-height: 96px; border: 1.5px dashed var(--line-strong); border-radius: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px; background: rgba(255,255,255,.45); transition: background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease); position: relative; overflow: hidden }
#spotWell::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle, rgba(255,250,228,.95), transparent 55%); opacity: 0; transition: opacity .3s var(--ease); pointer-events: none }
#spotWell.has::before, #spotWell.over::before { opacity: 1 }
#spotWell.over { border-color: var(--ink); transform: scale(1.02) }
#spotWell .ph { position: relative; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 17px; max-width: 220px }
#spotWell .ph b { display: block; font: 700 17px/1.2 var(--sans); color: var(--ink); margin-bottom: 2px; font-weight: 400 }
.schip { position: relative; display: grid; justify-items: center; gap: 4px; animation: tag-pop .45s cubic-bezier(.2,.9,.3,1.3) both }
.schip .mini { width: 40px; height: 56px }
.schip .mini.paper { height: 30px; margin: 13px 0 }
.schip .x { position: absolute; right: -8px; top: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--plate); font: 600 11px/18px var(--sans) }
.schip .n { font: 600 10.5px/12px var(--sans); max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#spotOut { padding: 6px 14px 10px; font-size: 13px; line-height: 19px }
#spotOut:empty { display: none }
.so-sec { margin-top: 8px }
.so-sec:first-child { margin-top: 0 }
.so-sec > .lbl { display: block; margin-bottom: 4px }
.rel { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; padding: 3px 0; cursor: pointer }
.rel:hover .b { text-decoration: underline }
.rel .ic { color: var(--muted); font-family: var(--mono); font-size: 12px }
.rel .b { font: 700 14px/1.2 var(--sans) }
.rel .tp { color: var(--muted); font-size: 12px }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.path .b { font: 700 14px/1.2 var(--sans); cursor: pointer }
.path .ar { font-size: 11.5px; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { font: 500 11px/15px var(--mono); padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink) }

#trayzone { position: absolute; left: 0; top: 0 }
.tray { position: absolute; border-radius: 50%; border: 0; padding: 0; cursor: pointer; --fill: 0; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) calc(30% + var(--fill) * 25%), transparent) 0, color-mix(in srgb, var(--c) calc(18% + var(--fill) * 20%), transparent) 55%, color-mix(in srgb, var(--c) 0%, transparent) 72%); transition: transform .45s cubic-bezier(.2,.9,.3,1.25), filter .3s var(--ease) }
.tray:hover { transform: scale(1.04) }
.tray.over, .tray[aria-pressed="true"] { transform: scale(1.12); filter: saturate(1.6) brightness(1.02) }
.tray.bump { animation: bump .55s cubic-bezier(.2,.9,.3,1.5) }
@keyframes bump { 40% { transform: scale(1.18) } }
#world.focus .tray:not([aria-pressed="true"]) { opacity: .45 }
.tray[data-s="todo"] { --c: var(--todo) }
.tray[data-s="reading"] { --c: var(--reading) }
.tray[data-s="done"] { --c: var(--done) }

#zoomctl { right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: grid; padding: 5px; border-radius: 18px; transition: right .4s var(--ease) }
@media (min-width: 761px) { #app.detail-open #zoomctl { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 404px) } }
#zoomctl button { width: 34px; height: 32px; font: 500 15px/1 var(--sans); border-radius: 12px; color: var(--ink) }
#zoomctl button:hover { background: rgba(255,255,255,.75) }
#zoomctl hr { border: 0; border-top: 1px solid var(--line); margin: 2px 4px }

/* detail */
#detail { top: 70px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 392px; max-width: calc(100% - 24px); display: flex; flex-direction: column; overflow: hidden; transform: translateX(0); transition: transform .4s var(--ease), opacity .3s var(--ease) }
#detail.wide { width: min(720px, calc(100% - 24px)) }
@media (min-width: 761px) { #app.detail-open.detail-wide #zoomctl { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 732px) } }
#detail .d-wide { right: 46px }
#detail .d-close { background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px) }
mjx-assistive-mml { display: none !important }
.sec-h { display: flex; align-items: center; gap: 8px }
.sec-h .lbl { margin-right: auto }
.note-st { font: 500 11px/14px var(--mono); color: var(--muted) }
.note-host { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8) }
#noteTa { width: 100%; min-height: 180px; resize: vertical; font: 12.5px/1.6 var(--mono); color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.45); border-radius: 12px; padding: 10px 12px }
.tag-in { width: 100%; font: 13px/18px var(--sans); color: var(--ink); background: rgba(255,255,255,.6); border: 1px solid rgba(138,132,116,.45); border-radius: 10px; padding: 7px 11px }
.hc-tag.mine { background: color-mix(in srgb, var(--olive) 14%, white); border-color: color-mix(in srgb, var(--olive) 45%, white); display: inline-flex; align-items: center; gap: 4px }
.hc-tag.mine .x { width: 15px; height: 15px; border-radius: 50%; font: 600 11px/15px var(--sans); color: var(--muted) }
.hc-tag.mine .x:hover { background: rgba(35,34,29,.1); color: var(--ink) }
.chat { display: grid; gap: 8px }
.chat:empty { display: none }
.cq { justify-self: end; max-width: 88%; background: var(--ink); color: var(--plate); padding: 7px 12px; border-radius: 16px 16px 4px 16px; font-size: 13.5px; line-height: 19px; white-space: pre-wrap; overflow-wrap: anywhere }
.ca { justify-self: start; max-width: 100%; background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.8); padding: 9px 13px; border-radius: 16px 16px 16px 4px }
.ca.wait { color: var(--muted); font-size: 13px }
.rich { font-size: 13.5px; line-height: 1.62; overflow-wrap: anywhere; min-width: 0 }
.rich > :first-child { margin-top: 0 } .rich > :last-child { margin-bottom: 0 }
.rich p { margin: .5em 0 } .rich ul, .rich ol { margin: .4em 0; padding-left: 1.3em }
.rich h1, .rich h2, .rich h3 { font: 700 18px/1.2 var(--sans); margin: .8em 0 .3em }
.rich code { font: 12px var(--mono); background: rgba(35,34,29,.06); padding: 1px 5px; border-radius: 5px }
.rich pre { background: rgba(35,34,29,.06); padding: 9px 11px; border-radius: 10px; overflow: auto }
.rich pre code { background: none; padding: 0 }
.rich table { border-collapse: collapse; display: block; overflow: auto } .rich th, .rich td { border: 1px solid rgba(35,34,29,.15); padding: 3px 7px }
.rich blockquote { margin: .5em 0; padding: 1px 10px; border-left: 3px solid rgba(98,108,85,.5); color: var(--muted) }
.rich mjx-container[display="true"] { display: block; margin: .6em 0; overflow-x: auto; overflow-y: hidden }
.rich .raw { font: 12px var(--mono); color: var(--muted) }
.ask { position: relative; display: flex; align-items: flex-end; gap: 6px; background: rgba(255,255,255,.7); border: 1px solid rgba(138,132,116,.45); border-radius: 18px; padding: 5px 5px 5px 13px }
.ask:focus-within { border-color: var(--ink) }
.ask textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font: 13.5px/20px var(--sans); color: var(--ink); padding: 5px 0; max-height: 180px }
.ask .send { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--plate) }
.ask .send:hover { transform: scale(1.06) }
#detail.closed { transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none }
#detail .scroll { overflow: auto; padding: 18px 20px 24px; display: grid; gap: 18px; align-content: start; grid-auto-rows: max-content }
.d-head { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: start }
.d-cover { width: 112px; height: 158px; padding: 4px; background: var(--plate); border: 3px solid var(--plate); border-radius: 16px; box-shadow: var(--shadow-lift) }
.d-cover.s-todo { border-color: var(--todo) } .d-cover.s-reading { border-color: var(--reading) } .d-cover.s-done { border-color: var(--done) }
.d-cover .cover .ct { font-size: 15px }
.d-cover .cover .ca { font-size: 8px; line-height: 10px }
.d-cover.paper { height: 80px }
.d-meta { display: grid; gap: 6px; min-width: 0 }
.d-meta .a { font: 600 13px/17px var(--sans) }
.d-meta h2 { margin: 0; font: 700 24px/1.1 var(--sans); text-wrap: balance; overflow-wrap: anywhere }
.d-meta .w { font-size: 12px; line-height: 16px; color: var(--muted); overflow-wrap: anywhere }
.d-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; font: 400 20px/30px var(--sans); color: var(--muted); z-index: 2 }
.d-close:hover { background: rgba(255,255,255,.75); color: var(--ink) }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid rgba(138,132,116,.5); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.45) }
.seg button { padding: 8px 4px; font: 500 13px/16px var(--sans); border-left: 1px solid var(--line-strong) }
.seg button:first-child { border-left: 0 }
.seg button:hover { background: rgba(255,255,255,.75) }
.seg button[aria-pressed="true"][data-s="todo"] { background: var(--todo-chip); color: var(--todo-ink) }
.seg button[aria-pressed="true"][data-s="reading"] { background: var(--reading); color: var(--reading-ink) }
.seg button[aria-pressed="true"][data-s="done"] { background: var(--done-chip); color: var(--done-ink) }
.seg button[aria-pressed="true"][data-s=""] { background: var(--well) }
.seg button:disabled { cursor: default; opacity: .5 }
.d-sec { display: grid; gap: 6px }
.d-sec p { margin: 0; max-width: 62ch }
.intro { font-size: 14.5px; line-height: 23px; white-space: pre-wrap }
.intro.wait { color: var(--muted) }
.intro-note { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; align-items: center }
.owns { font-size: 14px; line-height: 21px }
.skipt { font-size: 13px; line-height: 19px; color: var(--muted) }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px }
.d-tags .tag { font-size: 11px; line-height: 16px; padding: 1px 8px }
.tag.t-ch { background: rgba(255,255,255,.6); color: var(--ink); border: 1px solid var(--line) }
.tag.t-tier { background: var(--ink); color: var(--plate) }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap }
.pbtn { font: 500 13px/18px var(--sans); padding: 8px 14px; border: 1px solid rgba(138,132,116,.5); border-radius: 12px; background: rgba(255,255,255,.5) }
.pbtn:hover { background: rgba(255,255,255,.85) }

/* about */
#about { inset: 0; display: grid; place-items: center; background: rgba(35,34,29,.28); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
#about[hidden] { display: none }
#about .glass { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative }
#about .hd { padding: 18px 22px 0; display: grid; gap: 10px }
#about h2 { margin: 0; font: 700 32px/1 var(--sans) }
#about .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line) }
#about .tabs button { padding: 8px 10px; font: 500 13px/16px var(--sans); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px }
#about .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink) }
#about .bd { overflow: auto; padding: 16px 22px 24px; font-size: 14px; line-height: 21px }
#about ul { margin: 0; padding-left: 18px; display: grid; gap: 8px }
#about p { max-width: 68ch }
.tw { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 18px }
th { text-align: left; font: 600 11px/14px var(--sans); letter-spacing: .08em; color: var(--muted); padding: 8px 10px 6px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top }
td.code { font-family: var(--mono); color: var(--wine); white-space: nowrap }
.legend { display: grid; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line) }
.legend div { display: flex; gap: 10px; align-items: center }
.legend svg { flex: none }

#toast { left: 50%; bottom: 76px; transform: translate(-50%, 12px); background: rgba(35,34,29,.78); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--plate); font: 500 13px/18px var(--sans); padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis }
#toast.show { opacity: 1; transform: translate(-50%, 0) }

@media (max-width: 760px) {
  #top { gap: 6px }
  .tools { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap }
  .tools input { width: auto; flex: 1 1 60px; min-width: 0; max-width: none }
  .tbtn { padding: 6px 7px }
  .tools .wide { display: none }
  #zoomctl { bottom: auto; top: 70px }
  #detail { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: 8px; width: auto; max-width: none; height: 76% }
  #detail.closed { transform: translateY(calc(100% + 40px)) }
  .d-head { grid-template-columns: 88px minmax(0, 1fr) }
  .d-cover { width: 88px; height: 124px }
}
@media (prefers-reduced-motion: reduce) {
  .bob, .node.enter .pop, .tag.fresh, .halo, .rec li, .schip, .tray .mini, .tray.bump { animation: none !important }
  * { transition-duration: 0s !important }
}
/* Reading OS: its own Reduce motion (Control Center, System Settings) holds here too */
html.os-reduce :is(.bob, .node.enter .pop, .tag.fresh, .halo, .rec li, .schip, .tray .mini, .tray.bump) { animation: none !important }
html.os-reduce * { transition-duration: 0s !important }

/* ---------- Swiss typographic layer ---------- */
body { font-feature-settings: "tnum" 0, "ss01" 1; letter-spacing: -0.003em }
.lbl { font: 700 10.5px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink) }
.d-sec { border-top: 1.5px solid var(--ink); padding-top: 9px; gap: 8px }
.hc-sec { border-top: 1px solid var(--ink); padding-top: 7px }
.d-meta { gap: 4px }
.d-meta .a, .hc-a { font: 700 10.5px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase }
.d-meta h2 { font: 700 28px/1.02 var(--sans); letter-spacing: -0.025em; text-wrap: pretty }
.d-meta .w { font-size: 12px; color: var(--muted) }
.hc-t { font: 700 23px/1.02 var(--sans); letter-spacing: -0.025em }
.hc-i { font-size: 13px; line-height: 18px }
#about h2 { font: 700 40px/1 var(--sans); letter-spacing: -0.03em }
.rec .a { font: 700 10.5px/14px var(--sans); letter-spacing: .1em; text-transform: uppercase }
.rec .t { font: 700 15px/1.12 var(--sans); letter-spacing: -0.015em; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.rel .b, .path .b { font: 600 13.5px/1.2 var(--sans) }
#tip .tb { font: 600 13px/17px var(--sans); color: var(--ink) }
#tip .tf { font: 700 10.5px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase }
.hc-f { font: 700 10px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase }
.cover .ct { font: 800 13px/1.0 var(--sans); letter-spacing: -0.02em; -webkit-line-clamp: 6 }
.node.fill .cover .ct { font-size: 10.5px }
.cover .ca { font: 700 6.5px/8px var(--sans); letter-spacing: .14em }
.d-cover .cover .ct { font-size: 15px }
.slip .sw { font: 700 9px/11px var(--sans); letter-spacing: .02em }
.slip .sy { font: 500 9.5px/11px var(--sans); color: var(--muted) }
.star, #dockPill svg { color: var(--ink) }
.cq { background: var(--ink) }
.tag { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 9.5px }
.tag.t-ch { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 11px }
.hc-tag { font-weight: 500 }
.seg button { font-weight: 600; letter-spacing: .01em }
.intro { font-size: 14px; line-height: 21px }
.owns { font-size: 14px; line-height: 20px }
.rec .a { display: block }
.rec .f { display: flex; margin: 3px 0 0; text-transform: none; letter-spacing: 0; font: 500 11px/14px var(--sans); color: var(--muted) }
.rec .rt { gap: 1px }
.intro-note { justify-content: space-between }
.intro-note .qbtn { white-space: nowrap; flex: none }

#world.dwell .node:not(.magnet) { opacity: .16; filter: saturate(.3) }
#world.dwell .wire { opacity: .05 }
#world.dwell .tray, #world.dwell .tbox, #world.dwell #ink { opacity: .25 }
.node, .tray { transition: opacity .45s var(--ease), filter .45s var(--ease) }
.grav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 0 2px }
.grav input { flex: 1 1 200px; max-width: 320px; accent-color: var(--ink) }
.grav output { font: 600 13px/16px var(--mono); min-width: 52px }
.grav-h { font-size: 12px; color: var(--muted) }

.d-mine { display: contents }
.tag.t-mine { display: inline-flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--swiss) 9%, white); color: var(--ink); border: 1px solid color-mix(in srgb, var(--swiss) 35%, white); text-transform: none; letter-spacing: 0; font: 600 11px/16px var(--sans); padding: 1px 4px 1px 8px }
.tag.t-mine .term { font: inherit; color: inherit }
.tag.t-mine .term:hover { text-decoration: underline }
.tag.t-mine .x { width: 16px; height: 16px; border-radius: 50%; font: 600 11px/16px var(--sans); color: var(--muted) }
.tag.t-mine .x:hover { background: rgba(35,34,29,.1); color: var(--ink) }
.tag.t-note { display: inline-flex; align-items: center; gap: 5px; background: var(--ink); color: var(--plate); text-transform: none; letter-spacing: 0; font: 600 11px/16px var(--sans); padding: 1px 9px }
.tag.t-note.open { background: var(--swiss) }
.note-view { display: grid; gap: 8px; margin-top: -6px }
.nv-bar { display: flex; gap: 6px; justify-content: flex-end }
#noteTa { width: 100%; min-height: 160px; resize: vertical; font: 12.5px/1.6 var(--mono); color: var(--ink); background: rgba(255,255,255,.75); border: 1px solid rgba(138,132,116,.45); border-radius: 12px; padding: 10px 12px }
.modes { display: flex; gap: 4px }
.modes button { font: 700 10.5px/14px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; color: var(--muted); border: 1px solid transparent }
.modes button:hover { color: var(--ink) }
.modes button[aria-pressed="true"] { color: var(--plate); background: var(--ink) }
button.hc-tag.term { cursor: pointer; text-align: left; font: inherit; font-size: 11.5px; line-height: 16px; padding: 2px 8px; transition: background .15s, border-color .15s, color .15s }
.hc-chips.thm button.hc-tag.term { font-size: 11px }
button.hc-tag.term:hover { background: var(--ink); color: var(--plate); border-color: var(--ink) }
.cq.ex { background: var(--swiss) }

#tools { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 16px }
.tool { width: 34px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--ink) }
.tool:hover { background: rgba(255,255,255,.75) }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--plate) }
#tools .sep { width: 1px; height: 20px; background: rgba(35,34,29,.15); margin: 0 5px }
.swatch { width: 20px; height: 20px; margin: 0 3px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.85) }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--plate), 0 0 0 3.5px var(--c) }
#ink { position: absolute; left: 0; top: 0; z-index: 25; width: 1px; height: 1px; overflow: visible; pointer-events: none }
#boxes { position: absolute; left: 0; top: 0; z-index: 30 }
.tbox { position: absolute; transform-origin: 0 0; min-height: 46px; background: rgba(255,255,255,.94); border: 1.5px solid var(--c); border-radius: 14px; padding: 11px 14px 12px; box-shadow: var(--shadow); cursor: grab; font-size: 14px; color: var(--ink) }
.tbox:active { cursor: grabbing }
.tb-bar { position: absolute; top: -13px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: opacity .15s }
.tbox:hover .tb-bar, .tbox.editing .tb-bar { opacity: 1 }
.tb-bar button { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--plate); font: 600 13px/26px var(--sans); box-shadow: var(--shadow) }
.tb-bar button[data-tb="ask"] { background: var(--swiss) }
.tb-edit { display: block; width: 100%; min-height: 70px; border: 0; outline: 0; resize: none; background: transparent; font: 13px/1.55 var(--mono); color: var(--ink) }
.tbox.editing { cursor: text }
.tbox.editing .tb-view { display: none }
.tb-ph { color: var(--muted); font-size: 13px }
#app[data-tool="pen"] #board, #app[data-tool="arrow"] #board { cursor: crosshair }
#app[data-tool="text"] #board { cursor: text }
#app[data-tool="erase"] #board { cursor: cell }
#app:not([data-tool="select"]) .node, #app:not([data-tool="select"]) .tray { cursor: inherit }
@media (max-width: 760px) { #tools { top: auto; bottom: 72px } }

.wire.k2 line { stroke-dasharray: 1 6; stroke-linecap: round; stroke-width: 2 }
#spotWell { cursor: text }
#spotWell .schip { cursor: default }
.spot-in { position: relative; flex: 1 1 100%; min-width: 0; height: 22px; padding: 0; font: 600 15px/22px var(--sans); color: var(--ink); background: transparent; border: 0; outline: 0; text-align: center; caret-color: var(--ink) }
#spotWell:not(:focus-within) .spot-in:placeholder-shown { position: absolute; opacity: 0; pointer-events: none; width: 1px }
#spotWell:focus-within { border-color: var(--ink) }
.sug { margin: 0 14px 8px; display: grid; gap: 2px; background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.9); border-radius: 14px; padding: 4px; box-shadow: var(--shadow) }
.sg { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 9px; padding: 5px 8px; border-radius: 10px; cursor: pointer }
.sg .mini { width: 24px; height: 34px }
.sg.sel, .sg:hover { background: rgba(35,34,29,.07) }
.sg-a { display: block; font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase }
.sg-n { display: block; font: 600 13px/16px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sg-t { font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); justify-self: center }
.schip.topic { display: flex; align-items: center; gap: 6px; background: var(--ink); color: var(--plate); padding: 6px 8px 6px 12px; border-radius: 999px }
.schip.topic .tq { font: 600 13px/16px var(--sans) }
.schip.topic .x { position: static; background: rgba(255,255,255,.2) }
.schip.job .n { color: var(--muted) }
.schip.job .mini { animation: pulse 1.1s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .35 } }

#aBody .m-lead { color: var(--muted); margin: 0 0 14px }
.m-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px }
.m-stats div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.6); border: 1px solid var(--line) }
.m-stats b { font: 700 26px/1 var(--sans); letter-spacing: -.02em }
.m-stats span { font-size: 11.5px; color: var(--muted); line-height: 15px }
.m-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
.m-sw { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; min-width: 0 }
.m-sw input { accent-color: var(--ink); width: 16px; height: 16px; flex: none }
.m-btns { display: flex; gap: 6px; flex-wrap: wrap }
.m-sec { display: grid; gap: 8px; margin-bottom: 18px; min-width: 0; align-content: start }
.m-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 22px }
.m-chips { display: flex; flex-wrap: wrap; gap: 6px }
.m-chips .tag { cursor: pointer; text-transform: none; letter-spacing: 0; font: 500 12.5px/16px var(--sans); padding: 4px 10px }
.m-sub { font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px }
.m-top { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 4px !important }
.m-top button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 10px; text-align: left }
.m-top button:hover { background: rgba(35,34,29,.06) }
.m-top .mini { width: 24px; height: 34px }
.m-nm { display: grid; gap: 1px; min-width: 0 }
.m-a { font: 700 10px/13px var(--sans); letter-spacing: .1em; text-transform: uppercase }
.m-ti { font: 600 13px/16px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.m-bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 3px }
.m-bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink) }
.m-c { font: 500 12px/1 var(--mono); color: var(--muted) }
.m-hist { list-style: none; margin: 0; padding: 0 !important; display: grid; gap: 0 !important }
.m-hist li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px }
.m-t { color: var(--muted); font: 500 11.5px/18px var(--mono); white-space: nowrap }
.m-v { font-weight: 700 }
.m-book { font: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; text-align: left; padding: 0 }
.m-empty { color: var(--muted); font-size: 13px }
.ag { display: grid; gap: 4px; margin-bottom: 16px }
.ag-h { font-size: 12.5px; color: var(--muted); line-height: 17px }
.ag textarea { width: 100%; resize: vertical; font: 13px/19px var(--mono); color: var(--ink); background: rgba(255,255,255,.75); border: 1px solid var(--line-strong); border-radius: 14px; padding: 10px 12px; outline: 0; margin-top: 4px }
.ag textarea:focus { border-color: var(--ink) }
.ag-f { display: flex; align-items: center; justify-content: flex-end; gap: 12px }

/* plan plates: a chapter that is only on the route. The white tray and field bar stay; the cover is an opaque empty slot (K4, K5) */
.cover.slot { background-color: var(--well); background-image: none; box-shadow: none; color: var(--muted) }
.cover.slot::before { inset: 4px; opacity: 1; background: none; border: 1.5px dashed var(--line-strong); border-radius: var(--r-xs) }
.cover.slot .ct { font-weight: 700 }
.cover.slot .ca { opacity: 1 }
.cover.slot .cm { background: var(--line-strong) }
.mini.slot { background: var(--well); outline: 1.5px dashed var(--line-strong); outline-offset: -5px }
.hc-plan, .d-plan { color: var(--muted); font-size: 12px; line-height: 16px }
.hc-plan { margin-top: -6px }
.d-plan { margin: -4px 0 0; font-size: 13px; line-height: 18px }
.tag.t-tier.t-plan { background: var(--well); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong) }
.rel-g { display: grid; gap: 0; margin-top: 6px }
.rel-g:first-of-type { margin-top: 0 }
.rel-g > .rg { font: 700 10px/14px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px }
.rel .tp { overflow-wrap: anywhere }

/* Today: the latest daily report, rereads that are due, notes in progress (PRD 5.2, 6.5, 7.3). No counts, no lateness (K1) */
.today li { grid-template-columns: 30px minmax(0, 1fr) auto; padding: 5px 6px }
.today .mini { width: 30px; height: 42px }
.today .t { font-size: 14px; -webkit-line-clamp: 1 }
.today li.seen .a, .today li.seen .t { color: var(--muted) }
.today li.seen .mini { filter: grayscale(.6) }
.today .ok { width: 26px; height: 26px; display: grid; place-items: center; color: var(--done) }
.today .rr { font: 600 11.5px/16px var(--sans); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.6); color: var(--ink); white-space: nowrap; transition: background .15s var(--ease), color .15s var(--ease), transform .2s var(--ease) }
.today .rr:hover, .today .rr:focus-visible { background: var(--ink); color: var(--plate); border-color: var(--ink) }
.today .rr:active { transform: scale(.96) }
.today li.none { display: block; cursor: default; padding: 2px 6px 6px; color: var(--muted); font-size: 12.5px; line-height: 17px; animation: none }
.today li.none:hover { background: none }
.rec-h { border-top: 1px solid var(--line); margin: 6px 14px 0; padding: 8px 0 4px }

/* Reading OS: shelf.html?os is the desktop layer of index.html. The OS menu bar (40 px) and Dock float over the board,
   so the floating UI moves in by --os-top and --os-bottom (the OS sets them); Today is its own app there */
html.os { --os-top: 40px; --os-bottom: 80px }
/* rdg readability: the map is for finding notes. The drawing tools leave it, field names stay, and a link leads home */
#tools { display: none !important }
#rdg-home { position: fixed; top: 16px; left: 16px; z-index: 40; padding: 9px 16px; border-radius: 999px; font: 600 14px/1 var(--sans); color: var(--ink); text-decoration: none }
#rdg-home:hover { background: rgba(255,255,255,.9) }
html.os #rdg-home { display: none }
.flabel { position: absolute; transform: translate(-50%, -100%); font: 700 calc(15px * var(--ik, 1))/1.25 var(--sans); color: var(--ink); white-space: nowrap; pointer-events: none; padding-bottom: calc(6px * var(--ik, 1)); text-shadow: 0 0 calc(6px * var(--ik, 1)) var(--board), 0 0 calc(2px * var(--ik, 1)) var(--board) }
.flabel::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--ch); margin-right: .4em; vertical-align: .08em }
#world.dwell .flabel, #world.focus .flabel { opacity: .35 }
html.os #top, html.os #tools { top: calc(var(--os-top) + 8px) }
html.os #dock, html.os #zoomctl { bottom: calc(var(--os-bottom) + 8px) }
html.os #dock { max-height: calc(100% - var(--os-top) - var(--os-bottom) - 80px) }
html.os #detail { top: calc(var(--os-top) + 64px); bottom: calc(var(--os-bottom) + 8px) }
/* the OS moved its windows aside (Show Desktop): their 40 px edges stay on screen, so the right-hand parts step in */
html.os.os-aside #detail { right: 52px; max-width: calc(100% - 64px) }
html.os.os-aside #top, html.os.os-aside #zoomctl { right: 52px }
html.os.os-aside #tools, html.os.os-aside #dock { left: 52px }
@media (min-width: 761px) {
  html.os.os-aside #app.detail-open #zoomctl { right: 456px }
  html.os.os-aside #app.detail-open.detail-wide #zoomctl { right: 784px }
}
html.os #hcard { max-height: calc(100vh - var(--os-top) - var(--os-bottom) - 40px) }
html.os #about { padding-top: calc(var(--os-top) + 12px); padding-bottom: calc(var(--os-bottom) + 12px) }
html.os #toast { bottom: calc(var(--os-bottom) + 64px) }
html.os .rec-h { border-top: 0; margin-top: 0 }
@media (max-width: 760px) {
  html.os #zoomctl { bottom: auto; top: calc(var(--os-top) + 58px) }
  html.os #tools { top: auto; bottom: calc(var(--os-bottom) + 60px) }
  html.os #detail { top: auto; bottom: calc(var(--os-bottom) + 8px); height: min(76%, calc(100% - var(--os-top) - var(--os-bottom) - 16px)) }
}
</style>

%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/01_Transformer%E6%A0%B8%E5%BF%83.html"},{"id":"n-f8b21081","ch":2,"tier":"core","author":"02","title":"非 Transformer 架構（狀態空間 Mamba、連續微分方程、KAN、JEPA、脈衝與超維計算）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"這個領域的架構不走「先把一切切成離散詞元，再做 O(N^2) 全域兩兩比對」這條路，改用連續時間動力系統（Neural ODE / SSM）、邊樣條函數逼近（KAN）、抽象潛空間預測（JEPA）與物理事件驅動／超維代數計算（SNN / Reservoir / HDC）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/02_%E9%9D%9ETransformer%E6%9E%B6%E6%A7%8B.html"},{"id":"n-f944d2d7","ch":2,"tier":"core","author":"10","title":"現代 AI 工具鏈（RAG／GraphRAG、擴散與流匹配生成、偏好對齊強化與自主工程智能體）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"工具鏈要做的事，是把只做過靜態預訓練的基座模型，變成可溯源、能做連續生成、守得住安全邊界、還能閉環行動的生產級系統。結構化記憶靠 GraphRAG 與圖最優傳輸對齊外掛，連續幾何生成靠薛丁格橋與直線流匹配（Flow Matching / Rectified Flow），真實世界的執行迴路則靠拉格朗日解耦偏好強化（Constrained G…","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/10_%E5%B7%A5%E5%85%B7%E9%8F%88.html"},{"id":"n-08577994","ch":2,"tier":"core","author":"17","title":"評估與資料（資料去重與配比最佳化、合成教科書、污染解剖與動態基準評測）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"如果把模型架構比成引擎，預訓練資料配比就是決定基礎模型能力邊界的數位 DNA，基準評測則是儀表板，少了它就只能在古德哈特定律的迷霧裡盲飛。這個領域做兩件事：用精確去重、教科書級高密度合成與線性域歸因配比提高擴展律的效率，並用動態抗污染基準、裁判元評估與黑盒污染／配比逆向解剖，確保量到的是真實能力。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/17_%E8%A9%95%E4%BC%B0%E8%88%87%E8%B3%87%E6%96%99.html"},{"id":"n-3bb63738","ch":2,"tier":"core","author":"18","title":"RL與多模態（策略梯度與離線強化學習、統一視覺語言模型、世界模型與具身 VLA）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"這個領域把看懂物理世界（多模態感知）和在世界中行動並承擔後果（序貫強化學習）合成一個閉環智能體。感知這一邊，把影像、壓縮視訊流與自然語言對齊成統一的自迴歸詞元。決策這一邊，用廣義優勢估計（GAE）、自我博弈搜尋與離線保守強化學習壓住高變異梯度與分布偏移。兩邊合起來，目標是能直接操控實體機器人的視覺語言動作模型（VLA）與物理世界模型。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/18_RL%E8%88%87%E5%A4%9A%E6%A8%A1%E6%85%8B.html"},{"id":"n-2205d16f","ch":2,"tier":"core","author":"19","title":"AI安全攻防（間接提示注入、自動化紅隊越獄、潛伏後門投毒與偏好對齊護欄）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"自然語言計算從一開始就有一個根本問題：控制流與資料流混同（Instruction-Data Confusion）。自然語言既是系統的最高指令，又是外部不可信的輸入。這個領域一方面研究攻擊能做到什麼程度，包括間接提示注入、推理模型自主越獄、跨智能體傳染、微調退化與潛伏欺騙特工（Sleeper Agents）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/19_AI%E5%AE%89%E5%85%A8%E6%94%BB%E9%98%B2.html"},{"id":"n-f9419ef9","ch":2,"tier":"core","author":"20","title":"硬體與系統（Roofline 與記憶體牆、3D 自動並行訓練、PagedAttention 與推論引擎）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"這個領域處理的是怎麼在物理矽晶片的熱力學極限內，搬運和排程千億參數的數學圖。峰值算力每兩年成長 3.0×，DRAM 與跨卡互連頻寬卻只成長 1.6×／1.4×。為了應付這道 AI 記憶體牆（Memory Wall），本領域用的工具有 Roofline 算術強度法則、算子內／算子間雙層自動並行編譯、作業系統虛擬分頁式的 KV 管理（Page…","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/20_%E7%A1%AC%E9%AB%94%E8%88%87%E7%B3%BB%E7%B5%B1.html"},{"id":"n-1edc210d","ch":2,"tier":"core","author":"42","title":"LNN 液態與邏輯神經網路（MIT 連續時間液態動力學 LTC/CfC/NCP × IBM 實值區間全向邏輯推理）","work":"領域分級精讀 / 基礎架構與系統工程","owns":"這個領域收的是當代 AI 裡兩支都簡稱 LNN 的學派。兩者著力的層面不同，但都不走龐大黑盒模型的路。一支是 MIT 從線蟲突觸得到啟發的液態神經網路（Liquid Neural Networks：LTC / CfC / NCP / Liquid-S4），神經元的記憶時間常數會像流體一樣隨輸入即時伸縮。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/A_%E5%9F%BA%E7%A4%8E%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B3%BB%E7%B5%B1%E5%B7%A5%E7%A8%8B/42_LNN%E6%B6%B2%E6%85%8B%E8%88%87%E9%82%8F%E8%BC%AF%E7%A5%9E%E7%B6%93%E7%B6%B2%E8%B7%AF.html"},{"id":"n-d8f24b84","ch":3,"tier":"core","author":"03","title":"數學結構化機器學習（幾何、層論、最優傳輸流與奇異學習理論）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"這個領域不把神經網路當成在平坦歐氏空間裡硬擬合曲線的黑盒。它把對稱群、層論黏合（Sheaf）、拓撲不變量、最優傳輸黎曼幾何、無窮維算子與代數幾何奇點直接寫進模型的假設空間與演化動力學。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/03_%E6%95%B8%E5%AD%B8%E7%B5%90%E6%A7%8B%E5%8C%96ML.html"},{"id":"n-88ae2043","ch":3,"tier":"core","author":"04","title":"表示對齊與類比推理（柏拉圖表示假說、跨空間最優配對與關係映射）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"這個領域研究兩件事：一是兩個智能系統的座標軸完全不同，甚至來自不同感官模態或不同學科體系，為什麼仍會收斂出同構的內部關係幾何；二是怎麼不靠人工平行標註，就完成跨空間無監督對齊、模型縫合與高階結構類比。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/04_%E8%A1%A8%E7%A4%BA%E5%B0%8D%E9%BD%8A%E8%88%87%E9%A1%9E%E6%AF%94.html"},{"id":"n-46dee7c3","ch":3,"tier":"core","author":"05","title":"形式化與推理（Lean 4 定理證明、強化學習長思維鏈、神經符號邏輯與複雜度邊界）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"這個領域用神經網路的直覺啟發式搜尋和強化學習自我博弈，去處理指數爆炸的推理搜尋空間，再用形式化證明助手（Lean 4）與可微實值邏輯（LNN / LTN）保證演繹的每一步都嚴格、沒有幻覺。這些都得在 P ≠ NP 劃下的計算極限之內進行。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/05_%E5%BD%A2%E5%BC%8F%E5%8C%96%E8%88%87%E6%8E%A8%E7%90%86.html"},{"id":"n-2a2f903e","ch":3,"tier":"core","author":"06","title":"學習動力學與可解釋性（雙重下降、頓悟相變、疊加態與稀疏自編碼器解剖學）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"這個領域一方面追蹤深度神經網路在訓練時間軸上的非線性相變（雙重下降與頓悟 Grokking），另一方面用稀疏自編碼器（SAE）與因果特徵電路，把擠在神經元疊加態裡的數百萬個人類概念逐一拆出來、定位並加以操控。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/06_%E5%AD%B8%E7%BF%92%E5%8B%95%E5%8A%9B%E5%AD%B8%E8%88%87%E5%8F%AF%E8%A7%A3%E9%87%8B%E6%80%A7.html"},{"id":"n-a7a688b9","ch":3,"tier":"core","author":"16","title":"機器學習數學地基（統計泛化界、PAC-Bayes、凸與非凸最佳化、高維機率與計算複雜度）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"這個領域為所有學習系統劃出三條數學邊界：有限樣本下需要多少資訊才能保證結論不是自欺（泛化理論），有限梯度步數下能多快找到好解（最佳化理論），以及最壞情況下哪些問題不可能被高效算出（計算複雜度與高維譜幾何）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/16_ML%E6%95%B8%E5%AD%B8%E5%9C%B0%E5%9F%BA.html"},{"id":"n-b1266622","ch":3,"tier":"core","author":"26","title":"概念空間幾何與認知拓撲（Gärdenfors 凸性、表徵幾何、線性表示假說與語意多胞形）","work":"領域分級精讀 / 學習理論、推理與表示幾何","owns":"在離散的邏輯符號和低階的神經脈衝之間，這個領域建立第三層描述語言，也就是幾何。它研究人類心智與大型神經網路如何把概念編碼成凸區域、雙曲階層、量子投影子空間、平行四邊形概念晶體，以及可操作的拓撲骨架。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/B_%E5%AD%B8%E7%BF%92%E7%90%86%E8%AB%96%E3%80%81%E6%8E%A8%E7%90%86%E8%88%87%E8%A1%A8%E7%A4%BA%E5%B9%BE%E4%BD%95/26_%E6%A6%82%E5%BF%B5%E7%A9%BA%E9%96%93%E5%B9%BE%E4%BD%95%E8%88%87%E8%AA%8D%E7%9F%A5%E6%8B%93%E6%92%B2.html"},{"id":"n-b3add3e6","ch":4,"tier":"core","author":"11","title":"高階範疇論（Higher Category Theory & Derived Geometry）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"兩個物件「以哪一種方式同構」（見證路徑、路徑之間的變形，乃至無窮階相容性），在數學裡到處出現，傳統集合論卻把它抹平。高階範疇論把這些資訊全部保留為一等公民，替現代幾何、拓撲與物理提供一套通用的組裝框架，不丟失高階對稱性與橫截相交資訊。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/11_%E9%AB%98%E9%9A%8E%E7%AF%84%E7%96%87%E8%AB%96.html"},{"id":"n-5023aa22","ch":4,"tier":"core","author":"12","title":"HoTT與類型論（Homotopy Type Theory & Univalent Foundations）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"同倫類型論（HoTT）把三樣東西合而為一：程式／資料型別、邏輯命題／證明、拓撲空間／連續路徑，影響遍及邏輯、計算機科學與幾何學。數學家日常的直覺是「同構的結構即可視為相等」，它透過單價公理（Univalence）給這個直覺一個嚴格、可由電腦驗算的基礎。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/12_HoTT%E8%88%87%E9%A1%9E%E5%9E%8B%E8%AB%96.html"},{"id":"n-9cd2625e","ch":4,"tier":"core","author":"13","title":"代數幾何與Hodge（Algebraic Geometry, Hodge Theory & Motives）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"代數幾何與 Hodge 理論研究的是，怎麼在離散的多項式代數、連續的複流形微積分和有限域上的算術數論這三個看似不相干的領域之間，建立像羅塞塔石碑那樣可以互相對照的翻譯。它的中心問題是：一個空間的拓撲洞（上同調類），在什麼條件下確實是由多項式方程定義出來的幾何子空間（代數閉鏈），而不只是分析上算出來的東西？","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/13_%E4%BB%A3%E6%95%B8%E5%B9%BE%E4%BD%95%E8%88%87Hodge.html"},{"id":"n-5f638e6a","ch":4,"tier":"core","author":"14","title":"代數拓撲（Algebraic Topology, Spectral Sequences & Chromatic Homotopy）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"代數拓撲把可以任意拉扯扭曲的連續幾何形狀，轉換成剛性的離散代數不變量，像是替形狀取指紋。到了現代的穩定與色層同倫論（Chromatic Homotopy Theory），人們還發現高維空間裡糾纏在一起的現象，可以像白光穿過三稜鏡那樣，按素數 p 與形式群高度 n 分解成一張有規律的「拓撲元素週期表」。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/14_%E4%BB%A3%E6%95%B8%E6%8B%93%E6%92%B2.html"},{"id":"n-f1762f98","ch":4,"tier":"core","author":"15","title":"應用範疇論（Applied Category Theory, Compositionality & Markov/Poly Systems）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"範疇論曾被調侃為「抽象廢話（Abstract Nonsense）」，應用範疇論把它變成一門研究各種系統如何互連、開放系統如何組合的學問（Science of Compositionality）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/15_%E6%87%89%E7%94%A8%E7%AF%84%E7%96%87%E8%AB%96.html"},{"id":"n-d7942c12","ch":4,"tier":"core","author":"30","title":"凝聚數學與合成微分幾何（Condensed Mathematics, Synthetic Differential Geometry & Tangent Categories）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"這個領域用兩條互補的路線重寫分析學與微積分的基礎。凝聚數學（Condensed Mathematics）用收斂序列這類探針上的層取代傳統的點集拓撲空間，讓無限維泛函分析與巴拿赫空間可以放進同調代數。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/30_%E5%87%9D%E8%81%9A%E6%95%B8%E5%AD%B8%E8%88%87%E5%90%88%E6%88%90%E5%BE%AE%E5%88%86%E5%B9%BE%E4%BD%95.html"},{"id":"n-beef8afd","ch":4,"tier":"core","author":"31","title":"認識邏輯與信念修正（Epistemic Logic, Dynamic Updates & AGM Belief Revision）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"認識邏輯與信念修正是一套形式微積分，刻畫兩件事：誰知道誰知道什麼（高階心智理論 Theory of Mind），以及新證據和舊世界觀衝突時，理性主體怎麼用最小的改動重組知識庫。多智能體社會推理、賽局共識，以及當代大型語言模型的知識編輯（Model Editing），都以它為公理基礎。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/31_%E8%AA%8D%E8%AD%98%E9%82%8F%E8%BC%AF%E8%88%87%E4%BF%A1%E5%BF%B5%E4%BF%AE%E6%AD%A3.html"},{"id":"n-3c0ae2e8","ch":4,"tier":"core","author":"38","title":"形式概念分析與格論（Formal Concept Analysis, Galois Connections & Lattice Embeddings）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"形式概念分析（FCA）與格論替人和機器的概念（Concept）給出一個零參數的代數定義。只要一張「物件 × 屬性」觀察表，加上一組互為對偶的 Galois 連接，就能把雜亂的經驗資料整理成外延與內涵嚴格對應的完備概念格（Concept Lattice）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/38_%E5%BD%A2%E5%BC%8F%E6%A6%82%E5%BF%B5%E5%88%86%E6%9E%90%E8%88%87%E6%A0%BC%E8%AB%96.html"},{"id":"n-f273415f","ch":4,"tier":"core","author":"39","title":"線性邏輯與博弈語意學（Linear Logic, Game Semantics, Geometry of Interaction & Differential Categories）","work":"領域分級精讀 / 純數學、範疇論與邏輯基礎","owns":"線性邏輯與博弈語意學把數理邏輯改寫成一套講資源、講互動的理論。Jean-Yves Girard 重新分析古典蘊含 A → B，把假設從可以免費無限影印的永恆真理，改成用一次就消耗掉的資源（A multimap B）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/C_%E7%B4%94%E6%95%B8%E5%AD%B8%E3%80%81%E7%AF%84%E7%96%87%E8%AB%96%E8%88%87%E9%82%8F%E8%BC%AF%E5%9F%BA%E7%A4%8E/39_%E7%B7%9A%E6%80%A7%E9%82%8F%E8%BC%AF%E8%88%87%E5%8D%9A%E5%BC%88%E8%AA%9E%E6%84%8F%E5%AD%B8.html"},{"id":"n-2758d705","ch":5,"tier":"core","author":"29","title":"演算法資訊理論與索羅門諾夫歸納（Algorithmic Information Theory & Solomonoff Induction）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"演算法資訊理論用「生成單一物件的最短電腦程式長度」來定義絕對的結構與隨機性。它把哲學上的奧卡姆剃刀寫成索羅門諾夫通用歸納先驗，並說明無損資料壓縮與序列泛化預測（如大語言模型）在數學上等價。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/29_%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A%E7%90%86%E8%AB%96%E8%88%87%E7%B4%A2%E7%BE%85%E9%96%80%E8%AB%BE%E5%A4%AB%E6%AD%B8%E7%B4%8D.html"},{"id":"n-06bb9b73","ch":5,"tier":"core","author":"33","title":"度量幾何與離散曲率（Metric Geometry & Discrete Curvature）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"度量幾何不需要光滑座標，也不需要二階微分。它只用兩點間的最短路徑距離，以及機率分佈沿最優傳輸搬運時鄰域的聚散或熵的凸性，就能在奇異流形、社交網路、知識圖譜乃至於非光滑時空上，重新建立嚴格的曲率（Curvature）與極限幾何。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/33_%E5%BA%A6%E9%87%8F%E5%B9%BE%E4%BD%95%E8%88%87%E9%9B%A2%E6%95%A3%E6%9B%B2%E7%8E%87.html"},{"id":"n-d458c7b5","ch":5,"tier":"core","author":"36","title":"貝氏逆問題與測度傳輸（Bayesian Inverse Problems & Measure Transport）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"從稀疏、含噪的觀測反推無窮維的隱藏物理場，是病態的不適定問題。貝氏逆問題把它改寫成函數空間上對先驗測度的平滑加權更新，測度傳輸則用確定性最優傳輸映射與交互作用粒子流，取代在高維失效的隨機漫步抽樣。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/36_%E8%B2%9D%E6%B0%8F%E9%80%86%E5%95%8F%E9%A1%8C%E8%88%87%E6%B8%AC%E5%BA%A6%E5%82%B3%E8%BC%B8.html"},{"id":"n-77312670","ch":5,"tier":"core","author":"37","title":"因果推論與反事實最優傳輸（Causal Inference & Counterfactual Optimal Transport）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"經典 Wasserstein 距離的耦合可以偷看未來，也不管因果箭頭的方向。因果與反事實最優傳輸在耦合多胞形中加入時間濾波的非預知約束與有向無環圖（DAG）結構，讓隨機控制估值、多維反事實世界的建構與公平性決策，都建立在遵守因果律的最小變形幾何上。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/37_%E5%9B%A0%E6%9E%9C%E6%8E%A8%E8%AB%96%E8%88%87%E5%8F%8D%E4%BA%8B%E5%AF%A6%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8.html"},{"id":"n-b3bdf481","ch":5,"tier":"core","author":"41","title":"最優傳輸與 P ≠ NP 計算複雜度（Optimal Transport & P ≠ NP Computational Complexity）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"最優傳輸不是一整塊多項式時間可解的問題，它正好落在 P 與 NP-Hard 的分界上。從雙邊線性傳輸往外踏出半步（二次互動、三邊際耦合或高維自由重心），問題就變得連近似都很難。反過來，驅動 Sinkhorn 的矩陣／算子縮放與自旋玻璃相變，也成了研究代數版 VPneqVNP 與平均情況演算法極限的主要工具。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/41_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E8%88%87P_neq_NP%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6.html"},{"id":"n-a2deec48","ch":5,"tier":"core","author":"OT","title":"最優傳輸與跨域平移（Optimal Transport & Cross-Domain Translation）","work":"領域分級精讀 / 最優傳輸、計算複雜度與演算法資訊","owns":"最優傳輸把比較兩個機率分佈、甚至對齊兩個沒有共同座標的異構概念空間，都轉成同一個問題：找出總變形與搬運代價最小的幾何耦合路徑。機率空間因此成為可微分、可插值、可以走梯度流的無窮維黎曼流形。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/D_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E3%80%81%E8%A8%88%E7%AE%97%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%BC%94%E7%AE%97%E6%B3%95%E8%B3%87%E8%A8%8A/OT_%E6%9C%80%E5%84%AA%E5%82%B3%E8%BC%B8%E8%88%87%E8%B7%A8%E5%9F%9F%E5%B9%B3%E7%A7%BB.html"},{"id":"n-4131289c","ch":6,"tier":"core","author":"22","title":"Moiré 物理與複雜系統（Moiré Physics & Complex Systems）","work":"領域分級精讀 / 統計物理、複雜系統與PDE算子","owns":"當微觀個體原本自由的獨立運動自由度（動能）被幾何干涉或競爭約束壓到趨近於零時，個體之間的交互作用、拓撲幾何與集體阻挫就會主導整個系統，湧現出單一個體沒有的宏觀奇異相態（非常規超導、零場分數陳絕緣體、自旋玻璃相變與自組織臨界雪崩）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/22_moir%C3%A9%E7%89%A9%E7%90%86%E8%88%87%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1.html"},{"id":"n-7a3319d6","ch":6,"tier":"core","author":"27","title":"算子學習與 PDE 基礎模型（Operator Learning & PDE Foundation Models）","work":"領域分級精讀 / 統計物理、複雜系統與PDE算子","owns":"把深度學習從有限維固定像素網格上的向量擬合（R^n → R^m），推廣為無窮維函數空間之間的連續算子映射（G^dagger: A → U）。再把物理守恆律與辛幾何結構內嵌進神經網路，目標是做出能跨解析度、跨方程、以毫秒級速度推演真實物理世界演化的科學基礎模型。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/27_%E7%AE%97%E5%AD%90%E5%AD%B8%E7%BF%92%E8%88%87PDE%E5%9F%BA%E7%A4%8E%E6%A8%A1%E5%9E%8B.html"},{"id":"n-bbc7022e","ch":6,"tier":"core","author":"28","title":"非平衡態統計力學與隨機熱力學（Nonequilibrium Statistical Mechanics & Stochastic Thermodynamics）","work":"領域分級精讀 / 統計物理、複雜系統與PDE算子","owns":"十九世紀的古典熱力學第二定律是一條不等式（Δ S_{tot} ≥ 0），只適用於巨觀、緩慢、平衡態的系統。這個領域把它推廣到單一分子馬達、奈米晶片、活體細胞乃至生成式擴散模型，在任意劇烈的非平衡驅動下，給出單軌跡上的精確等式、資訊與能量的兌換率，以及最優傳輸幾何下的速度極限。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/28_%E9%9D%9E%E5%B9%B3%E8%A1%A1%E6%85%8B%E7%B5%B1%E8%A8%88%E5%8A%9B%E5%AD%B8%E8%88%87%E9%9A%A8%E6%A9%9F%E7%86%B1%E5%8A%9B%E5%AD%B8.html"},{"id":"n-94d49455","ch":6,"tier":"core","author":"34","title":"高維機率與隨機矩陣（High-Dimensional Probability & Random Matrix Theory）","work":"領域分級精讀 / 統計物理、複雜系統與PDE算子","owns":"空間維度 d 與矩陣尺寸 N 大到數千乃至數十億時，我們在二、三維世界養成的幾何直覺不再成立，取而代之的是兩種確定性的規律。一是測度集中：一切都縮聚到薄殼上，取值近乎常數。二是隨機矩陣譜的普適律：大量隨機耦合的特徵值會自動排成精確可解的確定性連續分佈。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/34_%E9%AB%98%E7%B6%AD%E6%A9%9F%E7%8E%87%E8%88%87%E9%9A%A8%E6%A9%9F%E7%9F%A9%E9%99%A3.html"},{"id":"n-c32fcae7","ch":6,"tier":"core","author":"35","title":"分數階微積分與非局域擴散（Fractional Calculus & Nonlocal Diffusion）","work":"領域分級精讀 / 統計物理、複雜系統與PDE算子","owns":"牛頓與萊布尼茲的微積分和布朗運動有兩個簡化假設：只看無窮小的鄰居（空間局域性），以及下一秒就忘記過去（馬可夫無記憶性）。這個領域放掉這兩個假設，改用奇異積分算子與冪律記憶核，精確刻畫自然界與複雜演算法中隨處可見的兩種現象：長程大跳躍（Lévy 飛行超擴散），以及在碎形陷阱中的長時間等待（長記憶次擴散）。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/E_%E7%B5%B1%E8%A8%88%E7%89%A9%E7%90%86%E3%80%81%E8%A4%87%E9%9B%9C%E7%B3%BB%E7%B5%B1%E8%88%87PDE%E7%AE%97%E5%AD%90/35_%E5%88%86%E6%95%B8%E9%9A%8E%E5%BE%AE%E7%A9%8D%E5%88%86%E8%88%87%E9%9D%9E%E5%B1%80%E5%9F%9F%E6%93%B4%E6%95%A3.html"},{"id":"n-87df9844","ch":7,"tier":"core","author":"07","title":"發展式學習：持續學習、主動推論、內在動機與開放式演化","work":"領域分級精讀 / 腦認知、生命形態、哲學與社會演化","owns":"發展式學習研究的是：一個能力受限的具身智能體，處在沒有固定題庫、沒有外部獎勵、世界又持續變動的開放環境裡，怎麼靠預測誤差最小化和內在好奇心驅動自己成長，並且在不忘掉舊本領的前提下持續長出新能力。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/F_%E8%85%A6%E8%AA%8D%E7%9F%A5%E3%80%81%E7%94%9F%E5%91%BD%E5%BD%A2%E6%85%8B%E3%80%81%E5%93%B2%E5%AD%B8%E8%88%87%E7%A4%BE%E6%9C%83%E6%BC%94%E5%8C%96/07_%E7%99%BC%E5%B1%95%E5%BC%8F%E5%AD%B8%E7%BF%92.html"},{"id":"n-478c6f86","ch":7,"tier":"core","author":"08","title":"情感腦認知：互補學習系統、評價理論、貝氏認知與 NeuroAI","work":"領域分級精讀 / 腦認知、生命形態、哲學與社會演化","owns":"情感腦認知（Affective & Cognitive Neuroscience / NeuroAI）研究人類大腦怎麼在樣本極少、風險又高的社交情境中做到系統性泛化與價值權衡。它靠的是海馬迴快速記下個例、新皮質慢慢萃取結構的雙記憶系統，加上因果心智模型，以及認知評價（Appraisal）的情緒機制。","skip":"","note":"","href":"02_%E9%A0%98%E5%9F%9F%E5%88%86%E7%B4%9A%E7%B2%BE%E8%AE%80/F_%E8%85%A6%E8%AA%8D%E7%9F%A5%E3%80%81%E7%94%9F%E5%91%BD%E5%BD%A2%E6%85%8B%E3%80%81%E5%93%B2%E5%AD%B8%E8%88%87%E7%A4%BE%E6%9C%83%E6%BC%94%E5%8C%96/08_%E6%83%85%E6%84%9F%E8%85%A6%E8%AA%8D%E7%9F%A5.html
